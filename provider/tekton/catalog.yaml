---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: yaml-lint
  annotations:
    pipemaster.dev/caveat: the cluster or hub task version may differ from the mapped behaviour
source: true
spec:
  params:
    - name: args
      default: --help
  steps:
    - name: lint-yaml-files
      image: docker.io/cytopia/yamllint:1.23@sha256:e9deea51bbdc35950cacf6594dab94100d9bbf5c987540b8874167d58e6bdce2
      script: |
        yamllint $(params.args)
