name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a queued run is not cancelled: a half-published
# site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so contents: read is repeated.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # docs/ also holds the provider pages, which GitHub renders from the repository.
      # Only the files the site serves are published.
      - name: Stage the published files
        run: |
          set -euo pipefail
          rm -rf .site
          mkdir .site
          for f in index.html CNAME robots.txt sitemap.xml; do
            cp "docs/$f" ".site/$f"
          done
          cp -R docs/data .site/data
          echo "publishing:"
          find .site -type f | sort | sed 's/^/  /'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload the staged site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./.site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
