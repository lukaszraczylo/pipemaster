# Action registry. Embedded in the binary; edit this file to add a mapping.
#
# actions:                      list, one entry per GitHub action
#   - match: owner/repo         case-insensitive, any ref
#     path: sub/dir             optional; monorepo subpath, must match exactly.
#                               An entry without path never matches a ref that has one.
#     targets:                  keyed by provider id (gha, gitlab, ...)
#       <provider id>:
#         kind: implicit|script|image|cache|artifact_upload|artifact_download|passthrough
#         image: "golang:{{go-version}}"   {{input}} is replaced from the step's `with`
#         defaults: {input: value}         used when the step omits the input
#         script: [lines]                  script kind only
#         with:                            maps a `with` input to the target's key;
#           in-key: out-key                unlisted inputs are reported as Unmapped
#           in-key: {to: out-key, transform: name}
#             transform (closed set; unknown name fails Load; default identity):
#               days        N -> "N days" (GitLab expire_in has no unit = seconds)
#               submodules  true|false|recursive -> normal|none|recursive
#               depth       non-negative integer, kept (0 = full history on both)
#               lines       multi-line string -> list of trimmed non-empty lines
#           exclude: out-key     lines only; `!pattern` entries go to this key
#                                (artifacts:exclude). Without it a negated entry
#                                makes the target lost: GitLab cache has no exclude.
#             A value a non-identity transform cannot convert (or an
#             expression) makes the target lost with a caveat. Identity
#             values holding `${{ }}` pass through raw and are listed in
#             Target.Templated for the emitter to translate.
#         support: {level: native|emulated|external|lost, strategy: "", caveat: ""}
#
# A missing image input (or only <input>-file) makes Lookup return level lost,
# as does an image input that is an expression or not a plain Docker tag.
# gha targets use kind passthrough: every input is kept verbatim.
#
# reverse: pinned GitHub actions emitted when converting GitLab to GHA.
#   keys: checkout, cache, upload, download. Format: owner/repo@ref.

actions:
  - match: actions/checkout
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: implicit
        with:
          fetch-depth: {to: GIT_DEPTH, transform: depth}
          submodules: {to: GIT_SUBMODULE_STRATEGY, transform: submodules}
        support: {level: native, strategy: runner clones the repository before the job}
      woodpecker:
        kind: implicit
        with:
          fetch-depth: {to: depth, transform: depth}
        support: {level: native, strategy: the default clone step runs before the steps}
      drone:
        kind: implicit
        with:
          fetch-depth: {to: depth, transform: depth}
        support: {level: native, strategy: the default clone step runs before the steps}

  - match: actions/cache
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: cache
        with:
          key: key
          path: {to: paths, transform: lines}
        support: {level: native, strategy: gitlab cache keyword}
      woodpecker:
        kind: cache
        with:
          key: key
          path: {to: paths, transform: lines}
        support: {level: emulated, strategy: shared workspace of the steps in one workflow, caveat: nothing persists between runs}
      drone:
        kind: cache
        with:
          key: key
          path: {to: paths, transform: lines}
        support: {level: emulated, strategy: shared workspace of the steps in one document, caveat: nothing persists between runs}

  - match: actions/upload-artifact
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: artifact_upload
        with:
          name: name
          path: {to: path, transform: lines, exclude: exclude}
          retention-days: {to: expire_in, transform: days}
        support: {level: native, strategy: gitlab artifacts keyword}
      woodpecker:
        kind: artifact_upload
        with:
          name: name
          path: {to: path, transform: lines}
        support: {level: emulated, strategy: shared workspace of the steps in one workflow, caveat: other workflows cannot read the files}
      drone:
        kind: artifact_upload
        with:
          name: name
          path: {to: path, transform: lines}
        support: {level: emulated, strategy: shared workspace of the steps in one document, caveat: other documents cannot read the files}

  - match: actions/download-artifact
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: artifact_download
        with: {name: name, path: path}
        support: {level: native, strategy: needs with artifacts}
      woodpecker:
        kind: artifact_download
        with: {name: name, path: path}
        support: {level: emulated, strategy: shared workspace of the steps in one workflow, caveat: only an upload in the same workflow is visible}
      drone:
        kind: artifact_download
        with: {name: name, path: path}
        support: {level: emulated, strategy: shared workspace of the steps in one document, caveat: only an upload in the same document is visible}

  - match: actions/setup-go
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: image
        image: "golang:{{go-version}}"
        support: {level: emulated, strategy: image selection, caveat: job image replaced}
      woodpecker:
        kind: image
        image: "golang:{{go-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}
      drone:
        kind: image
        image: "golang:{{go-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}

  - match: actions/setup-node
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: image
        image: "node:{{node-version}}"
        support: {level: emulated, strategy: image selection, caveat: job image replaced}
      woodpecker:
        kind: image
        image: "node:{{node-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}
      drone:
        kind: image
        image: "node:{{node-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}

  - match: actions/setup-python
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: image
        image: "python:{{python-version}}"
        support: {level: emulated, strategy: image selection, caveat: job image replaced}
      woodpecker:
        kind: image
        image: "python:{{python-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}
      drone:
        kind: image
        image: "python:{{python-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}

  - match: actions/setup-java
    targets:
      gha: {kind: passthrough, support: {level: native}}
      gitlab:
        kind: image
        image: "eclipse-temurin:{{java-version}}"
        support: {level: emulated, strategy: image selection, caveat: job image replaced}
      woodpecker:
        kind: image
        image: "eclipse-temurin:{{java-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}
      drone:
        kind: image
        image: "eclipse-temurin:{{java-version}}"
        support: {level: emulated, strategy: image selection, caveat: later steps without an image run in this image}

# Versions checked 2026-11-18 via the GitHub releases API (latest release, major tag).
reverse:
  checkout: actions/checkout@v7
  cache: actions/cache@v6
  upload: actions/upload-artifact@v7
  download: actions/download-artifact@v8
