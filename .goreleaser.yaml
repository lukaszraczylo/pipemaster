version: 2
project_name: pipemaster

builds:
  - main: ./cmd/pipemaster
    binary: pipemaster
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/lukaszraczylo/pipemaster/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/versions.md
      - docs/providers/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test"
      - "^chore"
      - "^style:"

release:
  github:
    owner: lukaszraczylo
    name: pipemaster
