version: 2
project_name: pipemaster

builds:
  - main: ./cmd/pipemaster
    binary: pipemaster
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/lukaszraczylo/pipemaster/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/versions.md
      - docs/providers/*.md
      - actions/mappings.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test"
      - "^chore"
      - "^style:"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Keyless cosign signature of the checksum file; the release job has id-token: write.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: lukaszraczylo
    name: pipemaster
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto

homebrew_casks:
  - name: pipemaster
    repository:
      owner: lukaszraczylo
      name: homebrew-taps
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://pipemaster.raczylo.com
    description: "Convert CI/CD pipelines between nine providers, with a loss report for every feature"
    license: MIT
    # Homebrew rejects a postflight block (Cask/InstallSteps); install_steps writes postflight_steps.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/pipemaster"]
          end
