# pipemaster:emulated job.runner pipeline/gitlab-ci/job/compile
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/lint
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/ship
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/unit
on:
  push:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make
  lint:
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make lint
  ship:
    needs:
      - compile
      - lint
      - unit
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make ship
  unit:
    needs:
      - compile
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make test
