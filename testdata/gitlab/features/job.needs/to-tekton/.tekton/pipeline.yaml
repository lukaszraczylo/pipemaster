apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: compile
      taskRef:
        name: gitlab-ci-compile
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
    - name: lint
      taskRef:
        name: gitlab-ci-lint
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
    - name: ship
      taskRef:
        name: gitlab-ci-ship
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
        - lint
        - unit
    - name: unit
      taskRef:
        name: gitlab-ci-unit
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
