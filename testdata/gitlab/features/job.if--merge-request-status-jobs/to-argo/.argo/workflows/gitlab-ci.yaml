apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-event
        value: ""
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  hooks:
    exit:
      template: exit-handler
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
            when: '{{= !(workflow.parameters[''ctx-event''] == ''pull_request'') }}'
          - name: mrjob
            template: mrjob
            dependencies:
              - build
            when: '{{= workflow.parameters[''ctx-event''] == ''pull_request'' }}'
    - name: exit-handler
      dag:
        tasks:
          - name: cleanup
            template: cleanup
            when: '{{= !(workflow.parameters[''ctx-event''] == ''pull_request'') }}'
          - name: onfail
            template: onfail
            when: '{{= (!(workflow.parameters[''ctx-event''] == ''pull_request'')) && (workflow.status == ''Failed'') }}'
    - name: build
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.20
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo build
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
    - name: mrjob
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.20
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo mr
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
    - name: cleanup
      containerSet:
        containers:
          - name: script
            image: alpine:3.20
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo cleanup
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: onfail
      containerSet:
        containers:
          - name: script
            image: alpine:3.20
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo onfail
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
