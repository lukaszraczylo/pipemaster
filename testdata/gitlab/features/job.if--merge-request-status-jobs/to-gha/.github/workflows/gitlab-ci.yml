on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  build:
    if: '!(github.event_name == ''pull_request'') && !github.event.deleted'
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'echo build'
  mrjob:
    needs:
      - build
    if: github.event_name == 'pull_request' && !github.event.deleted
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/mrjob/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'echo mr'
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  cleanup:
    needs:
      - build
      - mrjob
    if: always() && !(github.event_name == 'pull_request') && !github.event.deleted
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/cleanup/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'echo cleanup'
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  onfail:
    needs:
      - build
      - mrjob
    if: always() && (!(github.event_name == 'pull_request') && failure()) && !github.event.deleted
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/onfail/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'echo onfail'
