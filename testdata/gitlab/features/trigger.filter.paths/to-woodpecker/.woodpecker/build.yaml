# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:emulated trigger.filter.paths pipeline/gitlab-ci
# pipemaster:arg "- kind: pr\n  paths:\n    exclude:\n        - '**.md'\n- kind: push\n  paths:\n    include:\n        - src/**\n        - '!src/docs/**'\n"
when:
  - event: pull_request
    path:
      exclude:
        - '**.md'
  - event: push
    path:
      include:
        - src/**
      exclude:
        - src/docs/**
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo ok
