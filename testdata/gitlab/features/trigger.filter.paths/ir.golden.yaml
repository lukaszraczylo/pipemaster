origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            workflow:
                rules:
                    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
                    - changes:
                        - src/**
                      if: $CI_COMMIT_BRANCH
      id: gitlab-ci
      triggers:
        - kind: pr
          paths:
            exclude:
                - '**.md'
        - kind: push
          paths:
            include:
                - src/**
                - '!src/docs/**'
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gitlab:
                    section: script
              id: build-step-1
              kind: script
              script:
                - echo ok
