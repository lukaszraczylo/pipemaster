# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/release
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/release
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/release/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/release
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    tags:
      - v**
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  release:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make release
        shell: bash
