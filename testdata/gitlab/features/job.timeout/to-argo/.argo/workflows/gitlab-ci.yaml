apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      timeout: 1h30m0s
      volumes:
        - emptyDir: {}
          name: workspace
