# pipemaster:emulated job.container pipeline/gitlab-ci/job/experimental
# pipemaster:emulated job.allow_failure pipeline/gitlab-ci/job/experimental
kind: pipeline
type: docker
name: experimental
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - make experimental
    failure: ignore
