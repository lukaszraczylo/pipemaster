origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: experimental
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make experimental
          allow_failure: true
