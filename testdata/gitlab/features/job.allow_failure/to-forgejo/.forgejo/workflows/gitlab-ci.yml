# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/experimental
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/experimental
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  experimental:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make experimental
