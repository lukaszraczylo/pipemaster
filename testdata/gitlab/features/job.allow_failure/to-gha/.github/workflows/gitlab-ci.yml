# pipemaster:emulated job.if pipeline/gitlab-ci/job/experimental
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/experimental
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/experimental/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/experimental
# pipemaster:arg {"pre":1,"post":0}
on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  experimental:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make experimental
        shell: bash
