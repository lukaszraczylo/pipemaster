# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/publish
# pipemaster:arg {"src":"branch == default_branch"}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/publish
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/publish/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/publish
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
  # pipemaster:emulated job.manual pipeline/gitlab-ci/job/publish
  workflow_dispatch:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # pipemaster:emulated job.manual pipeline/gitlab-ci/job/publish
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make publish
        shell: bash
