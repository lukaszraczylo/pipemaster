origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - if: branch == default_branch
          id: publish
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make publish
          manual: true
