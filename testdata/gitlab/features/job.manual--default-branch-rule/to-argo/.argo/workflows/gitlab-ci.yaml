# pipemaster:emulated job.if pipeline/gitlab-ci/job/publish
# pipemaster:arg {"job":"if: branch == gitlab.CI_DEFAULT_BRANCH\nid: \"\"\n"}
# pipemaster:emulated job.manual pipeline/gitlab-ci/job/publish
# pipemaster:arg {"manual":true}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/publish/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: publish-gate
            template: publish-gate
          - name: publish
            template: publish
            dependencies:
              - publish-gate
            when: '{{= false }}'
    - name: publish-gate
      suspend: {}
    - name: publish
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make publish
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
