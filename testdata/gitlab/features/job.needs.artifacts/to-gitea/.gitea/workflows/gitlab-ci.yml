on:
  push:
jobs:
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make
        shell: bash
      # pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/compile
      - uses: actions/upload-artifact@v7
        with:
          name: compile
          path: bin/
  docs:
    needs:
      - compile
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make docs
        shell: bash
  unit:
    needs:
      - compile
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated job.needs.artifacts pipeline/gitlab-ci/job/unit
      - uses: actions/download-artifact@v8
        with:
          name: compile
      - id: script
        run: make test
        shell: bash
