# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  workspaces:
    - name: pipemaster-workspace
  tasks:
    - name: compile
      taskRef:
        name: gitlab-ci-compile
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      workspaces:
        - name: pipemaster-workspace
          workspace: pipemaster-workspace
    - name: docs
      taskRef:
        name: gitlab-ci-docs
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
    - name: unit
      taskRef:
        name: gitlab-ci-unit
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
      workspaces:
        - name: pipemaster-workspace
          workspace: pipemaster-workspace
