origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            stages:
                - build
                - test
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            gitlab:
                stage: build
          id: compile
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make
          artifacts:
            - paths:
                - bin/
        - ext:
            gitlab:
                stage: test
          id: docs
          needs:
            - job: compile
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make docs
        - ext:
            gitlab:
                _derived_needs: true
                stage: test
          id: unit
          needs:
            - job: compile
              artifacts: true
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make test
