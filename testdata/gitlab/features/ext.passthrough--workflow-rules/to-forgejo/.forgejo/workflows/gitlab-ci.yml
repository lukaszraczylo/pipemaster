on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/build: opaque(gitlab): workflow:\n    name: $PIPELINE_NAME\n    rules:\n        - if: $CI_COMMIT_TAG\n          when: never\n        - if: $CI_PIPELINE_SOURCE == "merge_request_event"\n          variables:\n            PIPELINE_NAME: MR pipeline\n        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH\n          variables:\n            PIPELINE_NAME: Default branch pipeline\n
      - id: script
        run: make build
