# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/build
# pipemaster:arg {"src":"((event == 'merge_request_event') \u0026\u0026 !tag) || ((branch == default_branch) \u0026\u0026 !tag \u0026\u0026 !(event == 'merge_request_event'))","guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: (github.event_name == 'pull_request' && !(github.ref_type == 'tag' && github.ref_name) || github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && !(github.ref_type == 'tag' && github.ref_name) && !(github.event_name == 'pull_request')) && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make build
