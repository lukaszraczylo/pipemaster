origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            workflow:
                name: $PIPELINE_NAME
                rules:
                    - if: $CI_COMMIT_TAG
                      when: never
                    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
                      variables:
                        PIPELINE_NAME: MR pipeline
                    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
                      variables:
                        PIPELINE_NAME: Default branch pipeline
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - if: ((event == 'merge_request_event') && !tag) || ((branch == default_branch) && !tag && !(event == 'merge_request_event'))
          id: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make build
