origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            workflow:
                rules:
                    - if: $CI_COMMIT_TAG
      id: gitlab-ci
      triggers:
        - kind: tag
      jobs:
        - id: release
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make release
