apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: noop
            template: noop
    - name: noop
      containerSet:
        containers:
          - name: main
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - "true"
