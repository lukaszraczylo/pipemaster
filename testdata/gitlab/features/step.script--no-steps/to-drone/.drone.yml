# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make build'
---
# pipemaster:emulated step.script pipeline/gitlab-ci/job/downstream
# pipemaster:emulated job.container pipeline/gitlab-ci/job/downstream
kind: pipeline
type: docker
name: downstream
trigger:
  event:
    - push
    - tag
depends_on:
  - build
steps:
  - name: noop
    image: ubuntu:latest
    commands:
      - 'printf ''%s\n'' ''pipemaster: lost: step.script pipeline/gitlab-ci/job/downstream: the job starts the pipeline of project group/other and the target has no cross-project trigger; start that pipeline by hand or with an API call'' >&2; exit 1'
