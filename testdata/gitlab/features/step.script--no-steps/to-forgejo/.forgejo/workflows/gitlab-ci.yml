# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"pre":1,"post":0}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/downstream
# pipemaster:emulated step.script pipeline/gitlab-ci/job/downstream
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make build
  downstream:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - run: "true"
