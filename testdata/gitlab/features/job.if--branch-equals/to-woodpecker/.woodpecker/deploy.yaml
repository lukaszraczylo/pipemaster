# pipemaster:emulated job.container pipeline/gitlab-ci/job/deploy
# pipemaster:emulated job.if pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"src":"branch == 'main'","from":"gitlab","gate":false}
when:
  - event: push
    evaluate: '!(CI_PIPELINE_EVENT matches "(?i)^pull_request$$") && CI_COMMIT_BRANCH == "main"'
  - event: tag
    evaluate: '!(CI_PIPELINE_EVENT matches "(?i)^pull_request$$") && CI_COMMIT_BRANCH == "main"'
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - make deploy
