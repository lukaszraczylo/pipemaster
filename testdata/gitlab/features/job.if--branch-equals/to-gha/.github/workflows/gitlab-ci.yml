on:
  push:
jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make deploy
        shell: bash
