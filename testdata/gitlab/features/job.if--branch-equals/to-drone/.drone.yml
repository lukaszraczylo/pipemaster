# pipemaster:emulated job.if pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"if":"branch == 'main'","back":"(event == 'push') \u0026\u0026 (branch == 'main')","triggers":"- kind: push\n- kind: tag\n"}
# pipemaster:emulated job.container pipeline/gitlab-ci/job/deploy
kind: pipeline
type: docker
name: deploy
trigger:
  event:
    - push
    - tag
  branch:
    - main
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - make deploy
