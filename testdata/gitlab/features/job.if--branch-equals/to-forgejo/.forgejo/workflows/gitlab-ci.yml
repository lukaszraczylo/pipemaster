# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"src":"branch == 'main'"}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/deploy
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make deploy
