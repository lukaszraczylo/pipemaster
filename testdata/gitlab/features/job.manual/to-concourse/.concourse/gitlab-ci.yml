resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: deploy
    plan:
      - try:
          do:
            - get: source
            - task: script
              input_mapping:
                workspace: source
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source:
                    repository: ubuntu
                    tag: latest
                inputs:
                  - name: workspace
                outputs:
                  - name: workspace
                run:
                  path: sh
                  args:
                    - -c
                    - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                    - pipemaster
                    - make deploy
                  dir: workspace
  - name: deploy-tag
    plan:
      - try:
          do:
            - get: source-tags
            - task: script
              input_mapping:
                workspace: source-tags
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source:
                    repository: ubuntu
                    tag: latest
                inputs:
                  - name: workspace
                outputs:
                  - name: workspace
                run:
                  path: sh
                  args:
                    - -c
                    - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                    - pipemaster
