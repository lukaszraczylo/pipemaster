# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.manual pipeline/gitlab-ci/job/deploy
# pipemaster:arg "- kind: manual\n- kind: push\n- kind: schedule\n- kind: tag\n"
# pipemaster:emulated job.container pipeline/gitlab-ci/job/deploy
# pipemaster:emulated job.allow_failure pipeline/gitlab-ci/job/deploy
kind: pipeline
type: docker
name: deploy
trigger:
  event:
    - custom
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make deploy'
    failure: ignore
