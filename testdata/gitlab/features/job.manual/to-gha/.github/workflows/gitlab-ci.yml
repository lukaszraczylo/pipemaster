on:
  push:
  # pipemaster:emulated job.manual pipeline/gitlab-ci/job/deploy
  workflow_dispatch:
jobs:
  # pipemaster:emulated job.manual pipeline/gitlab-ci/job/deploy
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
