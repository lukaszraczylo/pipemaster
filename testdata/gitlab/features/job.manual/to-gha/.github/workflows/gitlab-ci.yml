# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"source_events":["manual","schedule","api"]}
# pipemaster:emulated trigger.api pipeline/gitlab-ci/trigger/4
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/deploy
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/deploy/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"pre":1,"post":0}
on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  # pipemaster:emulated job.manual pipeline/gitlab-ci/job/deploy
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make deploy
        shell: bash
