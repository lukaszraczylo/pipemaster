# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
    - name: test
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make test
            workingDir: /workspace
            env:
              - name: IMAGE
                value: $CI_REGISTRY_IMAGE/tmp:{{workflow.parameters.ctx-sha}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
