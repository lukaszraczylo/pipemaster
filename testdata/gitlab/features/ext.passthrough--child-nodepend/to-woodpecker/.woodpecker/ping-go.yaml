# pipemaster:emulated job.container pipeline/gitlab-ci/job/ping-go
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
when:
  - event: push
  - event: tag
  - event:
      - manual
      - cron
depends_on:
  - build
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make notify'
