# pipemaster:arg {"arts":"- name: pkg-$\u007b{ sha }}\n  paths:\n    - out/\n","names":["pkg-----sha"],"outs":["{\"name\":\"pkg-----sha\",\"path\":\"/workspace/out/\"}"]}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      outputs:
        artifacts:
          - name: pkg-----sha
            path: /workspace/out/
      volumes:
        - emptyDir: {}
          name: workspace
