# pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"workspace":"pipemaster-workspace","save":"set -e\nmkdir -p '/pipemaster/artifacts/pkg-____sha___'\ntar -cf - 'out/' | tar -xf - -C '/pipemaster/artifacts/pkg-____sha___'","artifacts":[{"Name":"pkg-$\u007b{ sha }}","Expire":"","Paths":["out/"]}]}
# pipemaster:emulated step.workdir pipeline/gitlab-ci/job/build
# pipemaster:arg {"dir":"/workspace"}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-build
spec:
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: script
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make
    - name: pipemaster-artifacts-save
      image: alpine:3.22
      script: |-
        set -e
        mkdir -p '/pipemaster/artifacts/pkg-____sha___'
        tar -cf - 'out/' | tar -xf - -C '/pipemaster/artifacts/pkg-____sha___'
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
