# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg [{"Name":"pkg-$$\u007b{ sha }}","Expire":"","Paths":["out/"]}]
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make'
