on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  release-created:
    needs:
      - build
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fail
        if: '!(github.ref_type == ''branch'' && github.ref_name == ''main'')'
        run: exit 1
        shell: bash
      - id: pass
        run: "true"
        shell: bash
  release-publish:
    needs:
      - build
      - release-created
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make publish
        shell: bash
