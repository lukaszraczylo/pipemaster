on:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  release-publish:
    needs:
      - build
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make publish
        shell: bash
