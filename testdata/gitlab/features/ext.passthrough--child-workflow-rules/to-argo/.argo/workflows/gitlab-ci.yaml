# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated step.if pipeline/gitlab-ci/job/release-created/step/fail
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/release-created/step/fail
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/release-created/step/pass
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/release-publish/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
          - name: release-created
            template: release-created
            dependencies:
              - build
          - name: release-publish
            template: release-publish
            dependencies:
              - build
              - release-created
            when: '{{= workflow.parameters[''ctx-branch''] == ''main'' }}'
    - name: build
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make build
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: release-created
      containerSet:
        containers:
          - name: fail
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                if ! ( ! [ "$PM_CTX_BRANCH" = 'main' ] ); then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                exit 1
            workingDir: /workspace
            env:
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
          - name: pass
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - "true"
            workingDir: /workspace
            dependencies:
              - fail
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: release-publish
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make publish
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
