kind: pipeline
type: docker
name: release-created
trigger:
  event:
    - push
    - tag
    - cron
    - custom
depends_on:
  - build
steps:
  - name: fail
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'exit 1'
    when:
      branch:
        exclude:
          - main
  - name: pass
