# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make build'
---
# pipemaster:emulated job.container pipeline/gitlab-ci/job/release-created
kind: pipeline
type: docker
name: release-created
trigger:
  event:
    - push
    - tag
depends_on:
  - build
steps:
  - name: fail
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'exit 1'
    when:
      branch:
        exclude:
          - main
  - name: pass
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'true'
---
# pipemaster:emulated job.if pipeline/gitlab-ci/job/release-publish
# pipemaster:arg {"if":"branch == 'main'","back":"(event == 'push') \u0026\u0026 (branch == 'main')","triggers":"- kind: push\n- kind: tag\n"}
# pipemaster:emulated job.container pipeline/gitlab-ci/job/release-publish
kind: pipeline
type: docker
name: release-publish
trigger:
  event:
    - push
    - tag
  branch:
    - main
depends_on:
  - build
  - release-created
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make publish'
