# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg "- name: SHARED\n  value:\n    lit: \"1\"\n"
# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:arg {"Ref":"alpine:3","Entrypoint":null,"taken":1}
kind: pipeline
type: docker
name: build
environment:
  SHARED: "1"
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: alpine:3
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make'
---
# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg "- name: SHARED\n  value:\n    lit: \"1\"\n"
# pipemaster:emulated job.container pipeline/gitlab-ci/job/common
# pipemaster:arg {"Ref":"alpine:3","Entrypoint":null,"taken":1}
kind: pipeline
type: docker
name: common
environment:
  SHARED: "1"
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: alpine:3
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo common'
---
# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg "- name: SHARED\n  value:\n    lit: \"1\"\n"
# pipemaster:emulated job.container pipeline/gitlab-ci/job/prod
# pipemaster:arg {"Ref":"alpine:3","Entrypoint":null,"taken":1}
kind: pipeline
type: docker
name: prod
environment:
  SHARED: "1"
trigger:
  event:
    - push
    - tag
depends_on:
  - build
  - common
steps:
  - name: script
    image: alpine:3
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster './deploy.sh'
