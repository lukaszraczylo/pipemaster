# pipemaster:emulated pipeline.env pipeline/gitlab-ci/job/prod
# pipemaster:arg {"names":["SHARED"]}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/prod/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-prod
spec:
  stepTemplate:
    image: alpine:3
    env:
      - name: SHARED
        value: "1"
  steps:
    - name: script
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        ./deploy.sh
