apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
          - name: common
            template: common
          - name: prod
            template: prod
            dependencies:
              - build
              - common
    - name: build
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make
            workingDir: /workspace
            env:
              - name: SHARED
                value: "1"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      retryStrategy:
        limit: "1"
      volumes:
        - emptyDir: {}
          name: workspace
    - name: common
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo common
            workingDir: /workspace
            env:
              - name: SHARED
                value: "1"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      retryStrategy:
        limit: "1"
      volumes:
        - emptyDir: {}
          name: workspace
    - name: prod
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - ./deploy.sh
            workingDir: /workspace
            env:
              - name: SHARED
                value: "1"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      retryStrategy:
        limit: "1"
      volumes:
        - emptyDir: {}
          name: workspace
