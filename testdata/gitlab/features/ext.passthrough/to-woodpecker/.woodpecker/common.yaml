# pipemaster:emulated job.container pipeline/gitlab-ci/job/common
# pipemaster:arg {"Ref":"alpine:3","Entrypoint":null}
# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg "- name: SHARED\n  value:\n    lit: \"1\"\n"
when:
  - event: push
  - event: tag
steps:
  - name: script
    image: alpine:3
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo common'
    environment:
      SHARED: "1"
