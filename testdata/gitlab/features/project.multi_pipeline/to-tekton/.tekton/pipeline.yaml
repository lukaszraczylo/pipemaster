# pipemaster:emulated ext.passthrough pipeline/.shared
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  # pipemaster:id .shared
  name: shared
spec:
  displayName: shared
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: run
      taskRef:
        name: shared-run
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
