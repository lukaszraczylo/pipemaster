apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # pipemaster:id .shared
  name: shared
  annotations:
    workflows.argoproj.io/title: shared
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
