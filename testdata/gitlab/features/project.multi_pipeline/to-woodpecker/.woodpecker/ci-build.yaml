# pipemaster:emulated project.multi_pipeline pipeline/ci
# pipemaster:arg {"pipeline":"ci","job":"build","p":1,"j":0}
# pipemaster:emulated job.container pipeline/ci/job/build
when:
  - event: push
labels:
  ubuntu-latest: "true"
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo build'
