# pipemaster:emulated step.image pipeline/gitlab-ci/job/integration-check-api/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/integration-check-api/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-integration-check-api
spec:
  stepTemplate:
    env:
      - name: TARGET
        value: staging
  steps:
    - name: script
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo "checking api on $TARGET"
