on:
  workflow_dispatch:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  ship:
    needs:
      - compile
      - integration-check-api
      - integration-check-ui
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make ship
        shell: bash
  integration-check-api:
    needs:
      - integration-seed
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    env:
      TARGET: staging
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: echo "checking api on $TARGET"
        shell: bash
  integration-check-ui:
    needs:
      - integration-seed
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    env:
      TARGET: staging
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: echo "checking ui on $TARGET"
        shell: bash
  integration-seed:
    needs:
      - compile
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    env:
      TARGET: staging
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: echo "seeding $TARGET"
        shell: bash
