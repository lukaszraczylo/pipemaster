# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/version
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: version-step-1
        run: make version
    outputs:
      tag: v1-${{ github.sha }}
