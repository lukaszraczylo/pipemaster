# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/version
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version-step-1
        run: make version
    outputs:
      tag: v1-${{ github.sha }}
