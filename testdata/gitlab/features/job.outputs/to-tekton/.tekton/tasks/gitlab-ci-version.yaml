# pipemaster:emulated job.runner pipeline/gitlab-ci/job/version
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/version/step/version-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-version
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: source-checkout
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: version-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make version
    - name: pipemaster-outputs
      image: alpine:3.22
      script: printf '%s' "${PM_OUT_0}" > '$(results.tag.path)'
      env:
        - name: PM_OUT_0
          value: v1-$(params.ctx-sha)
  results:
    - name: tag
