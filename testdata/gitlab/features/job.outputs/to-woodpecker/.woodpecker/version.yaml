# pipemaster:emulated job.container pipeline/gitlab-ci/job/version
when:
  - event: push
labels:
  ubuntu-latest: "true"
steps:
  - name: version-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make version'
