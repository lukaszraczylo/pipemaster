# pipemaster:emulated job.container pipeline/gitlab-ci/job/nightly
kind: pipeline
type: docker
name: nightly
trigger:
  event:
    - cron
  cron:
    - gitlab-ci-schedule-0
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make nightly'
