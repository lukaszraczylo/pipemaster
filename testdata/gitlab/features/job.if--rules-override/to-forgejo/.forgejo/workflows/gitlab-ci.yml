# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/unit
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/unit
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/unit
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  unit:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make test
