origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - concurrency:
        group: ci-
      ext:
        gitlab:
            workflow:
                rules:
                    - if: $CI_COMMIT_BRANCH
      id: gitlab-ci
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gitlab:
                    section: script
              id: build-step-1
              kind: script
              script:
                - echo ok
