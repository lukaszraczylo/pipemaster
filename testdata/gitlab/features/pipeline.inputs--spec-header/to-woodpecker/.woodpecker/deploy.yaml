# pipemaster:emulated job.container pipeline/gitlab-ci/job/deploy
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated trigger.push pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"gitlab_default":true}
# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg "- name: TAG\n  value:\n    lit: $$[[ inputs.image_tag ]]\n"
when:
  - event: push
  - event: tag
  - event:
      - manual
      - cron
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo deploy'
    environment:
      TAG: $$[[ inputs.image_tag ]]
