# pipemaster:arg {"types":{"dry_run":"boolean","image_tag":"string"}}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/deploy/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: dry_run
        value: "false"
      - name: env
        value: staging
      - name: image_tag
        value: latest
        description: Image tag to deploy
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy
            template: deploy
    - name: deploy
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo deploy
            workingDir: /workspace
            env:
              - name: TAG
                value: $[[ inputs.image_tag ]]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
