# pipemaster:emulated step.image pipeline/gitlab-ci/job/deploy/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated pipeline.env pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"names":["TAG"]}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/deploy/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-deploy
spec:
  stepTemplate:
    env:
      - name: TAG
        value: $[[ inputs.image_tag ]]
  steps:
    - name: script
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo deploy
