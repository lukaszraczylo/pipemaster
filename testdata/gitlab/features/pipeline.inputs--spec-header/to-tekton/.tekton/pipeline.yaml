# pipemaster:emulated pipeline.env pipeline/gitlab-ci
# pipemaster:arg {"env":"- name: TAG\n  value:\n    lit: $[[ inputs.image_tag ]]\n"}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: dry_run
      type: string
      default: "false"
    - name: env
      default: staging
    - name: image_tag
      type: string
      description: Image tag to deploy
      default: latest
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: deploy
      taskRef:
        name: gitlab-ci-deploy
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
