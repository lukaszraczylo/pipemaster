# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/deploy
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/deploy/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"pre":1,"post":0}
on:
  workflow_dispatch:
    inputs:
      dry_run:
        default: false
        type: boolean
      env:
        default: staging
      image_tag:
        description: Image tag to deploy
        default: latest
        type: string
  push:
env:
  TAG: $[[ inputs.image_tag ]]
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deploy:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: echo deploy
        shell: bash
