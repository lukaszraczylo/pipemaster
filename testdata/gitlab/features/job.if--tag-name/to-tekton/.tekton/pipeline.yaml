apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-tag
      default: ""
  tasks:
    - name: release
      taskRef:
        name: gitlab-ci-release
      params:
        - name: ctx-tag
          value: $(params.ctx-tag)
      when:
        - input: pipemaster-disabled
          operator: in
          values:
            - never
