# pipemaster:emulated job.if pipeline/gitlab-ci/job/release
# pipemaster:arg {"if":"tag","back":"(event == 'push') \u0026\u0026 startsWith(ref, 'refs/tags/')","triggers":"- kind: push\n- kind: tag\n"}
# pipemaster:emulated job.container pipeline/gitlab-ci/job/release
kind: pipeline
type: docker
name: release
trigger:
  event:
    - push
    - tag
  ref:
    - refs/tags/**
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make release'
