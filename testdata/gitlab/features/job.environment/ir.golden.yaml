origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - environment:
            name: production
            url: https://example.com
          id: deploy
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make deploy
