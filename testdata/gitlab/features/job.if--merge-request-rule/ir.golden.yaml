origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - container:
            ref: alpine:3.20
          id: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - echo build
        - if: event == 'merge_request_event'
          container:
            ref: alpine:3.20
          id: mrjob
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - echo mr
