apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: pipemaster
spec:
  dependencies:
    - eventName: pull_request
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.action
            type: string
            value:
              - ^opened$
              - ^synchronize$
        exprs:
          - expr: head == base
            fields:
              - name: head
                path: body.pull_request.head.repo.full_name
              - name: base
                path: body.repository.full_name
      name: gitlab-ci-pr
    - eventName: push
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - ^refs/heads/.*$
      name: gitlab-ci-push
    - eventName: push
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - ^refs/tags/.*$
      name: gitlab-ci-tag
  template:
    serviceAccountName: pipemaster-sensor
  triggers:
    - template:
        conditions: gitlab-ci-pr
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dependencyName: gitlab-ci-pr
                value: pull_request
            - dest: spec.arguments.parameters.1.value
              src:
                dataKey: body.pull_request.head.sha
                dependencyName: gitlab-ci-pr
            - dest: spec.arguments.parameters.2.value
              src:
                dataKey: body.repository.full_name
                dependencyName: gitlab-ci-pr
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: gitlab-ci-
              spec:
                arguments:
                  parameters:
                    - name: ctx-event
                      value: ""
                    - name: ctx-sha
                      value: ""
                    - name: ctx-repo
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: gitlab-ci
        name: gitlab-ci-pr
    - template:
        conditions: gitlab-ci-push
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dependencyName: gitlab-ci-push
                value: push
            - dest: spec.arguments.parameters.1.value
              src:
                dataKey: body.after
                dependencyName: gitlab-ci-push
            - dest: spec.arguments.parameters.2.value
              src:
                dataKey: body.repository.full_name
                dependencyName: gitlab-ci-push
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: gitlab-ci-
              spec:
                arguments:
                  parameters:
                    - name: ctx-event
                      value: ""
                    - name: ctx-sha
                      value: ""
                    - name: ctx-repo
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: gitlab-ci
        name: gitlab-ci-push
    - template:
        conditions: gitlab-ci-tag
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dependencyName: gitlab-ci-tag
                value: push
            - dest: spec.arguments.parameters.1.value
              src:
                dataKey: body.after
                dependencyName: gitlab-ci-tag
            - dest: spec.arguments.parameters.2.value
              src:
                dataKey: body.repository.full_name
                dependencyName: gitlab-ci-tag
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: gitlab-ci-
              spec:
                arguments:
                  parameters:
                    - name: ctx-event
                      value: ""
                    - name: ctx-sha
                      value: ""
                    - name: ctx-repo
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: gitlab-ci
        name: gitlab-ci-tag
