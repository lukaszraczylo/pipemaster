on:
  push:
    branches:
      - '**'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: build-step-1
        uses: actions/cache@v4
        with:
          key: go-mod
          path: ~/go/pkg/mod
      - id: build-step-2
        run: make build
        shell: bash
      - id: build-step-3
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  test:
    needs:
      - build
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: test-step-1
        uses: actions/download-artifact@v4
        with:
          name: dist
      - id: test-step-2
        run: make test
        shell: bash
