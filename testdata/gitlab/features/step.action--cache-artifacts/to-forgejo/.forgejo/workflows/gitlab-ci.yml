# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"pre":1,"post":0}
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/test
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: build-step-1
        uses: https://github.com/actions/cache@v4
        with:
          key: go-mod
          path: ~/go/pkg/mod
      - id: build-step-2
        run: make build
      - id: build-step-3
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: test-step-1
        uses: https://github.com/actions/download-artifact@v4
        with:
          name: dist
      - id: test-step-2
        run: make test
