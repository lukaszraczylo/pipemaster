              - sh
              - -ec
            args:
              - "true"
            workingDir: /workspace
            dependencies:
              - main
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
