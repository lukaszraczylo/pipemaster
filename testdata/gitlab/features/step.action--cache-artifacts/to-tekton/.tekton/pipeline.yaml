apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  workspaces:
    - name: pipemaster-workspace
  tasks:
    - name: build
      taskRef:
        name: gitlab-ci-build
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      workspaces:
        - name: pipemaster-workspace
          workspace: pipemaster-workspace
    - name: test
      taskRef:
        name: gitlab-ci-test
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - build
      workspaces:
        - name: pipemaster-workspace
          workspace: pipemaster-workspace
