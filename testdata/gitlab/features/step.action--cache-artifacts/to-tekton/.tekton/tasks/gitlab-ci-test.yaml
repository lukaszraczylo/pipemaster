apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-test
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: source-checkout
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: test-step-1
      image: alpine:3.22
      script: |-
        set -e
        mkdir -p '.'
        tar -cf - -C '/pipemaster/artifacts/dist' . | tar -xf - -C '.'
    - name: test-step-2
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make test
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
