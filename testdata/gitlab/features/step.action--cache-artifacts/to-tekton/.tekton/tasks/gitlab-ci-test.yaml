apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-test
spec:
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: test-step-1
      image: alpine:3.22
      script: |-
        set -e
        mkdir -p '.'
        tar -cf - -C '/pipemaster/artifacts/dist' . | tar -xf - -C '.'
    - name: test-step-2
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make test
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
