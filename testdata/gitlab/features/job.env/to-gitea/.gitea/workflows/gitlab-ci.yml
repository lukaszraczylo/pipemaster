on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      TAG: ${{ github.ref_type == 'tag' && github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make
        shell: bash
