origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            stages:
                - build
                - notify
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            gitlab:
                stage: build
          id: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make build
      finally:
        - if: failure()
          ext:
            gitlab:
                _derived_needs: true
                stage: notify
          id: alert
          needs:
            - job: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - ./page.sh
        - ext:
            gitlab:
                _derived_needs: true
                stage: notify
          id: report
          needs:
            - job: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - ./notify.sh
