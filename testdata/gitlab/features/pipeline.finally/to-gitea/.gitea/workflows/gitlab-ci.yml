on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  alert:
    needs:
      - build
    if: always() && failure() && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: ./page.sh
        shell: bash
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  report:
    needs:
      - build
    if: always() && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: ./notify.sh
        shell: bash
