on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make build
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  cleanup:
    needs:
      - compile
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/cleanup: opaque(gitlab): - if: $PIPELINE_TYPE =~ /_MR_PIPELINE$/\n
      - id: script
        run: make clean
