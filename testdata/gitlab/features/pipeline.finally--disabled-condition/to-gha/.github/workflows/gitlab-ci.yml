on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  cleanup:
    needs:
      - compile
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/cleanup: opaque(gitlab): - if: $PIPELINE_TYPE =~ /_MR_PIPELINE$/\n
      - id: script
        run: make clean
        shell: bash
