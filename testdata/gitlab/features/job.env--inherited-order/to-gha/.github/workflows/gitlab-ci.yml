# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/lint
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOCACHE: $CI_PROJECT_DIR/.cache/go-build
      GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    steps:
      - id: script
        run: make lint
