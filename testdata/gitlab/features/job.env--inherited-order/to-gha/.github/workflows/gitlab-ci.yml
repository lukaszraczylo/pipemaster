# pipemaster:emulated job.if pipeline/gitlab-ci/job/lint
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/lint
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/lint
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
jobs:
  lint:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    env:
      GOCACHE: $CI_PROJECT_DIR/.cache/go-build
      GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make lint
