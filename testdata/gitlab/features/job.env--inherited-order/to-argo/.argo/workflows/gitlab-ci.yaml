apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: lint
            template: lint
    - name: lint
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make lint
            workingDir: /workspace
            env:
              - name: GOCACHE
                value: $CI_PROJECT_DIR/.cache/go-build
              - name: GOMODCACHE
                value: $CI_PROJECT_DIR/.cache/go-mod
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
