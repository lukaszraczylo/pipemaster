# pipemaster:arg {"vars":"- name: GOCACHE\n  value:\n    lit: $CI_PROJECT_DIR/.cache/go-build\n- name: GOMODCACHE\n  value:\n    lit: $CI_PROJECT_DIR/.cache/go-mod\n","names":["GOCACHE","GOMODCACHE"]}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/lint/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: lint
            template: lint
    - name: lint
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - 'export PIPEMASTER_VARS=3; : "${CI_PROJECT_DIR:?pipemaster: lost: variable CI_PROJECT_DIR has no argo source}"; export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"; export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"; : pipemaster-end; make lint'
            workingDir: /workspace
            env:
              - name: GOCACHE
                value: $CI_PROJECT_DIR/.cache/go-build
              - name: GOMODCACHE
                value: $CI_PROJECT_DIR/.cache/go-mod
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
