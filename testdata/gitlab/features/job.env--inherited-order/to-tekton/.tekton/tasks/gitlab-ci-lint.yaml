# pipemaster:emulated step.image pipeline/gitlab-ci/job/lint/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/lint/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-lint
spec:
  stepTemplate:
    env:
      - name: GOCACHE
        value: $CI_PROJECT_DIR/.cache/go-build
      - name: GOMODCACHE
        value: $CI_PROJECT_DIR/.cache/go-mod
  steps:
    - name: script
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make lint
