resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: lint
    plan:
      - get: source
        trigger: true
      - task: script
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            GOCACHE: $CI_PROJECT_DIR/.cache/go-build
            GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
