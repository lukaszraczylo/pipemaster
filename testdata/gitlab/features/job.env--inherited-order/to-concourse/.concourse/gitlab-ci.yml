resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: lint
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: script
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            GOCACHE: $CI_PROJECT_DIR/.cache/go-build
            GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
          run:
            path: sh
            args:
              - -ec
              - make lint
