resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: lint
    plan:
      - get: source
        trigger: true
      - task: script
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            GOCACHE: $CI_PROJECT_DIR/.cache/go-build
            GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - 'export PIPEMASTER_VARS=3; : "${CI_PROJECT_DIR:?pipemaster: lost: variable CI_PROJECT_DIR has no concourse source}"; export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"; export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"; : pipemaster-end; make lint'
            dir: workspace
  - name: lint-tag
    plan:
      - get: source-tags
        trigger: true
      - task: script
        input_mapping:
          workspace: source-tags
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            GOCACHE: $CI_PROJECT_DIR/.cache/go-build
            GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - 'export PIPEMASTER_VARS=3; : "${CI_PROJECT_DIR:?pipemaster: lost: variable CI_PROJECT_DIR has no concourse source}"; export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"; export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"; : pipemaster-end; make lint'
            dir: workspace
