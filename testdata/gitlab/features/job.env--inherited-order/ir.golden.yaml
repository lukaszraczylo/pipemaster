origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            hidden:
                .go-cache:
                    variables:
                        GOCACHE: $CI_PROJECT_DIR/.cache/go-build
                        GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            gitlab:
                extends:
                    - .go-cache
          id: lint
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make lint
          env:
            - name: GOCACHE
              value:
                lit: $CI_PROJECT_DIR/.cache/go-build
            - name: GOMODCACHE
              value:
                lit: $CI_PROJECT_DIR/.cache/go-mod
