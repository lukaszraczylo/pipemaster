# pipemaster:emulated job.container pipeline/gitlab-ci/job/lint
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated job.env pipeline/gitlab-ci/job/lint
# pipemaster:arg "- name: GOCACHE\n  value:\n    lit: $$CI_PROJECT_DIR/.cache/go-build\n- name: GOMODCACHE\n  value:\n    lit: $$CI_PROJECT_DIR/.cache/go-mod\n"
when:
  - event: push
  - event: tag
  - event:
      - manual
      - cron
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - 'sh -c ''if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"'' pipemaster ''export PIPEMASTER_VARS=3; export CI_PROJECT_DIR="$${CI_WORKSPACE}"; export GOCACHE="$$CI_PROJECT_DIR/.cache/go-build"; export GOMODCACHE="$$CI_PROJECT_DIR/.cache/go-mod"; : pipemaster-end; make lint'''
    environment:
      GOCACHE: $$CI_PROJECT_DIR/.cache/go-build
      GOMODCACHE: $$CI_PROJECT_DIR/.cache/go-mod
