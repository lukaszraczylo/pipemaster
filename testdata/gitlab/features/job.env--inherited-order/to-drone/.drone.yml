# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.container pipeline/gitlab-ci/job/lint
kind: pipeline
type: docker
name: lint
environment:
  GOCACHE: $$CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $$CI_PROJECT_DIR/.cache/go-mod
trigger:
  event:
    - push
    - tag
    - cron
    - custom
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - 'sh -c ''if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"'' pipemaster ''export PIPEMASTER_VARS=3; export CI_PROJECT_DIR="$${DRONE_WORKSPACE}"; export GOCACHE="$$CI_PROJECT_DIR/.cache/go-build"; export GOMODCACHE="$$CI_PROJECT_DIR/.cache/go-mod"; : pipemaster-end; make lint'''
