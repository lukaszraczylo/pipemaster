# pipemaster:emulated job.container pipeline/gitlab-ci/job/cleanup
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated trigger.push pipeline/gitlab-ci/job/cleanup
# pipemaster:arg {"gitlab_default":true}
# pipemaster:emulated pipeline.finally pipeline/gitlab-ci
# pipemaster:arg {"needs":[{"JobID":"compile","Artifacts":false,"Optional":false}],"noIf":true}
when:
  - event: push
    status:
      - success
      - failure
  - event: tag
    status:
      - success
      - failure
  - event:
      - manual
      - cron
    status:
      - success
      - failure
depends_on:
  - name: compile
    optional: true
  - name: lint
    optional: true
  - name: summary
    optional: true
  - name: unit
    optional: true
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make clean'
