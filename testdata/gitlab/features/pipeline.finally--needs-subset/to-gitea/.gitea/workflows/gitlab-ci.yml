on:
  push:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make lint
  summary:
    needs:
      - compile
      - lint
      - unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make report
  unit:
    needs:
      - compile
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make test
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  cleanup:
    needs:
      - compile
      - lint
      - summary
      - unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make clean
