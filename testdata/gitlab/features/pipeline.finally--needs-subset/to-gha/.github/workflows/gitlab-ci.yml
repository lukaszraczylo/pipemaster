on:
  push:
jobs:
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  lint:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make lint
        shell: bash
  summary:
    needs:
      - compile
      - lint
      - unit
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make report
        shell: bash
  unit:
    needs:
      - compile
      - lint
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make test
        shell: bash
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  cleanup:
    needs:
      - compile
      - lint
      - summary
      - unit
    if: always() && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make clean
        shell: bash
