# pipemaster:emulated step.shell pipeline/gitlab-ci/job/compile/step/script
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/lint/step/script
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/summary/step/script
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/unit/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
