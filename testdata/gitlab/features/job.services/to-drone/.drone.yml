# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.container pipeline/gitlab-ci/job/test
# pipemaster:arg {"Ref":"golang:1.22","Entrypoint":null,"taken":1}
kind: pipeline
type: docker
name: test
trigger:
  event:
    - push
    - tag
    - cron
    - custom
steps:
  - name: script
    image: golang:1.22
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make test'
services:
  - name: postgres
    image: postgres:15
  - name: cache
    image: redis:7
