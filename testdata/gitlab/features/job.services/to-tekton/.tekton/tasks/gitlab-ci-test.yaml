# pipemaster:emulated job.services pipeline/gitlab-ci/job/test
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/test/step/script
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-test
spec:
  stepTemplate:
    image: golang:1.22
  steps:
    - name: script
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make test
  sidecars:
    - name: postgres
      image: postgres:15
    - name: cache
      image: redis:7
