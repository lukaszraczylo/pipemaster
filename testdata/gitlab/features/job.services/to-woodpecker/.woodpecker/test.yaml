# pipemaster:emulated job.container pipeline/gitlab-ci/job/test
# pipemaster:arg {"Ref":"golang:1.22","Entrypoint":null}
when:
  - event: push
  - event: tag
steps:
  - name: script
    image: golang:1.22
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make test'
services:
  postgres:
    image: postgres:15
  cache:
    image: redis:7
