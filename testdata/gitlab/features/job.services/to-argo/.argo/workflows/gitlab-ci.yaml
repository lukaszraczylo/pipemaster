# pipemaster:emulated job.services pipeline/gitlab-ci/job/test
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/test/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
    - name: test
      containerSet:
        containers:
          - name: script
            image: golang:1.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make test
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      sidecars:
        - name: postgres
          image: postgres:15
        - name: cache
          image: redis:7
      volumes:
        - emptyDir: {}
          name: workspace
