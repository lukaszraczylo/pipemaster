# pipemaster:emulated job.if pipeline/gitlab-ci/job/test
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/test
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/test
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
jobs:
  test:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    container: golang:1.22
    services:
      postgres:
        image: postgres:15
      cache:
        image: redis:7
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/test/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'make test'
