on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: build-step-1
        if: always()
        run: echo cleanup
      - id: build-step-2
        if: github.event_name == 'push'
        run: echo push
