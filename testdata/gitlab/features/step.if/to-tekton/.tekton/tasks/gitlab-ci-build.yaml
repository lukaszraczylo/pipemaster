apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-build
spec:
  params:
    - name: ctx-event
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: echo cleanup
    - name: build-step-2
      image: alpine:3.22
      script: echo push
      when:
        - input: $(params.ctx-event)
          operator: in
          values:
            - push
