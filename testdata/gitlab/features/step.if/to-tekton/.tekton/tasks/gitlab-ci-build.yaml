# pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/build-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/build-step-2
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated step.workdir pipeline/gitlab-ci/job/build
# pipemaster:arg {"dir":"/workspace"}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/build-step-1
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/build-step-2
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-build
spec:
  params:
    - name: ctx-event
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo cleanup
    - name: build-step-2
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo push
      when:
        - input: $(params.ctx-event)
          operator: in
          values:
            - push
