# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo cleanup
    when:
      status:
        - success
        - failure
  - name: build-step-2
    image: ubuntu:latest
    commands:
      - echo push
    when:
      event:
        - push
        - tag
