origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            workflow:
                rules:
                    - if: $CI_COMMIT_BRANCH
      id: gitlab-ci
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - if: always()
              id: build-step-1
              kind: script
              script:
                - echo cleanup
            - if: event == 'push'
              ext:
                gitlab:
                    section: script
              id: build-step-2
              kind: script
              script:
                - echo push
