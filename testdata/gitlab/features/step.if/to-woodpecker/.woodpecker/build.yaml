# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:emulated step.if pipeline/gitlab-ci/job/build/step/build-step-2
# pipemaster:arg {"src":"event == 'push'","from":"gitlab","branch":true}
when:
  - event: push
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo cleanup'
    when:
      - status:
          - success
          - failure
  - name: build-step-2
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo push'
    when:
      - event:
          - push
          - tag
