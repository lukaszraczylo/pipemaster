on:
  push:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: build-step-1
        if: always()
        run: echo cleanup
      - id: build-step-2
        if: github.event_name == 'push' && !github.event.deleted
        run: echo push
