apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-event
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - 'exit 0 # pipemaster:lost the step condition has no shell form'
            workingDir: /workspace
          - name: build-step-2
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - |-
                if ! [ "$PM_CTX_EVENT" = 'push' ]; then exit 0; fi # pipemaster:guard
                echo push
            workingDir: /workspace
            env:
              - name: PM_CTX_EVENT
                value: '{{workflow.parameters.ctx-event}}'
            dependencies:
              - build-step-1
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
