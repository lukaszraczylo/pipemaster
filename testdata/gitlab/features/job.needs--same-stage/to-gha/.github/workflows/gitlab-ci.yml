on:
  push:
jobs:
  check:
    needs:
      - compile
      - package
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make check
        shell: bash
  compile:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make compile
        shell: bash
  package:
    needs:
      - compile
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make package
        shell: bash
