apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  tasks:
    - name: check
      taskRef:
        name: gitlab-ci-check
      runAfter:
        - compile
        - package
    - name: compile
      taskRef:
        name: gitlab-ci-compile
    - name: package
      taskRef:
        name: gitlab-ci-package
      runAfter:
        - compile
