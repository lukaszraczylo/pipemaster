apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: check
      taskRef:
        name: gitlab-ci-check
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
        - package
    - name: compile
      taskRef:
        name: gitlab-ci-compile
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
    - name: package
      taskRef:
        name: gitlab-ci-package
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - compile
