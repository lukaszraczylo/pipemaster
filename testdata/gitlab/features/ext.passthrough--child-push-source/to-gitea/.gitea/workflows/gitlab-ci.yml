on:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
  po-created:
    needs:
      - build
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fail
        run: exit 1
        shell: bash
      - id: pass
        run: "true"
        shell: bash
  po-x:
    needs:
      - build
      - po-created
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/po-x: false
      - id: script
        run: make only
        shell: bash
