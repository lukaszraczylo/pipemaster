apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  tasks:
    - name: build
      taskRef:
        name: gitlab-ci-build
    - name: po-x
      taskRef:
        name: gitlab-ci-po-x
      runAfter:
        - build
      when:
        - input: pipemaster-disabled
          operator: in
          values:
            - never
