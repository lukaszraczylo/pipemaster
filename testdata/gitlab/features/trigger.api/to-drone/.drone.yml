# pipemaster:lost trigger.* pipeline/gitlab-ci/job/triggered: the triggers of the pipeline have no single Drone condition
# pipemaster:emulated job.container pipeline/gitlab-ci/job/triggered
kind: pipeline
type: docker
name: triggered
trigger:
  event:
    exclude:
      - '**'
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make triggered'
