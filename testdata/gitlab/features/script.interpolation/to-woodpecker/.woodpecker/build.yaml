# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
when:
  - event: push
  - event: tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - |-
        sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo "building ${CI_COMMIT_SHA} on ${CI_COMMIT_BRANCH} for ${CI_COMMIT_AUTHOR}"
        echo "keeps $$HOME and $${UNMAPPED}"'
