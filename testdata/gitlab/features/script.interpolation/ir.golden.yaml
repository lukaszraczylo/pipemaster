origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - echo "building ${{ sha }} on ${CI_COMMIT_BRANCH} for $GITLAB_USER_LOGIN"
                - echo "keeps $HOME and ${UNMAPPED}"
