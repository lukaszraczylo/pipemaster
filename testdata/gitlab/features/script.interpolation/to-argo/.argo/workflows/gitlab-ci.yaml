# pipemaster:emulated script.interpolation pipeline/gitlab-ci/job/build
# pipemaster:arg {"vars":{"PM_CTX_ACTOR":"actor","PM_CTX_BRANCH":"branch","PM_CTX_SHA":"sha"}}
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
      - name: ctx-sha
        value: ""
      - name: ctx-actor
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - |-
                echo "building ${PM_CTX_SHA} on ${PM_CTX_BRANCH} for ${PM_CTX_ACTOR}"
                echo "keeps $HOME and ${UNMAPPED}"
            workingDir: /workspace
            env:
              - name: PM_CTX_SHA
                value: '{{workflow.parameters.ctx-sha}}'
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
              - name: PM_CTX_ACTOR
                value: '{{workflow.parameters.ctx-actor}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
