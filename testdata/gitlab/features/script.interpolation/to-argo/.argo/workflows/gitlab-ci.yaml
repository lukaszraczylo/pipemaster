apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
      - name: ctx-actor
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                export PIPEMASTER_VARS=2; export CI_COMMIT_BRANCH="${PM_CTX_BRANCH}"; export GITLAB_USER_LOGIN="${PM_CTX_ACTOR}"; : pipemaster-end; echo "building ${PM_CTX_SHA} on ${CI_COMMIT_BRANCH} for $GITLAB_USER_LOGIN"
                echo "keeps $HOME and ${UNMAPPED}"
            workingDir: /workspace
            env:
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
              - name: PM_CTX_ACTOR
                value: '{{workflow.parameters.ctx-actor}}'
              - name: PM_CTX_SHA
                value: '{{workflow.parameters.ctx-sha}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
