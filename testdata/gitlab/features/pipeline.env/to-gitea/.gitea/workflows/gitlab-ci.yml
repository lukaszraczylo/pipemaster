on:
  workflow_dispatch:
  push:
env:
  GOFLAGS: -mod=readonly
  DEPLOY_ENV: staging
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make build
        shell: bash
