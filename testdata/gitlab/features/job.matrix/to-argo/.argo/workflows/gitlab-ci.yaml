# pipemaster:emulated job.matrix pipeline/gitlab-ci/job/test
# pipemaster:arg {"include":[[{"Key":"GO","Value":"1.21"},{"Key":"OS","Value":"linux"}],[{"Key":"GO","Value":"1.21"},{"Key":"OS","Value":"mac"}],[{"Key":"GO","Value":"1.22"},{"Key":"OS","Value":"linux"}],[{"Key":"GO","Value":"1.22"},{"Key":"OS","Value":"mac"}],[{"Key":"GO","Value":"1.20"},{"Key":"OS","Value":"linux"}]]}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/test/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
            withItems:
              - GO: "1.21"
                OS: linux
              - GO: "1.21"
                OS: mac
              - GO: "1.22"
                OS: linux
              - GO: "1.22"
                OS: mac
              - GO: "1.20"
                OS: linux
            arguments:
              parameters:
                - name: GO
                  value: '{{item.GO}}'
                - name: OS
                  value: '{{item.OS}}'
    - name: test
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make test
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: GO
          - name: OS
      volumes:
        - emptyDir: {}
          name: workspace
