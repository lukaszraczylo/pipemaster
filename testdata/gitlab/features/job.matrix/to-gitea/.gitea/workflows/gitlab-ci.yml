on:
  push:
jobs:
  test:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GO: "1.21"
            OS: linux
          - GO: "1.21"
            OS: mac
          - GO: "1.22"
            OS: linux
          - GO: "1.22"
            OS: mac
          - GO: "1.20"
            OS: linux
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make test
        shell: bash
