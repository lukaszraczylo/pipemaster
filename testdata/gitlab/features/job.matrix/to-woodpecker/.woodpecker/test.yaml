# pipemaster:emulated job.container pipeline/gitlab-ci/job/test
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated trigger.push pipeline/gitlab-ci/job/test
# pipemaster:arg {"gitlab_default":true}
when:
  - event: push
  - event: tag
  - event:
      - manual
      - cron
matrix:
  include:
    - GO: "1.21"
      OS: linux
    - GO: "1.21"
      OS: mac
    - GO: "1.22"
      OS: linux
    - GO: "1.22"
      OS: mac
    - GO: "1.20"
      OS: linux
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make test'
