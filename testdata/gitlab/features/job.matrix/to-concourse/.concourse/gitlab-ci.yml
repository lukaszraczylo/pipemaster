resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - do:
          - task: script
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -c
                  - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                  - pipemaster
                  - make test
                dir: workspace
        across:
          - var: matrix
            values:
              - GO: "1.21"
                OS: linux
              - GO: "1.21"
                OS: mac
              - GO: "1.22"
                OS: linux
              - GO: "1.22"
                OS: mac
              - GO: "1.20"
                OS: linux
            max_in_flight: all
