# pipemaster:emulated job.runner pipeline/gitlab-ci/job/test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GO: "1.21"
            OS: linux
          - GO: "1.21"
            OS: mac
          - GO: "1.22"
            OS: linux
          - GO: "1.22"
            OS: mac
          - GO: "1.20"
            OS: linux
    steps:
      - id: script
        run: make test
