# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: test
      taskRef:
        name: gitlab-ci-test
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      matrix:
        include:
          - params:
              - name: GO
                value: "1.21"
              - name: OS
                value: linux
          - params:
              - name: GO
                value: "1.21"
              - name: OS
                value: mac
          - params:
              - name: GO
                value: "1.22"
              - name: OS
                value: linux
          - params:
              - name: GO
                value: "1.22"
              - name: OS
                value: mac
          - params:
              - name: GO
                value: "1.20"
              - name: OS
                value: linux
