# pipemaster:arg {"src":"branch == 'dev'","guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/release
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/release/step/script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/release
# pipemaster:arg {"pre":1,"post":0}
on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  release:
    if: github.ref_type == 'branch' && github.ref_name == 'dev' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make release
        shell: bash
