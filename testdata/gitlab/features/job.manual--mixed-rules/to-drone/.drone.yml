# pipemaster:emulated job.if pipeline/gitlab-ci/job/release
# pipemaster:arg {"if":"branch == 'dev'","back":"((event == 'push') || (event == 'schedule') || (event == 'workflow_dispatch')) \u0026\u0026 (branch == 'dev')","triggers":"- kind: manual\n- kind: push\n- kind: schedule\n- kind: tag\n"}
# pipemaster:emulated job.container pipeline/gitlab-ci/job/release
kind: pipeline
type: docker
name: release
trigger:
  event:
    - push
    - tag
    - cron
    - custom
  branch:
    - dev
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make release'
