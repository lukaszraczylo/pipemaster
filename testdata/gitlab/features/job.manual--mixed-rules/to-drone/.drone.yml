# pipemaster:emulated job.container pipeline/gitlab-ci/job/release
kind: pipeline
type: docker
name: release
trigger:
  event:
    - push
    - tag
  branch:
    - dev
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - make release
