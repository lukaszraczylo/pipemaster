# pipemaster:emulated job.container pipeline/gitlab-ci/job/package
when:
  - event: push
  - event: tag
depends_on:
  - images
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make package'
