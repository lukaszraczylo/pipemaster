# pipemaster:emulated job.container pipeline/gitlab-ci/job/images
when:
  - event: push
  - event: tag
matrix:
  TARGET:
    - alpine
    - ubuntu
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make images'
