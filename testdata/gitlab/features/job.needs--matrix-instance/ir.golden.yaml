origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            stages:
                - build
                - package
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - matrix:
            axes:
                - name: TARGET
                  values:
                    - alpine
                    - ubuntu
          ext:
            gitlab:
                stage: build
          id: images
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make images
        - ext:
            gitlab:
                needs_extra:
                    images:
                        _instance: 'images: [alpine]'
                stage: package
          id: package
          needs:
            - job: images
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make package
        - ext:
            gitlab:
                needs_extra:
                    images:
                        parallel:
                            matrix:
                                - TARGET:
                                    - ubuntu
                stage: package
          id: package-all
          needs:
            - job: images
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make package-all
