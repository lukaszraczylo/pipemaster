on:
  push:
jobs:
  images:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        TARGET:
          - alpine
          - ubuntu
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make images
  package:
    needs:
      - images
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make package
  package-all:
    needs:
      - images
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make package-all
