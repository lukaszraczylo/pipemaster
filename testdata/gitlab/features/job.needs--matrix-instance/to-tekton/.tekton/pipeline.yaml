apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: images
      taskRef:
        name: gitlab-ci-images
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      matrix:
        params:
          - name: TARGET
            value:
              - alpine
              - ubuntu
    - name: package
      taskRef:
        name: gitlab-ci-package
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - images
    - name: package-all
      taskRef:
        name: gitlab-ci-package-all
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      runAfter:
        - images
