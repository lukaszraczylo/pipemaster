# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: images
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - do:
          - task: script
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - make images
                dir: workspace
        across:
          - var: TARGET
            values:
              - alpine
              - ubuntu
            max_in_flight: all
  - name: package
    plan:
      - get: source
        passed:
          - images
        trigger: true
      - get: source-tags
      - task: script
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - make package
            dir: workspace
  - name: package-all
    plan:
      - get: source
        passed:
          - images
        trigger: true
      - get: source-tags
      - task: script
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - make package-all
            dir: workspace
