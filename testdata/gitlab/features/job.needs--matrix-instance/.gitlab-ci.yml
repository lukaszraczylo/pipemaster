stages: [build, package]

images:
  stage: build
  script:
    - make images
  parallel:
    matrix:
      - TARGET: [alpine, ubuntu]

package:
  stage: package
  needs:
    - "images: [alpine]"
  script:
    - make package

package-all:
  stage: package
  needs:
    - job: images
      parallel:
        matrix:
          - TARGET: [ubuntu]
  script:
    - make package-all
