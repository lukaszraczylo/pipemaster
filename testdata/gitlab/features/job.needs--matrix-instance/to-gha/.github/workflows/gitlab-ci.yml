# pipemaster:emulated job.runner pipeline/gitlab-ci/job/images
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/package
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/package-all
on:
  push:
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        TARGET:
          - alpine
          - ubuntu
    steps:
      - id: script
        run: make images
  package:
    needs:
      - images
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make package
  package-all:
    needs:
      - images
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make package-all
