on:
  workflow_dispatch:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  images:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        TARGET:
          - alpine
          - ubuntu
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make images
        shell: bash
  package:
    needs:
      - images
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make package
        shell: bash
  package-all:
    needs:
      - images
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make package-all
        shell: bash
