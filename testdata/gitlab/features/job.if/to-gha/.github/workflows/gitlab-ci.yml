# pipemaster:emulated job.if pipeline/gitlab-ci/job/build
# pipemaster:arg {"src":"(branch == 'main') || ((event == 'schedule') \u0026\u0026 !(branch == 'main'))"}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
on:
  push:
jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == 'main' || github.event_name == 'schedule' && !(github.ref_type == 'branch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make
