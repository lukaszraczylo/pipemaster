apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitlab-ci
spec:
  params:
    - name: ctx-branch
      default: ""
    - name: ctx-event
      default: ""
  tasks:
    - name: build
      taskRef:
        name: gitlab-ci-build
      params:
        - name: ctx-branch
          value: $(params.ctx-branch)
        - name: ctx-event
          value: $(params.ctx-event)
