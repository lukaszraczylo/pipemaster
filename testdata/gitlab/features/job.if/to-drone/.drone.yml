# pipemaster:emulated job.if pipeline/gitlab-ci/job/build
# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - 'if ! ( [ "$$DRONE_BRANCH" = ''main'' ] || ( [ "$$DRONE_BUILD_EVENT" = ''cron'' ] && ( ! [ "$$DRONE_BRANCH" = ''main'' ] ) ) ); then echo ''pipemaster: skipped: the condition of this step is false''; exit 0; fi # pipemaster:guard'
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make'
