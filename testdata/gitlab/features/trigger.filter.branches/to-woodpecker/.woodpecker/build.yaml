# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n  branches:\n    include:\n        - main\n        - release-**\n"
when:
  - event: push
    branch:
      - main
      - release-**
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make build'
