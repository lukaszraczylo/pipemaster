on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: make
        shell: bash
  deploy:
    needs:
      - build
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/deploy: opaque(gitlab): - changes: '!reference [.remote-patterns]'\n  if: $CI_COMMIT_TAG\n
      - id: script
        run: make deploy
        shell: bash
