# pipemaster:emulated job.container pipeline/gitlab-ci/job/deploy
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated trigger.push pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"gitlab_default":true}
# pipemaster:lost job.if pipeline/gitlab-ci/job/deploy: opaque(gitlab): - changes: '!reference [.remote-patterns]'\n  if: $$CI_COMMIT_TAG\n
when:
  - event: push
    evaluate: "false"
  - event: tag
    evaluate: "false"
  - event:
      - manual
      - cron
    evaluate: "false"
depends_on:
  - build
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make deploy'
