origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - ext:
        gitlab:
            include:
                - file: ci.yml
                  project: group/templates
            stages:
                - build
      id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            gitlab:
                _carried:
                    - extends
                extends:
                    - .remote-base
                stage: build
          id: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - '!reference [.remote-setup, script]'
                - make
        - if: |
            opaque(gitlab): - changes: '!reference [.remote-patterns]'
              if: $CI_COMMIT_TAG
          ext:
            gitlab:
                _derived_needs: true
                rules:
                    - changes: '!reference [.remote-patterns]'
                      if: $CI_COMMIT_TAG
                stage: publish
          id: deploy
          needs:
            - job: build
          steps:
            - ext:
                gitlab:
                    section: script
              id: script
              kind: script
              script:
                - make deploy
