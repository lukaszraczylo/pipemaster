on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: script
        run: make
        shell: bash
  deploy:
    needs:
      - build
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:lost job.if pipeline/gitlab-ci/job/deploy: opaque(gitlab): - changes: '!reference [.remote-patterns]'\n  if: $CI_COMMIT_TAG\n
      - id: script
        run: make deploy
        shell: bash
