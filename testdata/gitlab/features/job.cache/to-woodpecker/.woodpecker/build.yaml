# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
# pipemaster:emulated trigger.manual pipeline/gitlab-ci
# pipemaster:arg "- kind: push\n- kind: tag\n"
# pipemaster:emulated trigger.push pipeline/gitlab-ci/job/build
# pipemaster:arg {"gitlab_default":true}
# pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
# pipemaster:arg [{"Key":"$$\u007b{ hashFiles('go.sum') }}","Policy":"pull-push","Paths":[".cache/go-build"],"FallbackKeys":null}]
when:
  - event: push
  - event: tag
  - event:
      - manual
      - cron
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make'
