# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.if pipeline/gitlab-ci/job/build
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
# pipemaster:arg {"cache":[{"Key":"$\u007b{ hashFiles('go.sum') }}","Policy":"pull-push","Paths":[".cache/go-build"]}],"pre":2,"post":0}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
      - uses: https://github.com/actions/cache@v6
        with:
          path: .cache/go-build
          key: ${{ hashFiles('go.sum') }}
      - id: script
        run: make
        shell: bash
