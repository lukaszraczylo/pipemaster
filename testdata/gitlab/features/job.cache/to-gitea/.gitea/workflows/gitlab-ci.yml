on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
      - uses: actions/cache@v6
        with:
          path: .cache/go-build
          key: ${{ hashFiles('go.sum') }}
      - id: script
        run: make
        shell: bash
