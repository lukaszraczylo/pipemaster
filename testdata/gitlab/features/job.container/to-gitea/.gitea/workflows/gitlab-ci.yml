on:
  workflow_dispatch:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    container: golang:1.22
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
      - id: script
        run: sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"' pipemaster 'make'
