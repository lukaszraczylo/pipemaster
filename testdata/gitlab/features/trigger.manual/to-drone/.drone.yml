# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.container pipeline/gitlab-ci/job/adhoc
kind: pipeline
type: docker
name: adhoc
trigger:
  event:
    - custom
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make adhoc'
