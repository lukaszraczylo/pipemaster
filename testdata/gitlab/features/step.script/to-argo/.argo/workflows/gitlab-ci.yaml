apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - |-
                echo prepare
                make build
                make test
            workingDir: /workspace
          - # pipemaster:id after_script
            name: after-script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - |-
                trap 'exit 0' EXIT # pipemaster:continue-on-error
                exit 0 # pipemaster:lost the step condition has no shell form
            workingDir: /workspace
            dependencies:
              - script
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
