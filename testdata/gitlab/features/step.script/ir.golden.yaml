origin:
    provider: gitlab
    dialect: gitlab
    files:
        - .gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - ext:
                gitlab:
                    before_lines: 1
                    section: script
              id: script
              kind: script
              script:
                - echo prepare
                - make build
                - make test
            - if: always()
              ext:
                gitlab:
                    section: after_script
              id: after_script
              kind: script
              script:
                - echo cleanup
              continue_on_error: true
