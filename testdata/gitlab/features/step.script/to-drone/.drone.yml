# pipemaster:emulated trigger.push pipeline/gitlab-ci
# pipemaster:arg {"default_triggers":true,"manual":true}
# pipemaster:emulated trigger.manual pipeline/gitlab-ci/trigger/0
# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
    - cron
    - custom
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - |-
        sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo prepare
        make build
        make test'
  - name: after_script
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo cleanup'
    failure: ignore
    when:
      status:
        - success
        - failure
