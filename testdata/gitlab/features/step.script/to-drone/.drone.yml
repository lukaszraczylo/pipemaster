# pipemaster:emulated job.container pipeline/gitlab-ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: script
    image: ubuntu:latest
    commands:
      - echo prepare
      - make build
      - make test
  - name: after_script
    image: ubuntu:latest
    commands:
      - echo cleanup
    failure: ignore
    when:
      status:
        - success
        - failure
