on:
  push:
    branches:
      - '**'
    tags:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: |
          echo prepare
          make build
          make test
      - id: after_script
        if: always()
        run: echo cleanup
        continue-on-error: true
