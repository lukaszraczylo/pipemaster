# pipemaster:emulated trigger.api pipeline/gitlab-ci/trigger/4
# pipemaster:emulated job.if pipeline/gitlab-ci/job/build
# pipemaster:arg {"guard":true}
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/after_script
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"pre":1,"post":0}
on:
  workflow_dispatch:
  push:
  repository_dispatch:
    types:
      - api
      - trigger
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: script
        run: |
          echo prepare
          make build
          make test
        shell: bash
      - id: after_script
        if: always()
        run: echo cleanup
        shell: bash
        continue-on-error: true
