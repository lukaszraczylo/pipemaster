name: mixed
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo one
      - uses: ./.github/actions/local-thing
      - uses: slackapi/slack-github-action@v1
        with:
          channel-id: C123
      - run: echo two
      - uses: slackapi/slack-github-action@v1
        if: always()
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: k-${{ hashFiles('go.sum') }}
          fail-on-cache-miss: true
      - id: warm
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2
      - run: make deps
        if: steps.warm.outputs.cache-hit != 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: out
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: bin
          run-id: 42
