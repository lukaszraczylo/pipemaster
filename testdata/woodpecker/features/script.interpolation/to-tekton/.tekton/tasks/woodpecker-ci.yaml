apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: woodpecker-ci
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: source-checkout
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: build
      image: alpine:3.20
      script: |-
        export PIPEMASTER_VARS=1; : "${CI_COMMIT_BRANCH:?pipemaster: lost: variable CI_COMMIT_BRANCH has no tekton source}"; : pipemaster-end; echo ${PM_CTX_SHA} on ${CI_COMMIT_BRANCH}
        echo "cost: $5"
      env:
        - name: PM_CTX_SHA
          value: $(params.ctx-sha)
