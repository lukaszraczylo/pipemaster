apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: woodpecker-ci
spec:
  params:
    - name: ctx-sha
    - name: ctx-branch
  steps:
    - name: build
      image: alpine:3.20
      script: |-
        echo ${PM_CTX_SHA} on ${PM_CTX_BRANCH}
        echo "cost: $5"
      env:
        - name: PM_CTX_SHA
          value: $(params.ctx-sha)
        - name: PM_CTX_BRANCH
          value: $(params.ctx-branch)
