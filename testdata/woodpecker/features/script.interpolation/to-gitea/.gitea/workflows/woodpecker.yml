# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.20","Entrypoint":null},"script":["export PIPEMASTER_VARS=1; CI_COMMIT_BRANCH=\"$(if [ \"${GITHUB_EVENT_NAME}\" = pull_request ]; then printf %s \"${GITHUB_BASE_REF}\"; elif [ \"${GITHUB_REF_TYPE}\" = branch ]; then printf %s \"${GITHUB_REF_NAME}\"; fi)\"; export CI_COMMIT_BRANCH; : pipemaster-end; echo $\u007b{ sha }} on ${CI_COMMIT_BRANCH}","echo \"cost: $5\""]}
on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/build
      - id: build
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: |-
            -ec 'export PIPEMASTER_VARS=1; CI_COMMIT_BRANCH="$(if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then printf %s "${GITHUB_BASE_REF}"; elif [ "${GITHUB_REF_TYPE}" = branch ]; then printf %s "${GITHUB_REF_NAME}"; fi)"; export CI_COMMIT_BRANCH; : pipemaster-end; echo ${{ github.sha }} on ${CI_COMMIT_BRANCH}
            echo "cost: $5"'
