# pipemaster:emulated step.image pipeline/woodpecker/job/ci
# pipemaster:arg {"steps":{"build":"ref: alpine:3.20\n"},"wrote":{"build":"alpine:3.20"}}
# pipemaster:emulated script.interpolation pipeline/woodpecker/job/ci
# pipemaster:arg {"vars":{"PM_CTX_SHA":"sha"}}
# pipemaster:emulated trigger.filter.branches pipeline/woodpecker/trigger/0
# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - |-
                export PIPEMASTER_VARS=1; : "${CI_COMMIT_BRANCH:?pipemaster: lost: variable CI_COMMIT_BRANCH has no argo source}"; : pipemaster-end; echo ${PM_CTX_SHA} on ${CI_COMMIT_BRANCH}
                echo "cost: $5"
            workingDir: /workspace
            env:
              - name: PM_CTX_SHA
                value: '{{workflow.parameters.ctx-sha}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
