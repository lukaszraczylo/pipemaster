kind: pipeline
type: docker
name: ci
trigger:
  event:
    - push
steps:
  - name: build
    image: alpine:3.20
    commands:
      - 'export PIPEMASTER_VARS=1; export CI_COMMIT_BRANCH="$${DRONE_COMMIT_BRANCH}"; : pipemaster-end; echo $${DRONE_COMMIT_SHA} on $${CI_COMMIT_BRANCH}'
      - 'echo "cost: $$5"'
