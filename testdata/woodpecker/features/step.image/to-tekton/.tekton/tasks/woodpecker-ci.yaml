apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: woodpecker-ci
spec:
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: build
      image: rust:1.85
      script: cargo build --release
    - name: publish
      image: woodpeckerci/plugin-docker-buildx
      env:
