on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/build
      - id: build
        uses: docker://rust:1.85
        with:
          entrypoint: /bin/sh
          args: -ec 'cargo build --release'
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/publish
      - id: publish
        uses: docker://woodpeckerci/plugin-docker-buildx
        env:
          PLUGIN_REPO: example/app
          PLUGIN_TAGS: latest
