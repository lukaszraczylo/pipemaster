apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: rust:1.85
            command:
              - sh
              - -ec
            args:
              - cargo build --release
            workingDir: /workspace
          - name: publish
            image: woodpeckerci/plugin-docker-buildx
            command:
              - sh
              - -ec
            args:
              - 'printf ''%s\n'' ''pipemaster: lost: step.action pipeline/woodpecker/job/ci/step/publish: Argo does not run the action'' >&2; exit 1'
            workingDir: /workspace
            dependencies:
              - build
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
