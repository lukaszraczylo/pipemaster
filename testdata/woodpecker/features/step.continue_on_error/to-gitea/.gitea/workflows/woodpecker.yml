on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/lint
      - id: lint
        uses: docker://golangci/golangci-lint:v2
        with:
          entrypoint: /bin/sh
          args: -ec 'golangci-lint run'
        continue-on-error: true
