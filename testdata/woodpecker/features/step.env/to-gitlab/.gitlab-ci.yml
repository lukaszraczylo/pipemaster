workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/woodpecker/job/ci
# pipemaster:arg {"job":"ci","parts":["ci"],"own":["build"]}
ci:
  image: golang:1.25
  needs: []
  script:
    # pipemaster:step build
    # pipemaster:emulated step.env pipeline/woodpecker/job/ci/step/build
    - |
      (
      export GOFLAGS="-trimpath"
      export TOKEN="$deploy_token"
      go build ./...
      )
