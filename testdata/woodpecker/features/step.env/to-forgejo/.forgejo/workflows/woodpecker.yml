# pipemaster:emulated pipeline.concurrency pipeline/woodpecker
# pipemaster:emulated job.if pipeline/woodpecker/job/ci
# pipemaster:arg {"from":"woodpecker","guard":true}
# pipemaster:emulated job.runner pipeline/woodpecker/job/ci
# pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/build
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:1.25","Entrypoint":null},"script":["go build ./..."]}
# pipemaster:emulated job.artifacts pipeline/woodpecker/job/ci
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
        env:
          GOFLAGS: -trimpath
          TOKEN: ${{ secrets.deploy_token }}
