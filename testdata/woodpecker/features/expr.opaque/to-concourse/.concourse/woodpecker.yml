resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: ci
    plan:
      - get: source
        trigger: true
      - task: release
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                exit 0 # pipemaster:guard the step condition has no shell form
                ./release.sh
            dir: workspace
