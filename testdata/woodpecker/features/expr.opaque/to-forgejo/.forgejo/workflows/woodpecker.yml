on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/release
      # pipemaster:lost step.if pipeline/woodpecker/job/ci/step/release: (event == 'tag') || @opaque('woodpecker', 'when.branch glob "release/*"')
      - id: release
        if: false
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./release.sh
