origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - if: (event == 'tag') || @opaque('woodpecker', 'when.branch glob "release/*"')
              image:
                ref: alpine:3.20
              id: release
              kind: script
              script:
                - ./release.sh
