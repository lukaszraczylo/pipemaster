apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: pipemaster
spec:
  dependencies:
    - eventName: push
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - ^refs/heads/main$
              - ^refs/heads/develop$
        exprs:
          - expr: ref != 'refs/heads/wip'
            fields:
              - name: ref
                path: body.ref
      name: woodpecker-push
  template:
    serviceAccountName: pipemaster-sensor
  triggers:
    - template:
        conditions: woodpecker-push
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dataKey: body.after
                dependencyName: woodpecker-push
            - dest: spec.arguments.parameters.1.value
              src:
                dataKey: body.repository.full_name
                dependencyName: woodpecker-push
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: woodpecker-
              spec:
                arguments:
                  parameters:
                    - name: ctx-sha
                      value: ""
                    - name: ctx-repo
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: woodpecker
        name: woodpecker-push
