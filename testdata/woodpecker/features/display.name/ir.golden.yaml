origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: golang:1.25
              ext:
                woodpecker:
                    _derived_id: true
              id: ci-step-1
              name: Compile
              kind: script
              script:
                - go build ./...
