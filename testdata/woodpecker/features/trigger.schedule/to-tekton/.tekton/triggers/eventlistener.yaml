# pipemaster:emulated trigger.schedule pipeline/woodpecker/trigger/0
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipemaster-schedule
spec:
  serviceAccountName: pipemaster-triggers
  triggers:
    - name: woodpecker-schedule-0
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: header.canonical('X-Pipemaster-Schedule') == 'woodpecker/0'
            - name: overlays
              value:
                - key: ctx_sha
                  expression: ''''''
                - key: ctx_repo
                  expression: ''''''
      bindings:
        - ref: woodpecker-github
      template:
        ref: woodpecker-run
