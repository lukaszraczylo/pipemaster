apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: deploy
      taskRef:
        name: woodpecker-deploy
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
