# pipemaster:emulated job.manual pipeline/woodpecker/job/deploy
# pipemaster:arg {"manual":true}
# pipemaster:emulated step.image pipeline/woodpecker/job/deploy
# pipemaster:arg {"steps":{"deploy":"ref: alpine:3.20\n"},"wrote":{"deploy":"alpine:3.20"}}
# pipemaster:emulated trigger.filter.branches pipeline/woodpecker/trigger/0
# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy-gate
            template: deploy-gate
          - name: deploy
            template: deploy
            dependencies:
              - deploy-gate
    - name: deploy-gate
      suspend: {}
    - name: deploy
      containerSet:
        containers:
          - name: deploy
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - ./deploy.sh
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
