apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy-gate
            template: deploy-gate
          - name: deploy
            template: deploy
            dependencies:
              - deploy-gate
    - name: deploy-gate
      suspend: {}
    - name: deploy
      containerSet:
        containers:
          - # pipemaster:id deploy
            name: main
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - ./deploy.sh
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
