origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/deploy.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: deploy
          steps:
            - image:
                ref: alpine:3.20
              id: deploy
              kind: script
              script:
                - ./deploy.sh
          manual: true
