kind: pipeline
type: docker
name: lint
trigger:
  event:
    - push
steps:
  - name: lint
    image: golangci/golangci-lint:v2
    commands:
      - golangci-lint run
---
kind: pipeline
type: docker
name: ship
trigger:
  event:
    - push
depends_on:
  - lint
steps:
  - name: ship
    image: alpine:3.20
    commands:
      - ./ship.sh
