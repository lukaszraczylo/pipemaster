# pipemaster:arg {"vars":{"REGION":"vars.REGION","TOKEN":"secrets.TOKEN"}}
# pipemaster:emulated config.name pipeline/woodpecker/ref/secrets.TOKEN
# pipemaster:emulated config.name pipeline/woodpecker/ref/vars.REGION
# pipemaster:emulated trigger.filter.branches pipeline/woodpecker/trigger/0
# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - 'curl -H "Authorization: Bearer ${TOKEN}" "https://${REGION}.example.org"'
            workingDir: /workspace
            env:
              - name: TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: TOKEN
              - name: REGION
                valueFrom:
                  configMapKeyRef:
                    name: ci-vars
                    key: REGION
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
