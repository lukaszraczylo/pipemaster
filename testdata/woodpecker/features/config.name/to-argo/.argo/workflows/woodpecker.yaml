apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id build
            name: main
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - 'curl -H "Authorization: Bearer ${TOKEN}" "https://${REGION}.example.org"'
            workingDir: /workspace
            env:
              - name: TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: TOKEN
              - name: REGION
                valueFrom:
                  configMapKeyRef:
                    name: ci-vars
                    key: REGION
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
