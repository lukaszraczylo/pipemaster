origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: alpine:3.20
              id: build
              kind: script
              script:
                - 'curl -H "Authorization: Bearer ${{ secrets.TOKEN }}" "https://${{ vars.REGION }}.example.org"'
