origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: alpine:3.20
              id: flaky
              kind: script
              script:
                - ./flaky.sh
          allow_failure: true
