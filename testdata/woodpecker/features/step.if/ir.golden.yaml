origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - if: ((event == 'tag') || (branch == 'main')) && (actor == 'release-bot')
              image:
                ref: alpine:3.20
              id: deploy
              kind: script
              script:
                - ./deploy.sh
