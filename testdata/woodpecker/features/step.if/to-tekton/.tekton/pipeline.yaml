apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-branch
      default: ""
    - name: ctx-event
      default: ""
    - name: ctx-actor
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: woodpecker-ci
      params:
        - name: ctx-event
          value: $(params.ctx-event)
        - name: ctx-branch
          value: $(params.ctx-branch)
        - name: ctx-actor
          value: $(params.ctx-actor)
