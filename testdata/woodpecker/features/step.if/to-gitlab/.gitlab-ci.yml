workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/woodpecker/job/ci
# pipemaster:arg {"job":"ci","parts":["ci"],"own":["deploy"]}
ci:
  image: alpine:3.20
  needs: []
  script:
    # pipemaster:step deploy
    # pipemaster:emulated step.if pipeline/woodpecker/job/ci/step/deploy
    # pipemaster:arg "(((tag =~ '(?i)^.+$') \u0026\u0026 (event == 'push')) || ((branch == 'main') || (pr.base_ref == 'main'))) \u0026\u0026 (actor == 'release-bot')"
    # pipemaster:arg {"src":"((event == 'tag') || (branch == 'main')) \u0026\u0026 (actor == 'release-bot')"}
    - |
      if { { printf '%s\n' "$CI_COMMIT_TAG" | grep -Eiq '^.+$' && [ "$CI_PIPELINE_SOURCE" = "push" ]; } || [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "main" ]; } && [ "$GITLAB_USER_LOGIN" = "release-bot" ]; then
      ./deploy.sh
      fi
