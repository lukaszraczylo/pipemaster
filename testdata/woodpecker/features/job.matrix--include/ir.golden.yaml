origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci.yaml
pipelines:
    - id: woodpecker
      triggers:
        - kind: push
      jobs:
        - matrix:
            include:
                - - key: GO_VERSION
                    value: "1.24"
                  - key: TAGS
                    value: nethttp
                - - key: GO_VERSION
                    value: "1.25"
                  - key: TAGS
                    value: netgo
          id: ci
          steps:
            - image:
                ref: golang:${{ matrix.GO_VERSION }}
              id: test
              kind: script
              script:
                - go test -tags ${{ matrix.TAGS }} ./...
