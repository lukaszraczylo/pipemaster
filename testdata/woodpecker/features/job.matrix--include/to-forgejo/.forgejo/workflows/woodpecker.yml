# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/woodpecker
# pipemaster:emulated job.if pipeline/woodpecker/job/ci
# pipemaster:arg {"from":"woodpecker","guard":true}
# pipemaster:emulated job.runner pipeline/woodpecker/job/ci
# pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/test
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:$\u007b{ matrix.GO_VERSION }}","Entrypoint":null},"script":["go test -tags $\u007b{ matrix.TAGS }} ./..."],"run":true}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GO_VERSION: "1.24"
            TAGS: nethttp
          - GO_VERSION: "1.25"
            TAGS: netgo
    steps:
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/test
      - id: test
        run: docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --entrypoint /bin/sh -- "$PIPEMASTER_IMAGE" -ec "$PIPEMASTER_SCRIPT"
        env:
          PIPEMASTER_IMAGE: golang:${{ matrix.GO_VERSION }}
          PIPEMASTER_SCRIPT: go test -tags ${{ matrix.TAGS }} ./...
