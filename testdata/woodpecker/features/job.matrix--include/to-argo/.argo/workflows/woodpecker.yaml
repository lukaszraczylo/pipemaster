apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
            withItems:
              - GO_VERSION: "1.24"
                TAGS: nethttp
              - GO_VERSION: "1.25"
                TAGS: netgo
            arguments:
              parameters:
                - name: GO_VERSION
                  value: '{{item.GO_VERSION}}'
                - name: TAGS
                  value: '{{item.TAGS}}'
    - name: ci
      containerSet:
        containers:
          - name: test
            image: golang:{{inputs.parameters.GO_VERSION}}
            command:
              - sh
              - -ec
            args:
              - go test -tags {{inputs.parameters.TAGS}} ./...
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: GO_VERSION
          - name: TAGS
      volumes:
        - emptyDir: {}
          name: workspace
