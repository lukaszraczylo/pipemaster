apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-event
      default: ""
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
    - name: ctx-actor
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: woodpecker-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      when:
        - input: $(params.ctx-event)
          operator: in
          values:
            - push
        - input: $(params.ctx-actor)
          operator: in
          values:
            - release-bot
