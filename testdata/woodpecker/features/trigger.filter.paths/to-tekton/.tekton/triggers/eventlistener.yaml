# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
# pipemaster:arg {"kind":"push","name":"woodpecker-push-0","branches":{"Include":null,"Exclude":null},"tags":{"Include":null,"Exclude":null},"paths":{"Include":["src/main.go","go.mod"],"Exclude":null}}
# pipemaster:emulated trigger.filter.paths pipeline/woodpecker/trigger/0
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipemaster
spec:
  serviceAccountName: pipemaster-triggers
  triggers:
    - name: woodpecker-push-0
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
            - name: addChangedFiles
              value:
                enabled: true
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref.startsWith('refs/heads/') && (extensions.changed_files.added + extensions.changed_files.modified + extensions.changed_files.removed).exists(f, (f.matches(r'^src/main\.go$') || f.matches(r'^go\.mod$')))
      bindings:
        - ref: woodpecker-github
      template:
        ref: woodpecker-run
