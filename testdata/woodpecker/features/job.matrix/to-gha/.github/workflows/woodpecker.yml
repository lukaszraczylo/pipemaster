# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
# pipemaster:emulated job.if pipeline/woodpecker/job/ci
# pipemaster:arg {"from":"woodpecker","guard":true}
# pipemaster:emulated job.runner pipeline/woodpecker/job/ci
on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GO_VERSION:
          - "1.24"
          - "1.25"
        OS:
          - linux
          - darwin
    steps:
      - id: test
        run: |
          go test ./...
          echo ${{ matrix.OS }}
