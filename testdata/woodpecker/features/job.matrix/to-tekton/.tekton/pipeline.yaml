apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: woodpecker-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      matrix:
        params:
          - name: GO_VERSION
            value:
              - "1.24"
              - "1.25"
          - name: OS
            value:
              - linux
              - darwin
