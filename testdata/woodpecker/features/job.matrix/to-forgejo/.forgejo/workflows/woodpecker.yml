# pipemaster:arg {"kind":"script","image":{"Ref":"golang:$\u007b{ matrix.GO_VERSION }}","Entrypoint":null},"script":["go test ./...","echo $\u007b{ matrix.OS }}"],"run":true}
# pipemaster:emulated job.artifacts pipeline/woodpecker/job/ci
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GO_VERSION:
          - "1.24"
          - "1.25"
        OS:
          - linux
          - darwin
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/test
      - id: test
        run: docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --entrypoint /bin/sh -- "$PIPEMASTER_IMAGE" -ec "$PIPEMASTER_SCRIPT"
        env:
          PIPEMASTER_IMAGE: golang:${{ matrix.GO_VERSION }}
          PIPEMASTER_SCRIPT: |
            go test ./...
            echo ${{ matrix.OS }}
