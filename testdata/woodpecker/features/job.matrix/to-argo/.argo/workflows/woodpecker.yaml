# pipemaster:emulated step.image pipeline/woodpecker/job/ci
# pipemaster:arg {"steps":{"test":"ref: golang:$\u007b{ matrix.GO_VERSION }}\n"},"wrote":{"test":"golang:$\u007b{ matrix.GO_VERSION }}"}}
# pipemaster:emulated trigger.filter.branches pipeline/woodpecker/trigger/0
# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
            withItems:
              - GO_VERSION: "1.24"
                OS: linux
              - GO_VERSION: "1.24"
                OS: darwin
              - GO_VERSION: "1.25"
                OS: linux
              - GO_VERSION: "1.25"
                OS: darwin
            arguments:
              parameters:
                - name: GO_VERSION
                  value: '{{item.GO_VERSION}}'
                - name: OS
                  value: '{{item.OS}}'
    - name: ci
      containerSet:
        containers:
          - name: test
            image: golang:{{inputs.parameters.GO_VERSION}}
            command:
              - sh
              - -ec
            args:
              - |-
                go test ./...
                echo {{inputs.parameters.OS}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: GO_VERSION
          - name: OS
      volumes:
        - emptyDir: {}
          name: workspace
