# pipemaster:emulated pipeline.env pipeline/woodpecker
# pipemaster:arg {"env":"- name: CGO_ENABLED\n  value:\n    lit: \"0\"\n"}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: woodpecker-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
