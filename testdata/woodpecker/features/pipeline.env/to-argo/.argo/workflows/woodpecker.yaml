apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: golang:1.25
            command:
              - sh
              - -ec
            args:
              - go build ./...
            workingDir: /workspace
            env:
              - name: CGO_ENABLED
                value: "0"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
