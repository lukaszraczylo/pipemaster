# pipemaster:emulated step.image pipeline/woodpecker/job/ci
# pipemaster:arg {"steps":{"test":"ref: golang:1.25\n"},"wrote":{"test":"golang:1.25"}}
# pipemaster:emulated job.services pipeline/woodpecker/job/ci
# pipemaster:emulated trigger.filter.branches pipeline/woodpecker/trigger/0
# pipemaster:emulated trigger.push pipeline/woodpecker/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: woodpecker
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: test
            image: golang:1.25
            command:
              - sh
              - -ec
            args:
              - go test ./...
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      sidecars:
        - name: db
          image: postgres:17
          env:
            - name: POSTGRES_PASSWORD
              value: example
      volumes:
        - emptyDir: {}
          name: workspace
