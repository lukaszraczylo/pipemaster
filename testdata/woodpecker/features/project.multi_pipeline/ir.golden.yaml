origin:
    provider: woodpecker
    dialect: woodpecker
    files:
        - .woodpecker/ci-test.yaml
        - .woodpecker/deploy-ship.yaml
pipelines:
    - id: ci
      triggers:
        - kind: push
      jobs:
        - id: test
          steps:
            - image:
                ref: alpine:3.20
              id: test
              kind: script
              script:
                - ./test.sh
    - id: deploy
      triggers:
        - kind: manual
      jobs:
        - id: ship
          steps:
            - image:
                ref: alpine:3.20
              id: ship
              kind: script
              script:
                - ./ship.sh
