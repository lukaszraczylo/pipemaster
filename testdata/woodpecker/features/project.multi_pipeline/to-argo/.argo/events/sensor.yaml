apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: pipemaster
spec:
  dependencies:
    - eventName: push
      eventSourceName: pipemaster-github
      name: ci-push
  template:
    serviceAccountName: pipemaster-sensor
  triggers:
    - template:
        conditions: ci-push
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-
              spec:
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: ci
        name: ci-push
