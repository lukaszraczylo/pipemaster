# pipemaster:emulated step.image pipeline/ci/job/test
# pipemaster:arg {"steps":{"test":"ref: alpine:3.20\n"},"wrote":{"test":"alpine:3.20"}}
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
    - name: test
      containerSet:
        containers:
          - name: test
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - ./test.sh
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
