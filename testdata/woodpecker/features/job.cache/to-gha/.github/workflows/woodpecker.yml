on:
  push:
    branches:
      - '**'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated job.cache pipeline/woodpecker/job/ci
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod
      # pipemaster:emulated step.image pipeline/woodpecker/job/ci/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
