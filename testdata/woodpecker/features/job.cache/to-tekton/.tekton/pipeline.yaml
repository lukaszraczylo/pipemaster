apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: woodpecker
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  workspaces:
    - name: pipemaster-workspace
  tasks:
    - name: ci
      taskRef:
        name: woodpecker-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      workspaces:
        - name: pipemaster-workspace
          workspace: pipemaster-workspace
