workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/woodpecker/job/build
# pipemaster:arg {"job":"build","parts":["build"],"own":["build"]}
build:
  image: golang:1.25
  needs: []
  script:
    # pipemaster:step build
    - go build ./...
notify:
  stage: .post
  needs:
    - build
  script:
    # pipemaster:step notify
    - ./notify.sh
  when: always
