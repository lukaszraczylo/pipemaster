on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/woodpecker/job/build/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
  # pipemaster:emulated pipeline.finally pipeline/woodpecker
  notify:
    needs:
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/woodpecker/job/notify/step/notify
      - id: notify
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./notify.sh
