name: release

on:
  schedule:
    - cron: 0 0 1 * *
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Every job here publishes images and needs the meta job, which only runs for the main branch of this repository.
# Pull requests are built and tested by the build workflow, which never logs in to a registry.

jobs:
  meta:
    if: github.repository == 'gitea/runner-images' && github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    outputs:
      IMAGE_CREATED: ${{ steps.meta.outputs.IMAGE_CREATED }}
      IMAGE_VERSION: ${{ steps.meta.outputs.IMAGE_VERSION }}
    steps:
      - name: Get Meta
        id: meta
        run: |
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$GITHUB_OUTPUT"
          echo "IMAGE_VERSION=$(date -u +'v%y.%m.%d')" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-latest-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        base: ["26.04", "24.04", "22.04", 24-trixie-slim]
        arch: [amd64, arm64]
        include:
          - base: 24-trixie-slim
            dockerfile: ubuntu-slim.dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-flags: --debug

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.base }} ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: dockerfiles/${{ matrix.dockerfile || 'ubuntu.dockerfile' }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          build-args: |
            BASE_IMAGE_TAG=${{ matrix.base }}
            IMAGE_VERSION=${{ needs.meta.outputs.IMAGE_VERSION }}
            IMAGE_CREATED=${{ needs.meta.outputs.IMAGE_CREATED }}
            IMAGE_REVISION=${{ github.sha }}
          outputs: type=image,name=gitea/runner-images,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.base }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "26.04"
            tags: ubuntu-26.04
          - base: "24.04"
            tags: ubuntu-24.04
            latest_tag: ubuntu-latest
          - base: "22.04"
            tags: ubuntu-22.04
          - base: 24-trixie-slim
            tags: ubuntu-26.04-slim ubuntu-24.04-slim ubuntu-22.04-slim
            latest_tag: ubuntu-latest-slim
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.base }}-*
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push ${{ matrix.base }}
        working-directory: /tmp/digests
        env:
          TAGS: ${{ matrix.tags }}
          LATEST_TAG: ${{ matrix.latest_tag }}
          IMAGE_VERSION: ${{ needs.meta.outputs.IMAGE_VERSION }}
        run: |
          for tag in $TAGS; do set -- "$@" -t "gitea/runner-images:${tag}" -t "gitea/runner-images:${tag}-${IMAGE_VERSION}"; done
          for tag in $LATEST_TAG; do set -- "$@" -t "gitea/runner-images:${tag}"; done
          for digest in *; do set -- "$@" "gitea/runner-images@sha256:${digest}"; done
          docker buildx imagetools create "$@"

  release-full:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [26, 24, 22]
        include:
          - major: 24
            latest_tag: ubuntu-latest-full
    steps:
      - name: Install skopeo
        run: |
          apt-get update
          apt-get install -y skopeo

      - name: Copy full ${{ matrix.major }}.04
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for dest in ubuntu-${{ matrix.major }}.04-full ubuntu-${{ matrix.major }}.04-full-${{ needs.meta.outputs.IMAGE_VERSION }} ${{ matrix.latest_tag }}; do
            echo "copy christopherhx/runner-images:ubuntu${{ matrix.major }}-runner-large-latest -> gitea/runner-images:$dest"
            skopeo copy -a --dest-creds "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" docker://ghcr.io/christopherhx/runner-images:ubuntu${{ matrix.major }}-runner-large-latest docker://gitea/runner-images:$dest
          done
