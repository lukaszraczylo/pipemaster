name: build

on:
  push:
  pull_request:


jobs:
  lint:
    runs-on: docker
    container:
      image: data.forgejo.org/renovate/renovate:42.85.3@sha256:f829d18a727192e7e151f4276d4f50c0ff1c83066e56795a78bdab58a17ef6c4

    strategy:
      matrix:
        file:
          - base.json
          - renovate.json
          - go.json
          - config.js

    steps:
      - uses: https://data.forgejo.org/actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          show-progress: false

      - run: node bin/validator.cjs ${{ matrix.file }}
        env:
          LOG_LEVEL: debug

  mirror-repo:
    needs:
      - lint

    runs-on: docker

    if: github.ref_name == 'main'

    steps:
      - uses: https://data.forgejo.org/actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          show-progress: false
          fetch-depth: 0

      - name: mirror
        run: git push https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/forgejo-contrib/forgejo-renovate.git main:main -f
