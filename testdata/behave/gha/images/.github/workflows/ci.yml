name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20
        with:
          entrypoint: sh
          args: -c "if [ -e /etc/alpine-release ]; then echo MARK images.a:alpine; else echo MARK images.a:other; fi"
      - uses: docker://busybox:1.36
        with:
          entrypoint: sh
          args: -c "if [ -e /etc/alpine-release ]; then echo MARK images.b:alpine; else echo MARK images.b:busybox; fi"
