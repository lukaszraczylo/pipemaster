name: ci
on: [push, pull_request]
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo payload > out.txt
          echo "MARK artifacts.produce" | tee -a trace.log
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out.txt
  consume:
    runs-on: ubuntu-latest
    needs: produce
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
      - run: echo "MARK artifacts.consume:$(cat out.txt)" | tee -a trace.log
