name: ci
on: [push, pull_request]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MARK needs.a" | tee -a trace.log
  b:
    runs-on: ubuntu-latest
    needs: a
    steps:
      - run: echo "MARK needs.b" | tee -a trace.log
  c:
    runs-on: ubuntu-latest
    needs: [b]
    steps:
      - run: echo "MARK needs.c" | tee -a trace.log
