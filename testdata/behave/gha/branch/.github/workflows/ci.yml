name: ci
on: [push, pull_request]
jobs:
  always:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MARK branch.always" | tee -a trace.log
  main-only:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "MARK branch.main" | tee -a trace.log
  tag-only:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: echo "MARK branch.tag" | tee -a trace.log
