name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MARK reusable_local.build" | tee -a trace.log
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "MARK reusable_local.notify" | tee -a trace.log
