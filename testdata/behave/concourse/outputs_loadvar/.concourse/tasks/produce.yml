platform: linux
image_resource:
  type: registry-image
  source: {repository: alpine, tag: "3.20"}
inputs:
  - name: source
outputs:
  - name: out
run:
  path: sh
  args:
    - -ec
    - |
      echo 1.2.3 > out/version
      echo "MARK repo.seed:$(cat source/data/seed.txt)"
      echo "MARK outputs.produce"
