resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: cd-input
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: {repository: alpine, tag: "3.20"}
          inputs:
            - name: source
          run:
            path: sh
            args: [-ec, 'cd source && echo "MARK inputs.cd:$(cat data/seed.txt)"']
      - task: run-dir
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: {repository: alpine, tag: "3.20"}
          inputs:
            - name: source
          run:
            path: sh
            dir: source
            args: [-ec, 'echo "MARK inputs.dir:$(cat data/seed.txt)"']
