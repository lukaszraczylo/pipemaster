default:
  image: alpine:3.20
always:
  script:
    - echo "MARK branch.always" | tee -a trace.log
main-only:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "MARK branch.main" | tee -a trace.log
tag-only:
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "MARK branch.tag" | tee -a trace.log
