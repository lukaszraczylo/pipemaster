origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/ci.yml
pipelines:
    - ext:
        concourse:
            resources:
                - name: source-tags
                  source:
                    tag_filter: v*
                    uri: ((git-uri))
                  type: git
      id: ci
      name: tag
      triggers:
        - ext:
            concourse:
                resources:
                    - source-tags
          kind: tag
          tags:
            include:
                - v*
      jobs:
        - ext:
            concourse:
                gets:
                    - get: source-tags
                      trigger: true
          id: build
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source-tags
                    tags:
                        - ubuntu-latest
              id: build-step-1
              kind: script
              script:
                - echo ok
