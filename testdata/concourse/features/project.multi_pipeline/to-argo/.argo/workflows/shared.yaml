# pipemaster:emulated step.image pipeline/.shared/job/run
# pipemaster:arg {"steps":{"run-step-1":"ref: ubuntu:latest\n"},"wrote":{"run-step-1":"ubuntu:latest"}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # pipemaster:id .shared
  name: shared
  annotations:
    workflows.argoproj.io/title: shared
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: run
            template: run
    - name: run
      containerSet:
        containers:
          - name: run-step-1
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - echo run
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
