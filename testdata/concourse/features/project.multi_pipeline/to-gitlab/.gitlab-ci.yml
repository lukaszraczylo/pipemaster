# pipemaster:emulated project.multi_pipeline pipeline/.shared
# pipemaster:arg {"name":"shared","triggers":null}
# pipemaster:emulated project.multi_pipeline pipeline/ci
# pipemaster:arg {"name":"CI","triggers":[{"Resource":null,"Ext":{"concourse":{"_carried":["resources"],"resources":["source"]}},"Kind":"push","Cron":"","Branches":{"Include":["main"],"Exclude":null},"Tags":{"Include":null,"Exclude":null},"Paths":{"Include":null,"Exclude":null}},{"Resource":null,"Ext":{"concourse":{"_carried":["resources"],"resources":["source-tags"]}},"Kind":"tag","Cron":"","Branches":{"Include":null,"Exclude":null},"Tags":{"Include":["*"],"Exclude":null},"Paths":{"Include":null,"Exclude":null}}]}
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[^\/]*$/
# pipemaster:jobid .shared:run
# pipemaster:emulated project.multi_pipeline pipeline/.shared/job/run
# pipemaster:arg {}
shared:run-job:
  needs: []
  rules:
    - when: never
  script:
    # pipemaster:step run-step-1
    - echo run
# pipemaster:emulated project.multi_pipeline pipeline/ci/job/build
# pipemaster:arg {}
ci:build:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[^\/]*$/
  script:
    # pipemaster:step build-step-1
    - echo build
