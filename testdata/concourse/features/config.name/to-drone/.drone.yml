# pipemaster:arg "- ext:\n    concourse:\n        resources:\n            - source\n  kind: push\n  branches:\n    include:\n        - main\n- ext:\n    concourse:\n        resources:\n            - source-tags\n  kind: tag\n  tags:\n    include:\n        - '*'\n"
# pipemaster:lost expr.opaque pipeline/ci/job/build/step/build-step-1: vars.REGION
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
  ref:
    - refs/heads/main
    - refs/tags/*
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo "$${REGION}"
    environment:
      KEY:
        from_secret: DEPLOY_KEY
      API_TOKEN:
        from_secret: API_TOKEN
