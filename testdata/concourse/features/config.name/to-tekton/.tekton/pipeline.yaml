# pipemaster:emulated config.name pipeline/ci/ref/secrets.API_TOKEN
# pipemaster:emulated config.name pipeline/ci/ref/secrets.DEPLOY_KEY
# pipemaster:emulated config.name pipeline/ci/ref/secrets.REGION
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci
spec:
  displayName: config
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: build
      taskRef:
        name: ci-build
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
