# pipemaster:emulated trigger.filter.tags pipeline/ci/trigger/1
when:
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/*
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo "$${REGION}"
    environment:
      KEY:
        from_secret: DEPLOY_KEY
      API_TOKEN:
        from_secret: API_TOKEN
      REGION:
        from_secret: REGION
