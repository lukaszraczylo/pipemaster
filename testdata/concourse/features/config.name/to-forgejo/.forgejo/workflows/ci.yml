# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo \"${REGION}\""]}
name: config
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo "${REGION}"'
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          REGION: ${{ secrets.REGION }}
