# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:arg {"kind":"push","branches":{"Include":["main"],"Exclude":null}}
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
# pipemaster:arg {"kind":"tag","tags":{"Include":["*"],"Exclude":null}}
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^[^\/]*$/
build:
  needs: []
  script:
    # pipemaster:step build-step-1
    # pipemaster:emulated step.env pipeline/ci/job/build/step/build-step-1
    - |
      (
      export KEY="$DEPLOY_KEY"
      export API_TOKEN="$API_TOKEN"
      export REGION="$REGION"
      echo "${REGION}"
      )
