name: stepenv
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo "$GREETING"'
        env:
          KEY: ${{ secrets.KEY }}
