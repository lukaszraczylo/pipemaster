apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: stepenv
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - echo "$GREETING"
            workingDir: /workspace
            env:
              - name: KEY
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: KEY
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
