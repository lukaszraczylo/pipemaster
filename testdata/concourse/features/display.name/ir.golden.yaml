origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/ci.yml
pipelines:
    - ext:
        concourse:
            _carried:
                - resources
            resources:
                - name: source
                  source:
                    branch: main
                    uri: ((git-uri))
                  type: git
                - name: source-tags
                  source:
                    tag_filter: '*'
                    uri: ((git-uri))
                  type: git
      id: ci
      name: Build and test
      triggers:
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source
          kind: push
          branches:
            include:
                - main
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source-tags
          kind: tag
          tags:
            include:
                - '*'
      jobs:
        - ext:
            concourse:
                _carried:
                    - gets
                _checkout: {}
                gets:
                    - get: source
                      trigger: true
                    - get: source-tags
                      trigger: true
          id: build
          name: Build the binary
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
                    tags:
                        - ubuntu-latest
              id: build-step-1
              name: Compile
              kind: script
              script:
                - go build ./...
