name: Build and test
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    name: Build the binary
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        name: Compile
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
