apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: timeout
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - echo ok
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      timeout: 15m0s
      volumes:
        - emptyDir: {}
          name: workspace
