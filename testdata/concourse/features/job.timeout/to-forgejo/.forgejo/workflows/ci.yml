# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo ok"]}
# pipemaster:emulated job.artifacts pipeline/ci/job/build
# pipemaster:arg {"pre":1,"post":0}
name: timeout
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo ok'
