# pipemaster:emulated display.name pipeline/ci
# pipemaster:arg {"name":"timeout","id":"ci","written":"ci","kind":"pipeline"}
# pipemaster:emulated ext.passthrough pipeline/ci
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated job.timeout pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - do:
          - get: source
            trigger: true
          - get: source-tags
            trigger: true
          - task: build-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - echo ok
            tags:
              - ubuntu-latest
        timeout: 15m0s
