# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/flaky
# pipemaster:arg {"from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/flaky
# pipemaster:emulated step.image pipeline/ci/job/flaky/step/flaky-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo ok"]}
# pipemaster:emulated job.artifacts pipeline/ci/job/flaky
# pipemaster:arg {"pre":1,"post":0}
name: allow
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  flaky:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/flaky/step/flaky-step-1
      - id: flaky-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo ok'
