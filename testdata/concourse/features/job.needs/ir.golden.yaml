origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/ci.yml
pipelines:
    - ext:
        concourse:
            _carried:
                - resources
            resources:
                - name: source
                  source:
                    branch: main
                    uri: ((git-uri))
                  type: git
                - name: source-tags
                  source:
                    tag_filter: '*'
                    uri: ((git-uri))
                  type: git
      id: ci
      name: needs
      triggers:
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source
          kind: push
          branches:
            include:
                - main
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source-tags
          kind: tag
          tags:
            include:
                - '*'
      jobs:
        - ext:
            concourse:
                _carried:
                    - gets
                gets:
                    - get: source
                      trigger: true
                    - get: source-tags
                      trigger: true
          id: lint
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
                    tags:
                        - ubuntu-latest
              id: lint-step-1
              kind: script
              script:
                - echo lint
        - ext:
            concourse:
                _carried:
                    - gets
                gets:
                    - get: source
                      passed:
                        - lint
                        - test
                      trigger: true
                    - get: source-tags
          id: ship
          needs:
            - job: lint
            - job: test
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
                    tags:
                        - ubuntu-latest
              id: ship-step-1
              kind: script
              script:
                - echo ship
        - ext:
            concourse:
                _carried:
                    - gets
                gets:
                    - get: source
                      trigger: true
                    - get: source-tags
                      trigger: true
          id: test
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
                    tags:
                        - ubuntu-latest
              id: test-step-1
              kind: script
              script:
                - echo test
