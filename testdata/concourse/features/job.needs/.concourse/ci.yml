# pipemaster:emulated display.name pipeline/ci
# pipemaster:arg {"name":"needs","id":"ci","written":"ci","kind":"pipeline"}
# pipemaster:emulated ext.passthrough pipeline/ci
# pipemaster:emulated job.runner pipeline/ci/job/lint
# pipemaster:emulated step.image pipeline/ci/job/lint/step/lint-step-1
# pipemaster:emulated job.runner pipeline/ci/job/ship
# pipemaster:emulated step.image pipeline/ci/job/ship/step/ship-step-1
# pipemaster:emulated job.runner pipeline/ci/job/test
# pipemaster:emulated step.image pipeline/ci/job/test/step/test-step-1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: lint
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: lint-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo lint
        tags:
          - ubuntu-latest
  - name: ship
    plan:
      - get: source
        passed:
          - lint
          - test
        trigger: true
      - get: source-tags
      - task: ship-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo ship
        tags:
          - ubuntu-latest
  - name: test
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: test-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo test
        tags:
          - ubuntu-latest
