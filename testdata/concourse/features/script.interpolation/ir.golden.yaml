origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/ci.yml
pipelines:
    - ext:
        concourse:
            _carried:
                - resources
            resources:
                - name: source
                  source:
                    branch: main
                    uri: ((git-uri))
                  type: git
      id: ci
      triggers:
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source
          kind: push
          branches:
            include:
                - main
      jobs:
        - ext:
            concourse:
                _carried:
                    - gets
                _checkout: {}
                gets:
                    - get: source
                      trigger: true
          id: build
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
              id: build-run
              kind: script
              script:
                - echo on ${{ branch }}
