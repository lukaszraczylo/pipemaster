apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-run
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - echo on ${PM_CTX_BRANCH}
            workingDir: /workspace
            env:
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
