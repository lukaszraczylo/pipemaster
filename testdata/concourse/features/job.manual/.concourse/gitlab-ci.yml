# pipemaster:emulated job.allow_failure pipeline/gitlab-ci/job/deploy
# pipemaster:emulated job.manual pipeline/gitlab-ci/job/deploy
# pipemaster:arg {"manual":true,"held":true}
# pipemaster:emulated ext.passthrough pipeline/gitlab-ci
# pipemaster:emulated step.image pipeline/gitlab-ci/job/deploy/step/script
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: deploy
    plan:
      - try:
          do:
            - get: source
            - get: source-tags
            - task: script
              input_mapping:
                workspace: source
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source:
                    repository: ubuntu
                    tag: latest
                inputs:
                  - name: workspace
                outputs:
                  - name: workspace
                run:
                  path: sh
                  args:
                    - -ec
                    - make deploy
