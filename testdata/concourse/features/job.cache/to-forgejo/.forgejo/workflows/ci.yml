# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/compile
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:latest","Entrypoint":null},"script":["go build ./..."]}
# pipemaster:emulated step.image pipeline/ci/job/build/step/test
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:latest","Entrypoint":null},"script":["go test ./..."]}
# pipemaster:emulated job.cache pipeline/ci/job/build
# pipemaster:arg {"cache":[{"Key":"","Policy":"","Paths":[".cache/go","vendor"]}],"pre":2,"post":0}
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated job.cache pipeline/ci/job/build
      - uses: https://github.com/actions/cache@v6
        with:
          path: |
            .cache/go
            vendor
          key: build-cache
      # pipemaster:emulated step.image pipeline/ci/job/build/step/compile
      - id: compile
        uses: docker://golang:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
      # pipemaster:emulated step.image pipeline/ci/job/build/step/test
      - id: test
        uses: docker://golang:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'go test ./...'
