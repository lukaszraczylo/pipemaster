origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/ci.yml
pipelines:
    - ext:
        concourse:
            _carried:
                - resources
            resources:
                - name: source
                  source:
                    branch: main
                    uri: ((git-uri))
                  type: git
      id: ci
      triggers:
        - ext:
            concourse:
                _carried:
                    - resources
                resources:
                    - source
          kind: push
          branches:
            include:
                - main
      jobs:
        - ext:
            concourse:
                _carried:
                    - gets
                _checkout: {}
                gets:
                    - get: source
                      trigger: true
          id: build
          steps:
            - image:
                ref: golang:latest
              ext:
                concourse:
                    _carried:
                        - config
                        - layout
                    config:
                        inputs:
                            - name: source
                        platform: linux
                    layout:
                        lines:
                            - '[ -e source ] || ln -s "$PWD" source'
              id: compile
              kind: script
              script:
                - '[ -e source ] || ln -s "$PWD" source'
                - go build ./...
            - image:
                ref: golang:latest
              ext:
                concourse:
                    _carried:
                        - config
                        - layout
                    config:
                        inputs:
                            - name: source
                        platform: linux
                    layout:
                        lines:
                            - '[ -e source ] || ln -s "$PWD" source'
              id: test
              kind: script
              script:
                - '[ -e source ] || ln -s "$PWD" source'
                - go test ./...
          cache:
            - paths:
                - .cache/go
                - vendor
