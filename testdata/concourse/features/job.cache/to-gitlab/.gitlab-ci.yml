# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:arg {"kind":"push","branches":{"Include":["main"],"Exclude":null}}
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
# pipemaster:emulated step.image pipeline/ci/job/build
# pipemaster:arg {"job":"build","parts":["build"],"own":["compile","test"]}
build:
  image: golang:latest
  needs: []
  script:
    # pipemaster:step compile
    - '[ -e source ] || ln -s "$PWD" source'
    - go build ./...
    # pipemaster:step test
    - '[ -e source ] || ln -s "$PWD" source'
    - go test ./...
  cache:
    - paths:
        - .cache/go
        - vendor
