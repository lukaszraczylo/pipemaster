resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: compile
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: golang
              tag: latest
          inputs:
            - name: source
          caches:
            - path: .cache/go
            - path: vendor
          run:
            path: sh
            args:
              - -ec
              - go build ./...
      - task: test
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: golang
              tag: latest
          inputs:
            - name: source
          caches:
            - path: .cache/go
            - path: vendor
          run:
            path: sh
            args:
              - -ec
              - go test ./...
