apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  volumeClaimTemplates:
    - metadata:
        name: cache-build-1
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: compile
            image: golang:latest
            command:
              - sh
              - -ec
            args:
              - |-
                [ -e source ] || ln -s "$PWD" source
                go build ./...
            workingDir: /workspace
          - # pipemaster:id test
            name: main
            image: golang:latest
            command:
              - sh
              - -ec
            args:
              - |-
                [ -e source ] || ln -s "$PWD" source
                go test ./...
            workingDir: /workspace
            dependencies:
              - compile
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache-build-1
            mountPath: /workspace/.cache/go
            subPath: p1
          - name: cache-build-1
            mountPath: /workspace/vendor
            subPath: p2
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
