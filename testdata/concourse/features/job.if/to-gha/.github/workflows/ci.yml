# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"src":"branch == 'main'","from":"concourse"}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-run
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["make"]}
on:
  push:
    branches:
      - main
jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-run
      - id: build-run
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec make
