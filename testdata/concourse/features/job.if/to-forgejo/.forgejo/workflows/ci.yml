# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"src":"branch == 'main'","from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-run
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["make"]}
# pipemaster:emulated job.artifacts pipeline/ci/job/build
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == 'main' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-run
      - id: build-run
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec make
