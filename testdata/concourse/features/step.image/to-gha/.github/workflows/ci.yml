name: base
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec 'make build'
  deploy:
    needs:
      - build
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/deploy/step/deploy-step-1
      - id: deploy-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'make deploy'
