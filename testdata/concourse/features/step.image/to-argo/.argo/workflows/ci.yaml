apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: base
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
          - name: deploy
            template: deploy
            dependencies:
              - build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - make build
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: deploy
      containerSet:
        containers:
          - name: deploy-step-1
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - make deploy
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
