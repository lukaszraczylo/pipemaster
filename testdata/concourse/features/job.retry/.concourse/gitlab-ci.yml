# pipemaster:emulated ext.passthrough pipeline/gitlab-ci
# pipemaster:emulated job.retry pipeline/gitlab-ci/job/build
# pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - do:
          - get: source
            trigger: true
          - get: source-tags
            trigger: true
          - task: script
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - make
        attempts: 3
