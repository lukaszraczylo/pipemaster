on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/script
      - id: script
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec make
