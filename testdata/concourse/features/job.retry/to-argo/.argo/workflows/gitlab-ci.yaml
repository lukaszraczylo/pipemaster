apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: script
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - make
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      retryStrategy:
        limit: "2"
      volumes:
        - emptyDir: {}
          name: workspace
