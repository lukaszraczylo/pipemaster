origin:
    provider: concourse
    dialect: concourse
    files:
        - .concourse/gitlab-ci.yml
pipelines:
    - ext:
        concourse:
            resources:
                - name: source
                  source:
                    branch: main
                    uri: ((git-uri))
                  type: git
                - name: source-tags
                  source:
                    tag_filter: '*'
                    uri: ((git-uri))
                  type: git
      id: gitlab-ci
      triggers:
        - ext:
            concourse:
                resources:
                    - source
          kind: push
          branches:
            include:
                - main
        - ext:
            concourse:
                resources:
                    - source-tags
          kind: tag
          tags:
            include:
                - '*'
      jobs:
        - retry:
            attempts: 3
          ext:
            concourse:
                gets:
                    - get: source
                      trigger: true
                    - get: source-tags
                      trigger: true
          id: build
          steps:
            - image:
                ref: ubuntu:latest
              ext:
                concourse:
                    config:
                        inputs:
                            - name: workspace
                        outputs:
                            - name: workspace
                        platform: linux
                    input_mapping:
                        workspace: source
              id: script
              kind: script
              script:
                - make
