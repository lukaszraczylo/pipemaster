# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
name: action
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: "0"
          token: ${{ secrets.PAT }}
      - id: build-step-2
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: "1.24"
      - id: build-step-3
        uses: docker://alpine:3.20
      - id: local
        uses: ./.github/actions/setup
