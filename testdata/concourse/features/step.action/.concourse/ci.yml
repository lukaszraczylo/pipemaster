resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: build-step-1
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          run:
            path: sh
            args:
              - -ec
              - "true"
      - task: build-step-2
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          run:
            path: sh
            args:
              - -ec
              - "true"
      - task: build-step-3
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          run:
            path: sh
            args:
              - -ec
              - "true"
      - task: local
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          run:
            path: sh
            args:
              - -ec
              - "true"
