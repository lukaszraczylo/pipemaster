# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo cleanup"]}
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"src":"event == 'push'","from":"concourse"}
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo push"]}
name: stepif
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo cleanup'
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-2
      - id: build-step-2
        if: github.event_name == 'push' && !github.event.deleted
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo push'
