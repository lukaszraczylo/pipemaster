# pipemaster:arg {"steps":{"build-step-1":"ref: ubuntu:latest\n","build-step-2":"ref: ubuntu:latest\n"},"wrote":{"build-step-1":"ubuntu:latest","build-step-2":"ubuntu:latest"}}
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.filter.tags pipeline/ci/trigger/1
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: stepif
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-event
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - echo cleanup
            workingDir: /workspace
          - name: build-step-2
            image: ubuntu:latest
            command:
              - sh
              - -ec
            args:
              - |-
                if ! [ "$PM_CTX_EVENT" = 'push' ]; then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                echo push
            workingDir: /workspace
            env:
              - name: PM_CTX_EVENT
                value: '{{workflow.parameters.ctx-event}}'
            dependencies:
              - build-step-1
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
