# pipemaster:emulated display.name pipeline/ci
# pipemaster:arg {"name":"stepif","id":"ci","written":"ci","kind":"pipeline"}
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"if":"event == 'push'","script":"echo push"}
# pipemaster:emulated ext.passthrough pipeline/ci
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-2
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo cleanup
        tags:
          - ubuntu-latest
      - task: build-step-2
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                exit 0 # pipemaster:guard the step condition has no shell form
                echo push
        tags:
          - ubuntu-latest
