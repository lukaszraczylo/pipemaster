name: stepif
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo cleanup'
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-2
      - id: build-step-2
        if: github.event_name == 'push'
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo push'
