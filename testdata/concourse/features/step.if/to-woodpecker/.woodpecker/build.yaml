# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"src":"event == 'push'","from":"concourse"}
# pipemaster:emulated trigger.filter.tags pipeline/ci/trigger/1
when:
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/*
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo cleanup
  - name: build-step-2
    image: ubuntu:latest
    commands:
      - echo push
    when:
      - event:
          - push
          - tag
