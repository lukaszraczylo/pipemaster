# pipemaster:emulated job.runner pipeline/ci/job/test
# pipemaster:emulated step.image pipeline/ci/job/test/step/test-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo $\u007b{ matrix.go }}"]}
name: matrix
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        go:
          - "1.24"
          - "1.25"
        include:
          - experimental: "true"
            go: "1.25"
            os: ubuntu-latest
        exclude:
          - go: "1.24"
            os: macos-latest
      fail-fast: false
      max-parallel: 2
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/test/step/test-step-1
      - id: test-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo ${{ matrix.go }}'
