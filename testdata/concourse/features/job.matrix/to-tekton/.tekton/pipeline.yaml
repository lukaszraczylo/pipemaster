apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci
spec:
  displayName: matrix
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: test
      taskRef:
        name: ci-test
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
      matrix:
        include:
          - params:
              - name: os
                value: ubuntu-latest
              - name: go
                value: "1.24"
          - params:
              - name: os
                value: ubuntu-latest
              - name: go
                value: "1.25"
          - params:
              - name: os
                value: macos-latest
              - name: go
                value: "1.25"
          - params:
              - name: experimental
                value: "true"
              - name: go
                value: "1.25"
              - name: os
                value: ubuntu-latest
