# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/test
# pipemaster:arg {"from":"concourse","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/test
# pipemaster:emulated step.image pipeline/ci/job/test/step/test-step-1
# pipemaster:arg {"kind":"script","image":{"Ref":"ubuntu:latest","Entrypoint":null},"script":["echo $\u007b{ matrix.go }}"]}
# pipemaster:emulated job.artifacts pipeline/ci/job/test
# pipemaster:arg {"pre":1,"post":0}
name: matrix
on:
  push:
    branches:
      - main
    tags:
      - '*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        go:
          - "1.24"
          - "1.25"
        include:
          - experimental: "true"
            go: "1.25"
            os: ubuntu-latest
        exclude:
          - go: "1.24"
            os: macos-latest
      fail-fast: false
      max-parallel: 2
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/test/step/test-step-1
      - id: test-step-1
        uses: docker://ubuntu:latest
        with:
          entrypoint: /bin/sh
          args: -ec 'echo ${{ matrix.go }}'
