resources:
  - name: source-main
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-release-old
    type: git
    source:
      uri: ((git-uri))
      branch: '!release/old'
jobs:
  - name: build
    plan:
      - get: source-main
        trigger: true
      - get: source-release-old
        trigger: true
