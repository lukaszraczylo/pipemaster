# pipemaster:emulated pipeline.concurrency pipeline/ci
name: branches
on:
  pull_request:
    branches-ignore:
      - wip/**
  push:
    branches:
      - main
      - release/**
      - '!release/old'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
