origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: branches
      triggers:
        - kind: pr
          branches:
            exclude:
                - wip/**
        - kind: push
          branches:
            include:
                - main
                - release/**
                - '!release/old'
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo ok
