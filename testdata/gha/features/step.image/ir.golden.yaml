origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: base
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - image:
                ref: alpine:3.20
                entrypoint:
                    - ""
              ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - make build
        - id: deploy
          runner:
            labels:
                - ubuntu-latest
          needs:
            - job: build
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: deploy-step-1
              kind: script
              script:
                - make deploy
