origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: matrix
      triggers:
        - kind: push
      jobs:
        - matrix:
            fail_fast: false
            axes:
                - name: os
                  values:
                    - ubuntu-latest
                    - macos-latest
                - name: go
                  values:
                    - "1.24"
                    - "1.25"
            include:
                - - key: experimental
                    value: "true"
                  - key: go
                    value: "1.25"
                  - key: os
                    value: ubuntu-latest
            exclude:
                - - key: go
                    value: "1.24"
                  - key: os
                    value: macos-latest
            max_parallel: 2
          id: test
          runner:
            labels:
                - ${{ matrix.os }}
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - echo ${{ matrix.go }}
