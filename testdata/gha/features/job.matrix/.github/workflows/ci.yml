name: matrix
on: push
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24', '1.25']
        include:
          - os: ubuntu-latest
            go: '1.25'
            experimental: true
        exclude:
          - os: macos-latest
            go: '1.24'
    steps:
      - run: echo ${{ matrix.go }}
