# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"fail_fast":false,"axes":[{"Name":"os","Values":["ubuntu-latest","macos-latest"]},{"Name":"go","Values":["1.24","1.25"]}],"include":[[{"Key":"experimental","Value":"true"},{"Key":"go","Value":"1.25"},{"Key":"os","Value":"ubuntu-latest"}]],"exclude":[[{"Key":"go","Value":"1.24"},{"Key":"os","Value":"macos-latest"}]],"max_parallel":2}
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: matrix
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
            withItems:
              - go: "1.24"
                os: ubuntu-latest
                experimental: ""
              - go: "1.25"
                os: ubuntu-latest
                experimental: "true"
              - go: "1.25"
                os: macos-latest
                experimental: ""
            arguments:
              parameters:
                - name: go
                  value: '{{item.go}}'
                - name: os
                  value: '{{item.os}}'
                - name: experimental
                  value: '{{item.experimental}}'
    - name: test
      containerSet:
        containers:
          - name: test-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo {{inputs.parameters.go}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: go
          - name: os
          - name: experimental
      volumes:
        - emptyDir: {}
          name: workspace
