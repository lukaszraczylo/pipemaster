origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - id: script
              kind: script
              script:
                - make
          artifacts:
            - name: bin
              expire: 1 week
              paths:
                - bin/
