# pipemaster:emulated pipeline.concurrency pipeline/ci
name: container
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.24
      env:
        GOFLAGS: -mod=readonly
      options: --cpus 2
    steps:
      - run: go version
