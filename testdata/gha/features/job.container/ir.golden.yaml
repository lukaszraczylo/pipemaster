origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: container
      triggers:
        - kind: push
      jobs:
        - container:
            ref: golang:1.24
          ext:
            gha:
                container:
                    env:
                        GOFLAGS: -mod=readonly
                    options: --cpus 2
          id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - go version
