resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            CGO_ENABLED: "0"
            VERSION: "3.1"
            TOKEN: ((DEPLOY_TOKEN))
          run:
            path: sh
            args:
              - -ec
              - echo ok
            dir: workspace
        tags:
          - ubuntu-latest
