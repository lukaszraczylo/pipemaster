origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
        - .github/workflows/deploy.yml
pipelines:
    - id: ci
      name: CI
      triggers:
        - kind: push
      jobs:
        - id: test
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - echo test
    - id: deploy
      name: Deploy
      triggers:
        - ext:
            gha:
                inputs:
                    target:
                        options:
                            - staging
                            - production
          kind: manual
      inputs:
        - name: target
          type: choice
          default: staging
          description: Where to deploy
          required: true
      jobs:
        - id: deploy
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: deploy-step-1
              kind: script
              script:
                - echo deploy
