resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -c
                  - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                  - pipemaster
                  - echo test
                dir: workspace
        across:
          - var: matrix
            values:
              - python: "3.13"
                os: ""
              - python: "3.14"
                os: macos-latest
            max_in_flight: all
