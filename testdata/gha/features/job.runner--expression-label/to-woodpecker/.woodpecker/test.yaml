# pipemaster:emulated job.container pipeline/ci/job/test
when:
  - event: push
  - event: tag
matrix:
  include:
    - python: "3.13"
    - os: macos-latest
      python: "3.14"
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo test'
