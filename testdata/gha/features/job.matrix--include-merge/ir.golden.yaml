origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - matrix:
            axes:
                - name: go
                  values:
                    - "1.21"
                    - "1.22"
            include:
                - - key: experimental
                    value: "true"
                  - key: go
                    value: "1.22"
          id: test
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - go test ${{ matrix.go }}
