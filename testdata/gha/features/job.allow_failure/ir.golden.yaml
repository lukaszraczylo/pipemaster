origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: allow
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: flaky
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: flaky-step-1
              kind: script
              script:
                - echo ok
          allow_failure: true
