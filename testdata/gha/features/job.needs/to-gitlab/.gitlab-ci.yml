stages:
  - stage-0
  - stage-1
workflow:
  name: needs
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
lint:
  stage: stage-0
  tags:
    - ubuntu-latest
  needs: []
  script:
    # pipemaster:step lint-step-1
    - echo lint
ship:
  stage: stage-1
  tags:
    - ubuntu-latest
  needs:
    - lint
    - test
  script:
    # pipemaster:step ship-step-1
    - echo ship
test:
  stage: stage-0
  tags:
    - ubuntu-latest
  needs: []
  script:
    # pipemaster:step test-step-1
    - echo test
