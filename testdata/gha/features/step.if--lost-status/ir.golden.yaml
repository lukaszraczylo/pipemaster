origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: lost status
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo build
            - if: failure()
              ext:
                gha:
                    _derived_id: true
              id: build-step-2
              kind: script
              script:
                - echo cleanup
            - id: config
              kind: script
              script:
                - echo "configured=true" >> "$GITHUB_OUTPUT"
            - if: steps.config.outputs.configured == 'true'
              ext:
                gha:
                    _derived_id: true
              id: build-step-4
              kind: script
              script:
                - echo configured
