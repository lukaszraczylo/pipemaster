resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: schedule
    type: time
    source:
      start: "00:00"
      stop: "00:05"
      days:
        - Sunday
  - name: schedule-2
    type: time
    source:
      start: "05:30"
      stop: "05:35"
      days:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
jobs:
  - name: build
    plan:
      - get: source
      - get: schedule
        trigger: true
      - get: schedule-2
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo ok
            dir: workspace
