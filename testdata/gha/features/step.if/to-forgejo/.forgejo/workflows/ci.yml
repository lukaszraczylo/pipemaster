# pipemaster:emulated pipeline.concurrency pipeline/ci
name: stepif
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: echo cleanup
      - if: github.event_name == 'push'
        run: echo push
