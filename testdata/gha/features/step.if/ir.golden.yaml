origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: stepif
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - if: always()
              ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo cleanup
            - if: event == 'push'
              ext:
                gha:
                    _derived_id: true
              id: build-step-2
              kind: script
              script:
                - echo push
