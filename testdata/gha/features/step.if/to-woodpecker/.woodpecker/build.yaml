# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:lost step.if pipeline/ci/job/build/step/build-step-2: event == 'push'
when:
  - event: push
  - event: tag
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo cleanup'
    when:
      - status:
          - success
          - failure
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo push'
    when:
      - evaluate: "false"
