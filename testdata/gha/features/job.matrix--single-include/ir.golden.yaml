origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: ci
      triggers:
        - kind: push
      jobs:
        - matrix:
            include:
                - - key: os
                    value: ubuntu-latest
          id: test
          runner:
            labels:
                - ${{ matrix.os }}
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - make test
