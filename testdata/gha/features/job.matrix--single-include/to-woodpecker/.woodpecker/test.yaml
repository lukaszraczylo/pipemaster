# pipemaster:emulated job.container pipeline/ci/job/test
when:
  - event: push
  - event: tag
matrix:
  include:
    - os: ubuntu-latest
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make test'
