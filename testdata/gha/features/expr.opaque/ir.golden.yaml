origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: opaque
      triggers:
        - kind: push
      jobs:
        - if: 'opaque(gha): fromJSON(''{"a":1}'').a == 1'
          id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - 'echo ${{ opaque(gha): env[github.job] }}'
