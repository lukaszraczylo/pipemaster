origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: runner
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - linux
                - self-hosted
                - x64
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo ok
        - id: grouped
          runner:
            selector:
                group: big-runners
            labels:
                - linux
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: grouped-step-1
              kind: script
              script:
                - echo ok
