resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      paths:
        - src/**
        - '!src/docs/**'
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
      paths:
        - src/**
        - '!src/docs/**'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo ok
            dir: workspace
        tags:
          - ubuntu-latest
  - name: build-tag
    plan:
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source-tags
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
