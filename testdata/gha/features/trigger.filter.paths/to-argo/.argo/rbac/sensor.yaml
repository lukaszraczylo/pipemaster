# pipemaster:rbac
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipemaster-sensor
---
# pipemaster:rbac
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipemaster-sensor
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
---
# pipemaster:rbac
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipemaster-sensor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipemaster-sensor
subjects:
  - kind: ServiceAccount
    name: pipemaster-sensor
