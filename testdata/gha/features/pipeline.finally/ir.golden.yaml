origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - id: script
              kind: script
              script:
                - make build
      finally:
        - if: failure()
          id: alert
          needs:
            - job: build
          steps:
            - id: script
              kind: script
              script:
                - ./page.sh
        - id: report
          needs:
            - job: build
          steps:
            - id: script
              kind: script
              script:
                - ./notify.sh
