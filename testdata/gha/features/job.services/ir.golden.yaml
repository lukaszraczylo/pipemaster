origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: services
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            gha:
                services:
                    db:
                        options: --health-cmd pg_isready
          id: test
          runner:
            labels:
                - ubuntu-latest
          services:
            - name: db
              image:
                ref: postgres:16
              env:
                - name: POSTGRES_PASSWORD
                  value:
                    secret: DB_PASSWORD
              ports:
                - 5432:5432
            - name: cache
              image:
                ref: redis:7
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - echo ok
