origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/gitlab-ci.yml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - retry:
            "on":
                - runner_system_failure
            attempts: 3
          id: build
          steps:
            - id: script
              kind: script
              script:
                - make
