# pipemaster:emulated job.container pipeline/ci/job/check
# pipemaster:lost script.interpolation pipeline/ci/job/check/step/check-step-2: docker inspect {{ steps.meta.outputs.version }}
# pipemaster:emulated step.if pipeline/ci/job/check/step/check-step-2
kind: pipeline
type: docker
name: check
trigger:
  event:
    - push
    - tag
steps:
  - name: meta
    image: ubuntu:latest
    commands:
      - echo "version=1" >> "$$GITHUB_OUTPUT"
  - name: check-step-2
    image: ubuntu:latest
    commands:
      - 'if ! [ "$$DRONE_BUILD_EVENT" != ''pull_request'' ]; then exit 0; fi # pipemaster:guard'
      - 'printf ''%s\n'' ''pipemaster: lost: script.interpolation pipeline/ci/job/check/step/check-step-2: no Drone spelling for expression steps.meta.outputs.version; the line is replaced by a line that prints the loss and exits 1'' >&2; exit 1'
