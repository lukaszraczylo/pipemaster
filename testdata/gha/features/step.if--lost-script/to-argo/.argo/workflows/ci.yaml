apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: ci
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-event
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: check
            template: check
    - name: check
      containerSet:
        containers:
          - name: meta
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo "version=1" >> "$GITHUB_OUTPUT"
            workingDir: /workspace
          - name: check-step-2
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                if ! [ "$PM_CTX_EVENT" != 'pull_request' ]; then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                printf '%s\n' 'pipemaster: lost: script.interpolation pipeline/ci/job/check/step/check-step-2: no Argo spelling for expression steps.meta.outputs.version; the line is replaced by a line that prints the loss and exits 1' >&2; exit 1
            workingDir: /workspace
            env:
              - name: PM_CTX_EVENT
                value: '{{workflow.parameters.ctx-event}}'
            dependencies:
              - meta
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
