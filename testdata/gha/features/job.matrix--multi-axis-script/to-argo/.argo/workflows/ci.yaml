# pipemaster:emulated job.outputs pipeline/ci/job/prod
# pipemaster:arg {"values":{"ver":"v1"}}
# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"axes":[{"Name":"os","Values":["linux","mac"]},{"Name":"go","Values":["1.24","1.25"]}],"exclude":[[{"Key":"go","Value":"1.24"},{"Key":"os","Value":"mac"}]]}
# pipemaster:emulated job.runner pipeline/ci/job/prod
# pipemaster:emulated step.shell pipeline/ci/job/prod/step/prod-step-1
# pipemaster:emulated job.runner pipeline/ci/job/test
# pipemaster:emulated step.shell pipeline/ci/job/test/step/test-step-1
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: matrix multi axis
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: prod
            template: prod
          - name: test
            template: test
            dependencies:
              - prod
            withItems:
              - go: "1.24"
                os: linux
              - go: "1.25"
                os: linux
              - go: "1.25"
                os: mac
            arguments:
              parameters:
                - name: go
                  value: '{{item.go}}'
                - name: os
                  value: '{{item.os}}'
                - name: needs-prod-ver
                  value: '{{= (tasks[''prod''].outputs.parameters[''ver''] ?? '''') }}'
    - name: prod
      containerSet:
        containers:
          - # pipemaster:id prod-step-1
            name: main
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                mkdir -p /workspace/.pipemaster/outputs && printf '%s' "${PM_OUT_VER}" > /workspace/.pipemaster/outputs/ver
                make
            workingDir: /workspace
            env:
              - name: PM_OUT_VER
                value: v1
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      outputs:
        parameters:
          - name: ver
            valueFrom:
              path: /workspace/.pipemaster/outputs/ver
              default: ""
      volumes:
        - emptyDir: {}
          name: workspace
    - name: test
      containerSet:
        containers:
          - name: test-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo {{inputs.parameters.os}} {{inputs.parameters.go}} {{inputs.parameters.needs-prod-ver}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: go
          - name: os
          - name: needs-prod-ver
      volumes:
        - emptyDir: {}
          name: workspace
