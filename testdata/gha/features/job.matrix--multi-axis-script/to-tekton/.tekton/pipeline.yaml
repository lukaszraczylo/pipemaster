apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci
spec:
  displayName: matrix multi axis
  tasks:
    - name: prod
      taskRef:
        name: ci-prod
    - name: test
      taskRef:
        name: ci-test
      params:
        - name: needs-prod-ver
          value: $(tasks.prod.results.ver)
      runAfter:
        - prod
      matrix:
        include:
          - params:
              - name: os
                value: linux
              - name: go
                value: "1.24"
          - params:
              - name: os
                value: linux
              - name: go
                value: "1.25"
          - params:
              - name: os
                value: mac
              - name: go
                value: "1.25"
