name: matrix multi axis
on: push
jobs:
  prod:
    runs-on: ubuntu-latest
    outputs:
      ver: v1
    steps:
      - run: make
  test:
    needs: prod
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, mac]
        go: ['1.24', '1.25']
        exclude:
          - os: mac
            go: '1.24'
    steps:
      - run: echo ${{ matrix.os }} ${{ matrix.go }} ${{ needs.prod.outputs.ver }}
