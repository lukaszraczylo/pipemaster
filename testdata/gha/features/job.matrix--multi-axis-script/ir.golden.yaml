origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: matrix multi axis
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: prod
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: prod-step-1
              kind: script
              script:
                - make
          outputs:
            - name: ver
              value: v1
        - matrix:
            axes:
                - name: os
                  values:
                    - linux
                    - mac
                - name: go
                  values:
                    - "1.24"
                    - "1.25"
            exclude:
                - - key: go
                    value: "1.24"
                  - key: os
                    value: mac
          id: test
          runner:
            labels:
                - ubuntu-latest
          needs:
            - job: prod
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - echo ${{ matrix.os }} ${{ matrix.go }} ${{ needs.prod.outputs.ver }}
