# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: prod
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: prod-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - make
            dir: workspace
        tags:
          - ubuntu-latest
  - name: test
    plan:
      - get: source
        passed:
          - prod
        trigger: true
      - get: source-tags
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - '# pipemaster:lost echo {{ matrix.os }} {{ matrix.go }} {{ needs.prod.outputs.ver }}'
                dir: workspace
            tags:
              - ubuntu-latest
        across:
          - var: matrix
            values:
              - go: "1.24"
                os: linux
              - go: "1.25"
                os: linux
              - go: "1.25"
                os: mac
            max_in_flight: all
