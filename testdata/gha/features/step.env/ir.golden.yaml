origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: stepenv
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo "$GREETING"
              env:
                - name: GREETING
                  value:
                    expr: format('hello {0}', actor)
                - name: KEY
                  value:
                    secret: KEY
