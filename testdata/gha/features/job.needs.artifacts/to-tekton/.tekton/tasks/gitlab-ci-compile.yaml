# pipemaster:emulated step.image pipeline/gitlab-ci/job/compile/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/compile
# pipemaster:arg {"workspace":"pipemaster-workspace","save":"set -e\nmkdir -p '/pipemaster/artifacts/compile'\ntar -cf - 'bin/' | tar -xf - -C '/pipemaster/artifacts/compile'","artifacts":[{"Name":"","Expire":"","Paths":["bin/"]}]}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-compile
spec:
  steps:
    - name: script
      image: alpine:3.22
      script: make
    - name: pipemaster-artifacts-save
      image: alpine:3.22
      script: |-
        set -e
        mkdir -p '/pipemaster/artifacts/compile'
        tar -cf - 'bin/' | tar -xf - -C '/pipemaster/artifacts/compile'
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
