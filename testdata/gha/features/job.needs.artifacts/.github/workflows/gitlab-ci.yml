on:
  push:
    branches:
      - '**'
    tags:
      - '**'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make
      # pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/compile
      - uses: actions/upload-artifact@v7
        with:
          name: compile
          path: bin/
  docs:
    needs:
      - compile
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make docs
  unit:
    needs:
      - compile
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated job.needs.artifacts pipeline/gitlab-ci/job/unit
      - uses: actions/download-artifact@v8
        with:
          name: compile
      - id: script
        run: make test
