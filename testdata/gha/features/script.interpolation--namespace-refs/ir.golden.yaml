origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      triggers:
        - kind: manual
      env:
        - name: REGION
          value:
            lit: eu
      inputs:
        - name: target
          default: staging
          description: Deploy target
      jobs:
        - matrix:
            axes:
                - name: os
                  values:
                    - ubuntu-latest
                    - macos-latest
          id: test
          runner:
            labels:
                - ${{ matrix.os }}
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: test-step-1
              kind: script
              script:
                - echo ${{ matrix.os }} ${{ inputs.target }} ${{ env.REGION }} ${{ vars.LEVEL }}
