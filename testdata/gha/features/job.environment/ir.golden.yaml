origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: env
      triggers:
        - kind: push
      jobs:
        - environment:
            name: production
            url: https://example.com
          id: deploy
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: deploy-step-1
              kind: script
              script:
                - echo deploy
