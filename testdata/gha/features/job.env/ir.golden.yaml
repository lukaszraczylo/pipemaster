origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: jobenv
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo ok
          env:
            - name: GOFLAGS
              value:
                lit: -trimpath
            - name: API
              value:
                secret: API_KEY
