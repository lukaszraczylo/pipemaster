# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated job.env pipeline/ci/job/build
# pipemaster:arg "- name: GOFLAGS\n  value:\n    lit: -trimpath\n- name: API\n  value:\n    secret: API_KEY\n"
when:
  - event: push
  - event: tag
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
    environment:
      GOFLAGS: -trimpath
      API:
        from_secret: API_KEY
