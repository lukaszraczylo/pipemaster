origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - concurrency:
        group: ci-${{ ref }}
        cancel_in_progress: true
      id: ci
      name: conc
      triggers:
        - kind: push
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo ok
