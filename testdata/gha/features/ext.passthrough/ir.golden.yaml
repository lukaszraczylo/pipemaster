origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - ext:
        gha:
            events:
                issues:
                    types:
                        - opened
            run-name: Deploy by ${{ github.actor }}
      id: ci
      name: ext
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              shell: bash
              workdir: app
              script:
                - echo ok
