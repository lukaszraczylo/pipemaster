origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: config
      triggers:
        - kind: push
        - kind: tag
      env:
        - name: API_TOKEN
          value:
            secret: API_TOKEN
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo "${{ vars.REGION }}"
              env:
                - name: KEY
                  value:
                    secret: DEPLOY_KEY
