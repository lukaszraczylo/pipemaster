# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated script.interpolation pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"refs":["vars.REGION"],"pos":0}
# pipemaster:emulated pipeline.env pipeline/ci
# pipemaster:arg "- name: API_TOKEN\n  value:\n    secret: API_TOKEN\n"
when:
  - event: push
  - event: tag
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo "$${REGION}"'
    environment:
      KEY:
        from_secret: DEPLOY_KEY
      REGION:
        from_secret: REGION
      API_TOKEN:
        from_secret: API_TOKEN
