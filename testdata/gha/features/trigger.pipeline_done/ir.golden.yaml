origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: after
      triggers:
        - ext:
            gha:
                types:
                    - completed
                workflows:
                    - Build
          kind: pipeline_done
          branches:
            include:
                - main
      jobs:
        - id: build
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo ok
