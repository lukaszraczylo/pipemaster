    plan:
      - get: source
        passed:
          - version
        trigger: true
      - get: source-tags
      - task: use-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - '# pipemaster:lost echo {{ needs.version.outputs.tag }}'
            dir: workspace
        tags:
          - ubuntu-latest
  - name: version
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: tag
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo "value=v1" >> "$GITHUB_OUTPUT"
            dir: workspace
        tags:
          - ubuntu-latest
