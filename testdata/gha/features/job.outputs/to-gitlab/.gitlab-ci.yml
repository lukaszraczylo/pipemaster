# pipemaster:emulated script.interpolation pipeline/ci
# pipemaster:arg [{"k":"t","p":"job/use/step/use-step-1/script/0","g":"echo $tag","s":"echo $\u007b{ needs.version.outputs.tag }}"}]
stages:
  - stage-0
  - stage-1
workflow:
  name: outputs
use:
  stage: stage-1
  tags:
    - ubuntu-latest
  needs:
    - version
  script:
    # pipemaster:step use-step-1
    # pipemaster:lost script.interpolation pipeline/ci/job/use/step/use-step-1: echo {{ needs.version.outputs.tag }}
    - 'printf ''%s\n'' ''pipemaster: lost: script.interpolation pipeline/ci/job/use/step/use-step-1: no GitLab variable for expression needs.version.outputs.tag; the line is replaced by a line that prints the loss and exits 1'' >&2; exit 1'
# pipemaster:lost job.outputs pipeline/ci/job/version: output tag is not written
version:
  stage: stage-0
  tags:
    - ubuntu-latest
  needs: []
  script:
    # pipemaster:step tag
    - echo "value=v1" >> "$GITHUB_OUTPUT"
