origin:
    provider: gha
    dialect: gha
    files:
        - .github/workflows/ci.yml
pipelines:
    - id: ci
      name: outputs
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: use
          runner:
            labels:
                - ubuntu-latest
          needs:
            - job: version
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: use-step-1
              kind: script
              script:
                - echo ${{ needs.version.outputs.tag }}
        - id: version
          runner:
            labels:
                - ubuntu-latest
          steps:
            - id: tag
              kind: script
              script:
                - echo "value=v1" >> "$GITHUB_OUTPUT"
          outputs:
            - name: tag
              value: ${{ steps.tag.outputs.value }}
