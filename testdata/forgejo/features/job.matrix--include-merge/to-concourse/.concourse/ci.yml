resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              params:
                PM_MATRIX_GO: ((.:matrix.go))
              run:
                path: sh
                args:
                  - -c
                  - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                  - pipemaster
                  - go test ${PM_MATRIX_GO}
                dir: workspace
            tags:
              - ubuntu-latest
        across:
          - var: matrix
            values:
              - go: "1.21"
                experimental: ""
              - go: "1.22"
                experimental: "true"
            max_in_flight: all
