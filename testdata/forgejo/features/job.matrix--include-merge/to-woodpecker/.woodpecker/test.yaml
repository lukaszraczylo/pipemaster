# pipemaster:emulated job.container pipeline/ci/job/test
# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"FailFast":null,"Axes":[{"Name":"go","Values":["1.21","1.22"]}],"Include":[[{"Key":"experimental","Value":"true"},{"Key":"go","Value":"1.22"}]],"Exclude":null,"MaxParallel":0}
when:
  - event: push
  - event: tag
matrix:
  include:
    - go: "1.21"
    - experimental: "true"
      go: "1.22"
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'go test ${go}'
