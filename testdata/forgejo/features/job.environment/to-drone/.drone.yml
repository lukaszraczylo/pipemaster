# pipemaster:emulated job.container pipeline/ci/job/deploy
kind: pipeline
type: docker
name: deploy
node:
  docker: "true"
trigger:
  event:
    - push
    - tag
steps:
  - name: deploy-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo deploy'
