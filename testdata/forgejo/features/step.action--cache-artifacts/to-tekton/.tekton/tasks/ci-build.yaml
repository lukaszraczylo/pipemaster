apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-build
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: build-step-1
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: build-step-3
      image: alpine:3.22
      script: make build
    - name: build-step-4
      image: alpine:3.22
      script: |-
        set -e
        mkdir -p '/pipemaster/artifacts/dist'
        tar -cf - 'dist/' | tar -xf - -C '/pipemaster/artifacts/dist'
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
