on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: go-mod
          path: ~/go/pkg/mod
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: make test
