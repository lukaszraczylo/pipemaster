# pipemaster:emulated job.container pipeline/ci/job/test
kind: pipeline
type: docker
name: test
trigger:
  event:
    - push
    - tag
steps:
  - name: test-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
services:
  - name: db
    image: postgres:16
    environment:
      POSTGRES_PASSWORD:
        from_secret: DB_PASSWORD
    ports:
      - 5432:5432
  - name: cache
    image: redis:7
