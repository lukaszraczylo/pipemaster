resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: use
    plan:
      - get: source
        passed:
          - version
        trigger: true
      - get: source-tags
      - task: use-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - '# pipemaster:lost echo {{ needs.version.outputs.tag }}'
            dir: workspace
        tags:
          - ubuntu-latest
  - name: version
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: tag
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo "value=v1" >> "$GITHUB_OUTPUT"
            dir: workspace
        tags:
          - ubuntu-latest
