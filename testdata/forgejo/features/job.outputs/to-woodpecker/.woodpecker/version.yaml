# pipemaster:emulated job.container pipeline/ci/job/version
when:
  - event: push
  - event: tag
steps:
  - name: tag
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo "value=v1" >> "$$GITHUB_OUTPUT"'
