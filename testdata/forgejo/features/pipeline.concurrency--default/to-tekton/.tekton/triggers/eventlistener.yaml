# pipemaster:emulated trigger.pull_request pipeline/ci/trigger/0
# pipemaster:arg {"kind":"pr","name":"ci-pr-0","branches":{"Include":null,"Exclude":null},"tags":{"Include":null,"Exclude":null},"paths":{"Include":null,"Exclude":null}}
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:arg {"kind":"push","name":"ci-push-1","branches":{"Include":null,"Exclude":null},"tags":{"Include":null,"Exclude":null},"paths":{"Include":null,"Exclude":null}}
# pipemaster:emulated trigger.tag pipeline/ci/trigger/2
# pipemaster:arg {"kind":"tag","name":"ci-tag-2","branches":{"Include":null,"Exclude":null},"tags":{"Include":null,"Exclude":null},"paths":{"Include":null,"Exclude":null}}
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipemaster
spec:
  serviceAccountName: pipemaster-triggers
  triggers:
    - name: ci-pr-0
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - pull_request
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.action in ['opened','synchronize','reopened'] && body.pull_request.head.repo.full_name == body.repository.full_name
      bindings:
        - ref: ci-github
      template:
        ref: ci-run
    - name: ci-push-1
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref.startsWith('refs/heads/')
      bindings:
        - ref: ci-github
      template:
        ref: ci-run
    - name: ci-tag-2
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref.startsWith('refs/tags/')
      bindings:
        - ref: ci-github
      template:
        ref: ci-run
