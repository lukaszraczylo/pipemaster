# pipemaster:emulated job.container pipeline/ci/job/lint
kind: pipeline
type: docker
name: lint
trigger:
  event:
    - push
    - tag
steps:
  - name: lint-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo lint'
---
# pipemaster:emulated job.container pipeline/ci/job/ship
kind: pipeline
type: docker
name: ship
trigger:
  event:
    - push
    - tag
depends_on:
  - lint
  - test
steps:
  - name: ship-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ship'
---
# pipemaster:emulated job.container pipeline/ci/job/test
kind: pipeline
type: docker
name: test
trigger:
  event:
    - push
    - tag
steps:
  - name: test-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo test'
