resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: lint
    plan:
      - get: source
        trigger: true
      - task: lint-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
