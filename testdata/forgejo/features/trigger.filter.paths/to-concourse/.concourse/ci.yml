resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
      paths:
        - src/**
        - '!src/docs/**'
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
      paths:
        - src/**
        - '!src/docs/**'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo ok
        tags:
          - ubuntu-latest
