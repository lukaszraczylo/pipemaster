# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated trigger.filter.paths pipeline/ci
# pipemaster:arg "- kind: pr\n  paths:\n    exclude:\n        - '**.md'\n- kind: push\n  paths:\n    include:\n        - src/**\n        - '!src/docs/**'\n- kind: tag\n  paths:\n    include:\n        - src/**\n        - '!src/docs/**'\n"
when:
  - event: pull_request
    path:
      exclude:
        - '**.md'
  - event: push
    path:
      include:
        - src/**
      exclude:
        - src/docs/**
  - event: tag
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
