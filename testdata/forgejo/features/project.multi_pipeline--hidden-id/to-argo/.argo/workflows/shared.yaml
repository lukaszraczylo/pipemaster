# pipemaster:emulated ext.passthrough pipeline/.shared
# pipemaster:emulated step.shell pipeline/.shared/job/run/step/run-step-1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # pipemaster:id .shared
  name: shared
  annotations:
    workflows.argoproj.io/title: shared
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: run
            template: run
    - name: run
      containerSet:
        containers:
          - name: run-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo run
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
