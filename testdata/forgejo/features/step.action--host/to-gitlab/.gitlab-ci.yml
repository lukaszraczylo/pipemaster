    - 'printf ''%s\n'' ''pipemaster: lost: step.action pipeline/ci/job/build/step/build-step-2: the action has no GitLab form'' >&2; exit 1'
    # pipemaster:step build-step-3
    # pipemaster:lost step build-step-3 uses org/tool/sub@v2
