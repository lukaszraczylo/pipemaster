# pipemaster:emulated script.interpolation pipeline/ci/job/build
# pipemaster:arg {"vars":{"PM_CTX_REF_NAME":"ref_name","PM_CTX_SHA":"sha"}}
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-2
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: alias
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-ref-name
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                if ! [ "$PM_CTX_REF_NAME" = 'main' ]; then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                echo ${PM_CTX_REF_NAME}
            workingDir: /workspace
            env:
              - name: PM_CTX_REF_NAME
                value: '{{workflow.parameters.ctx-ref-name}}'
          - name: build-step-2
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - |-
                if ! [ "$PM_CTX_SHA" != '' ]; then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                echo ${PM_CTX_SHA}
            workingDir: /workspace
            env:
              - name: PM_CTX_SHA
                value: '{{workflow.parameters.ctx-sha}}'
            dependencies:
              - build-step-1
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
