apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci
spec:
  displayName: alias
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-ref-name
      default: ""
  tasks:
    - name: build
      taskRef:
        name: ci-build
      params:
        - name: ctx-ref-name
          value: $(params.ctx-ref-name)
        - name: ctx-sha
          value: $(params.ctx-sha)
