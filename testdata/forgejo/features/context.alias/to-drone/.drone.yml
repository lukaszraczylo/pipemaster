# pipemaster:lost script.interpolation pipeline/ci/job/build/step/build-step-1: echo {{ ref_name }}
# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"if":"ref_name == 'main'","back":"(ref == 'refs/heads/main') || (tag == 'main')"}
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - 'printf ''%s\n'' ''pipemaster: lost: script.interpolation pipeline/ci/job/build/step/build-step-1: no Drone spelling for expression ref_name; the line is replaced by a line that prints the loss and exits 1'' >&2; exit 1'
    when:
      ref:
        - refs/heads/main
        - refs/tags/main
  - name: build-step-2
    image: ubuntu:latest
    commands:
      - 'if ! [ "$$DRONE_COMMIT_SHA" != '''' ]; then exit 0; fi # pipemaster:guard'
      - echo $${DRONE_COMMIT_SHA}
