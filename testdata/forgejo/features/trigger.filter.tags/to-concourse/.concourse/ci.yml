resources:
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: v[0-9]+.[0-9]+.[0-9]+
  - name: source-tags-2
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '!v*-rc*'
jobs:
  - name: build
    plan:
      - get: source-tags
        trigger: true
      - get: source-tags-2
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source-tags
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo ok
            dir: workspace
        tags:
          - ubuntu-latest
