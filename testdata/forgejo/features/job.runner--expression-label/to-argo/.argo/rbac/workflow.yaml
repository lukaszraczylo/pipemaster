# pipemaster:rbac
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipemaster-workflow
---
# pipemaster:rbac
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipemaster-workflow
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
# pipemaster:rbac
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipemaster-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipemaster-workflow
subjects:
  - kind: ServiceAccount
    name: pipemaster-workflow
