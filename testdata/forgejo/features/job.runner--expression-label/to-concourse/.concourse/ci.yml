resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - echo test
                dir: workspace
        across:
          - var: matrix
            values:
              - python: "3.13"
                os: ""
              - python: "3.14"
                os: macos-latest
            max_in_flight: all
