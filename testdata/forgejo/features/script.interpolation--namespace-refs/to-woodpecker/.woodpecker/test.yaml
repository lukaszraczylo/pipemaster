# pipemaster:emulated job.container pipeline/ci/job/test
# pipemaster:emulated script.interpolation pipeline/ci/job/test/step/test-step-1
# pipemaster:arg {"refs":["inputs.target","env.REGION","vars.LEVEL"],"pos":0}
# pipemaster:emulated pipeline.env pipeline/ci
# pipemaster:arg "- name: REGION\n  value:\n    lit: eu\n"
when:
  - event: manual
matrix:
  os:
    - ubuntu-latest
    - macos-latest
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ${os} $${target} $${REGION} $${LEVEL}'
    environment:
      LEVEL:
        from_secret: LEVEL
      REGION: eu
