# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:lost trigger.* pipeline/ci/job/build: no trigger of the pipeline has a Woodpecker event
when:
  - event:
      - push
      - pull_request
      - pull_request_closed
      - pull_request_metadata
      - tag
      - release
      - deployment
      - cron
      - manual
    evaluate: "false"
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
