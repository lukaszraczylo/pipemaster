# pipemaster:emulated step.image pipeline/gitlab-ci/job/build/step/script
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
# pipemaster:arg {"workspace":"pipemaster-workspace","cache":[{"Key":"$\u007b{ hashFiles('go.sum') }}","Policy":"pull-push","Paths":[".cache/go-build"]}]}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitlab-ci-build
spec:
  steps:
    - name: script
      image: alpine:3.22
      script: make
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
