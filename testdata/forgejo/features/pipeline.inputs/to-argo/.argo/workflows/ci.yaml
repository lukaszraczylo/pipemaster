# pipemaster:emulated pipeline.inputs pipeline/ci
# pipemaster:arg {"types":{"dry-run":"boolean","environment":"choice"},"required":["environment"]}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated trigger.manual pipeline/ci/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: inputs
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: environment
        value: staging
        description: Where to deploy
      - name: dry-run
        value: "false"
        description: Skip the push
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo ok
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
