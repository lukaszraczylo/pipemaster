# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated display.name pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"name":"Build","pos":0}
when:
  - event: push
  - event: tag
steps:
  - name: Build
    image: ubuntu:latest
    commands:
      - |-
        sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'go build ./...
        go test ./...'
