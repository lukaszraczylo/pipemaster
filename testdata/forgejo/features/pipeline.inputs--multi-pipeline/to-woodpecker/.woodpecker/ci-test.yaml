# pipemaster:emulated project.multi_pipeline pipeline/ci
# pipemaster:arg {"pipeline":"ci","job":"test","p":0,"j":0}
# pipemaster:emulated job.container pipeline/ci/job/test
when:
  - event: push
  - event: tag
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo test'
