# pipemaster:emulated job.container pipeline/ci/job/notify
when:
  - event: push
    branch: main
depends_on:
  - release-apply
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo released'
