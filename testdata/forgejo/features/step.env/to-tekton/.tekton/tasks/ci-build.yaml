# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"image":"alpine:3.22"}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-build
spec:
  params:
    - name: ctx-actor
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: echo "$GREETING"
      env:
        - name: GREETING
          value: hello $(params.ctx-actor)
        - name: KEY
          valueFrom:
            secretKeyRef:
              name: ci-secrets
              key: KEY
