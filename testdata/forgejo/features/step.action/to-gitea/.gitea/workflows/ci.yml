name: action
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: "0"
          token: ${{ secrets.PAT }}
      - uses: https://data.forgejo.org/actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: docker://alpine:3.20
      - id: local
        uses: ./.github/actions/setup
