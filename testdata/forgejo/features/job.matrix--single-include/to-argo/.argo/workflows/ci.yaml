# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"include":[[{"Key":"os","Value":"ubuntu-latest"}]]}
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
            withItems:
              - os: ubuntu-latest
            arguments:
              parameters:
                - name: os
                  value: '{{item.os}}'
    - name: test
      containerSet:
        containers:
          - name: test-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make test
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: os
      volumes:
        - emptyDir: {}
          name: workspace
