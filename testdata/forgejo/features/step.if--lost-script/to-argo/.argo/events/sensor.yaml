apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: pipemaster
spec:
  dependencies:
    - eventName: push
      eventSourceName: pipemaster-github
      name: ci-push
    - eventName: push
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - ^refs/tags/.*$
      name: ci-tag
  template:
    serviceAccountName: pipemaster-sensor
  triggers:
    - template:
        conditions: ci-push
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dependencyName: ci-push
                value: push
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-
              spec:
                arguments:
                  parameters:
                    - name: ctx-event
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: ci
        name: ci-push
    - template:
        conditions: ci-tag
        k8s:
          operation: create
          parameters:
            - dest: spec.arguments.parameters.0.value
              src:
                dependencyName: ci-tag
                value: push
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-
              spec:
                arguments:
                  parameters:
                    - name: ctx-event
                      value: ""
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: ci
        name: ci-tag
