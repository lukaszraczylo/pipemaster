resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: check
    plan:
      - get: source
        trigger: true
      - task: meta
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo "version=1" >> "$GITHUB_OUTPUT"
            dir: workspace
        tags:
          - ubuntu-latest
