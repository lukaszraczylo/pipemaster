resources:
  - name: source-main
    type: git
    source:
      uri: ((git-uri))
      branch: main
  - name: source-release-old
    type: git
    source:
      uri: ((git-uri))
      branch: '!release/old'
jobs:
  - name: build
    plan:
      - get: source-main
        trigger: true
      - get: source-release-old
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source-main
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo ok
            dir: workspace
