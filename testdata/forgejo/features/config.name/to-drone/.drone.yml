# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated script.interpolation pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"at":{"vars.CI":{"at":[0],"of":1},"vars.FORGEJO_REGION":{"at":[0],"of":1}},"refs":["vars.FORGEJO_REGION","vars.CI"],"pos":0}
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo "$${FORGEJO_REGION} $${CI}"'
    environment:
      KEY:
        from_secret: DEPLOY_KEY
      FORGEJO_REGION:
        from_secret: FORGEJO_REGION
      CI:
        from_secret: CI
