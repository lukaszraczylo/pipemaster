origin:
    provider: forgejo
    dialect: forgejo
    files:
        - .forgejo/workflows/ci.yml
pipelines:
    - id: ci
      name: config
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          runner:
            labels:
                - docker
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: build-step-1
              kind: script
              script:
                - echo "${{ vars.FORGEJO_REGION }} ${{ vars.CI }}"
              env:
                - name: KEY
                  value:
                    secret: DEPLOY_KEY
