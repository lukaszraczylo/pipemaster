# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated script.interpolation pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"refs":[{"ref":"vars.REGION","name":"REGION","at":[0],"of":1}]}
# pipemaster:emulated pipeline.env pipeline/ci/job/build
# pipemaster:arg {"names":["API_TOKEN"]}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-build
spec:
  stepTemplate:
    env:
      - name: API_TOKEN
        valueFrom:
          secretKeyRef:
            name: ci-secrets
            key: API_TOKEN
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo "${REGION}"
      env:
        - name: KEY
          valueFrom:
            secretKeyRef:
              name: ci-secrets
              key: DEPLOY_KEY
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: ci-vars
              key: REGION
