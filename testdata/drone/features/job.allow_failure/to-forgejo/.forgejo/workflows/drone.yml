# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.if pipeline/drone/job/ci
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/flaky
# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.20","Entrypoint":null},"script":["./flaky.sh"]}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/flaky
      - id: flaky
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./flaky.sh
