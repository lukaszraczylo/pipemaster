origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: alpine:3.20
              id: flaky
              kind: script
              script:
                - ./flaky.sh
          allow_failure: true
