origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: lint
          steps:
            - image:
                ref: golangci/golangci-lint:v2
              id: lint
              kind: script
              script:
                - golangci-lint run
        - id: ship
          needs:
            - job: lint
          steps:
            - image:
                ref: alpine:3.20
              id: ship
              kind: script
              script:
                - ./ship.sh
