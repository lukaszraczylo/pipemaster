apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: lint
            template: lint
          - name: ship
            template: ship
            dependencies:
              - lint
    - name: lint
      containerSet:
        containers:
          - name: lint
            image: golangci/golangci-lint:v2
            command:
              - sh
              - -ec
            args:
              - golangci-lint run
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: ship
      containerSet:
        containers:
          - name: ship
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - ./ship.sh
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
