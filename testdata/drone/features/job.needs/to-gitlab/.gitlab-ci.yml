stages:
  - stage-0
  - stage-1
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/drone/job/lint
# pipemaster:arg {"job":"lint","parts":["lint"],"own":["lint"]}
lint:
  stage: stage-0
  image: golangci/golangci-lint:v2
  needs: []
  script:
    # pipemaster:step lint
    - golangci-lint run
# pipemaster:emulated step.image pipeline/drone/job/ship
# pipemaster:arg {"job":"ship","parts":["ship"],"own":["ship"]}
ship:
  stage: stage-1
  image: alpine:3.20
  needs:
    - lint
  script:
    # pipemaster:step ship
    - ./ship.sh
