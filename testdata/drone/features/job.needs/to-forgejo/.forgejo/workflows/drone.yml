on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/lint/step/lint
      - id: lint
        uses: docker://golangci/golangci-lint:v2
        with:
          entrypoint: /bin/sh
          args: -ec 'golangci-lint run'
  ship:
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ship/step/ship
      - id: ship
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./ship.sh
