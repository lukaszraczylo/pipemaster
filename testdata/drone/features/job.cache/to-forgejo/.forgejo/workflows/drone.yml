# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.if pipeline/drone/job/ci
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/build
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:1.25","Entrypoint":null},"script":["go build ./..."]}
# pipemaster:emulated job.cache pipeline/drone/job/ci
# pipemaster:arg {"cache":[{"Key":"go-mod","Policy":"pull-push","Paths":["~/go/pkg/mod"]}],"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated job.cache pipeline/drone/job/ci
      - uses: https://github.com/actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
