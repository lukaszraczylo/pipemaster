# pipemaster:emulated job.cache pipeline/drone/job/ci
# pipemaster:arg {"workspace":"pipemaster-workspace","cache":[{"Key":"go-mod","Policy":"pull-push","Paths":["~/go/pkg/mod"]}]}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: drone-ci
spec:
  steps:
    - name: build
      image: golang:1.25
      script: go build ./...
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
