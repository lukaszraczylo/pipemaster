# pipemaster:arg {"step":"action:\n    kind: repo\n    host: https://github.com\n    owner: actions\n    repo: checkout\n    ref: v7\nid: source-checkout\nkind: action\n","wrote":"{\"name\":\"source-checkout\",\"params\":[{\"name\":\"url\",\"value\":\"https://github.com/$(params.ctx-repo).git\"},{\"name\":\"revision\",\"value\":\"$(params.ctx-sha)\"},{\"name\":\"output-path\",\"value\":\"/workspace\"}],\"ref\":{\"params\":[{\"name\":\"url\",\"value\":\"https://github.com/tektoncd-catalog/git-clone.git\"},{\"name\":\"revision\",\"value\":\"v1.7.1\"},{\"name\":\"pathInRepo\",\"value\":\"stepaction/git-clone/git-clone.yaml\"}],\"resolver\":\"git\"}}","at":0}
# pipemaster:emulated job.cache pipeline/drone/job/ci
# pipemaster:arg {"workspace":"pipemaster-workspace","cache":[{"Key":"go-mod","Policy":"pull-push","Paths":["~/go/pkg/mod"],"FallbackKeys":null}]}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: drone-ci
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: source-checkout
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: build
      image: golang:1.25
      script: go build ./...
  workspaces:
    - name: pipemaster-workspace
      mountPath: /pipemaster
