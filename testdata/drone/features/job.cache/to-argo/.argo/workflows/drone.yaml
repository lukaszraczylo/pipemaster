apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  volumeClaimTemplates:
    - metadata:
        name: cache-ci-1
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id build
            name: main
            image: golang:1.25
            command:
              - sh
              - -ec
            args:
              - go build ./...
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache-ci-1
            mountPath: /workspace/go/pkg/mod
            subPath: p1
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
