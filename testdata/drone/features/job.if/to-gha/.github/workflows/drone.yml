on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      # pipemaster:lost job.if pipeline/drone/job/ci: (event == 'push') && (actor == 'release-bot')
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
