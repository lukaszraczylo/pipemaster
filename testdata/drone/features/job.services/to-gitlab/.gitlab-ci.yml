workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/drone/job/ci
# pipemaster:arg {"job":"ci","parts":["ci"],"own":["test"]}
ci:
  image: golang:1.25
  services:
    - name: postgres:17
      alias: db
      variables:
        POSTGRES_PASSWORD: example
  needs: []
  script:
    # pipemaster:step test
    - go test ./...
