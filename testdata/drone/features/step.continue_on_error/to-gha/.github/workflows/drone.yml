on:
  push:
    branches:
      - '**'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/lint
      - id: lint
        uses: docker://golangci/golangci-lint:v2
        with:
          entrypoint: /bin/sh
          args: -ec 'golangci-lint run'
        continue-on-error: true
