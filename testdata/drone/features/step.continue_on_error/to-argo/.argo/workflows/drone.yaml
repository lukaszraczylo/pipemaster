apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id lint
            name: main
            image: golangci/golangci-lint:v2
            command:
              - sh
              - -ec
            args:
              - |-
                trap 'exit 0' EXIT # pipemaster:continue-on-error
                golangci-lint run
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
