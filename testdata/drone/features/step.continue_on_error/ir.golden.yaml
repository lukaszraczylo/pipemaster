origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: golangci/golangci-lint:v2
              id: lint
              kind: script
              script:
                - golangci-lint run
              continue_on_error: true
