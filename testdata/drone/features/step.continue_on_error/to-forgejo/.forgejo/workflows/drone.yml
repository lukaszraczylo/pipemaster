# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.if pipeline/drone/job/ci
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/lint
# pipemaster:arg {"kind":"script","image":{"Ref":"golangci/golangci-lint:v2","Entrypoint":null},"script":["golangci-lint run"]}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/lint
      - id: lint
        uses: docker://golangci/golangci-lint:v2
        with:
          entrypoint: /bin/sh
          args: -ec 'golangci-lint run'
        continue-on-error: true
