# pipemaster:emulated step.image pipeline/drone/job/ci
# pipemaster:arg {"steps":{"deploy":"ref: alpine:3.20\n"},"wrote":{"deploy":"alpine:3.20"}}
# pipemaster:emulated step.if pipeline/drone/job/ci/step/deploy
# pipemaster:emulated trigger.filter.branches pipeline/drone/trigger/0
# pipemaster:emulated trigger.push pipeline/drone/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
      - name: ctx-event
        value: ""
      - name: ctx-actor
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: deploy
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - |-
                if ! ( ( [ "$PM_CTX_EVENT" = 'tag' ] || [ "$PM_CTX_BRANCH" = 'main' ] ) && [ "$PM_CTX_ACTOR" = 'release-bot' ] ); then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                ./deploy.sh
            workingDir: /workspace
            env:
              - name: PM_CTX_EVENT
                value: '{{workflow.parameters.ctx-event}}'
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
              - name: PM_CTX_ACTOR
                value: '{{workflow.parameters.ctx-actor}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
