apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
      - name: ctx-event
        value: ""
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
      - name: ctx-actor
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id deploy
            name: main
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - |-
                if ! ( ( [ "$PM_CTX_EVENT" = 'tag' ] || [ "$PM_CTX_BRANCH" = 'main' ] ) && [ "$PM_CTX_ACTOR" = 'release-bot' ] ); then echo 'pipemaster: skipped: the condition of this step is false'; exit 0; fi # pipemaster:guard
                ./deploy.sh
            workingDir: /workspace
            env:
              - name: PM_CTX_EVENT
                value: '{{workflow.parameters.ctx-event}}'
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
              - name: PM_CTX_ACTOR
                value: '{{workflow.parameters.ctx-actor}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
