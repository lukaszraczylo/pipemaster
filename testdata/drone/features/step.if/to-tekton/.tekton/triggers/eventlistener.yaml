# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:arg {"kind":"push","name":"drone-push-0","branches":{"Include":null,"Exclude":null},"tags":{"Include":null,"Exclude":null},"paths":{"Include":null,"Exclude":null}}
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipemaster
spec:
  serviceAccountName: pipemaster-triggers
  triggers:
    - name: drone-push-0
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref.startsWith('refs/heads/')
            - name: overlays
              value:
                - key: ctx_branch
                  expression: body.ref.replace('refs/heads/','',1)
                - key: ctx_event
                  expression: '''push'''
                - key: ctx_actor
                  expression: body.sender.login
      bindings:
        - ref: drone-github
      template:
        ref: drone-run
