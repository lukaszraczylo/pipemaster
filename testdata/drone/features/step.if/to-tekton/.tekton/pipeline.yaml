apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: drone
spec:
  params:
    - name: ctx-branch
      default: ""
    - name: ctx-event
      default: ""
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
    - name: ctx-actor
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: drone-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
        - name: ctx-event
          value: $(params.ctx-event)
        - name: ctx-branch
          value: $(params.ctx-branch)
        - name: ctx-actor
          value: $(params.ctx-actor)
