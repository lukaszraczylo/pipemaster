apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id build
            name: main
            image: golang:1.25
            command:
              - sh
              - -ec
            args:
              - go build ./...
            workingDir: /workspace
            env:
              - name: CGO_ENABLED
                value: "0"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
