apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id build
            name: main
            image: rust:1.85
            command:
              - sh
              - -ec
            args:
              - cargo build --release
            workingDir: /workspace
          - name: publish
            image: woodpeckerci/plugin-docker-buildx
            workingDir: /workspace
            env:
              - name: PLUGIN_REPO
                value: example/app
              - name: PLUGIN_TAGS
                value: latest
            securityContext:
              privileged: true
            dependencies:
              - main
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
