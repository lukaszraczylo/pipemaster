apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: rust:1.85
            command:
              - sh
              - -ec
            args:
              - cargo build --release
            workingDir: /workspace
          - name: publish
            image: woodpeckerci/plugin-docker-buildx
            workingDir: /workspace
            env:
              - name: PLUGIN_REPO
                value: example/app
              - name: PLUGIN_TAGS
                value: latest
            securityContext:
              privileged: true
            dependencies:
              - build
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
