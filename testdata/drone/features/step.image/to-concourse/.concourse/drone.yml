resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: ci
    plan:
      - get: source
        trigger: true
      - task: build
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: rust
              tag: "1.85"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - cargo build --release
            dir: workspace
      - task: publish
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: woodpeckerci/plugin-docker-buildx
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            PLUGIN_REPO: example/app
            PLUGIN_TAGS: latest
          run:
            path: /usr/local/bin/dockerd-entrypoint.sh
            args:
              - plugin-docker-buildx
            dir: workspace
        privileged: true
