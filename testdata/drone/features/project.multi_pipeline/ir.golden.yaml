origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: ci
      triggers:
        - kind: push
      jobs:
        - id: test
          steps:
            - image:
                ref: alpine:3.20
              id: test
              kind: script
              script:
                - ./test.sh
    - id: deploy
      triggers:
        - kind: manual
      jobs:
        - id: ship
          steps:
            - image:
                ref: alpine:3.20
              id: ship
              kind: script
              script:
                - ./ship.sh
