# pipemaster:emulated job.if pipeline/ci/job/test
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/test
# pipemaster:emulated step.image pipeline/ci/job/test/step/test
# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.20","Entrypoint":null},"script":["./test.sh"]}
# pipemaster:emulated job.artifacts pipeline/ci/job/test
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/ci/job/test/step/test
      - id: test
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./test.sh
