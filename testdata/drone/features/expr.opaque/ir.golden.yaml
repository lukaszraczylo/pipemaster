origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - if: 'opaque(drone): when.ref glob "refs/tags/v*"'
              image:
                ref: alpine:3.20
              id: release
              kind: script
              script:
                - ./release.sh
