# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.runner pipeline/drone/job/ci
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GO_VERSION:
          - "1.24"
          - "1.25"
        OS:
          - linux
          - darwin
    steps:
      - id: test
        run: |
          go test ./...
          echo ${{ matrix.OS }}
