apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-sha
        value: ""
      - name: ctx-repo
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
            withItems:
              - GO_VERSION: "1.24"
                OS: linux
              - GO_VERSION: "1.24"
                OS: darwin
              - GO_VERSION: "1.25"
                OS: linux
              - GO_VERSION: "1.25"
                OS: darwin
            arguments:
              parameters:
                - name: GO_VERSION
                  value: '{{item.GO_VERSION}}'
                - name: OS
                  value: '{{item.OS}}'
    - name: ci
      containerSet:
        containers:
          - # pipemaster:id test
            name: main
            image: golang:{{inputs.parameters.GO_VERSION}}
            command:
              - sh
              - -ec
            args:
              - |-
                go test ./...
                echo {{inputs.parameters.OS}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: GO_VERSION
          - name: OS
        artifacts:
          - name: source
            path: /workspace
            git:
              repo: https://github.com/{{workflow.parameters.ctx-repo}}.git
              revision: '{{workflow.parameters.ctx-sha}}'
      volumes:
        - emptyDir: {}
          name: workspace
