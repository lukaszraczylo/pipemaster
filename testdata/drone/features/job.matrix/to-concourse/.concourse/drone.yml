resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: ci
    plan:
      - get: source
        trigger: true
      - do:
          - task: test
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: golang:((.
                  tag: GO_VERSION))
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              run:
                path: sh
                args:
                  - -ec
                  - |-
                    go test ./...
                    # pipemaster:lost echo {{ matrix.OS }}
        across:
          - var: GO_VERSION
            values:
              - "1.24"
              - "1.25"
