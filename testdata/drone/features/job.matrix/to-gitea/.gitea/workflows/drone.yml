# pipemaster:emulated trigger.push pipeline/drone/trigger/0
# pipemaster:emulated job.if pipeline/drone/job/ci
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/test
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:$\u007b{ matrix.GO_VERSION }}","Entrypoint":null},"script":["go test ./...","echo $\u007b{ matrix.OS }}"],"run":true}
on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GO_VERSION:
          - "1.24"
          - "1.25"
        OS:
          - linux
          - darwin
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/test
      - id: test
        run: docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --entrypoint /bin/sh "$PIPEMASTER_IMAGE" -ec "$PIPEMASTER_SCRIPT"
        env:
          PIPEMASTER_IMAGE: golang:${{ matrix.GO_VERSION }}
          PIPEMASTER_SCRIPT: |
            go test ./...
            echo ${{ matrix.OS }}
