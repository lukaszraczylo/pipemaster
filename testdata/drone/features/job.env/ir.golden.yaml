origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: ci
          steps:
            - image:
                ref: golang:1.25
              id: build
              kind: script
              script:
                - go build ./...
          env:
            - name: GOFLAGS
              value:
                lit: -trimpath
            - name: TOKEN
              value:
                secret: deploy_token
