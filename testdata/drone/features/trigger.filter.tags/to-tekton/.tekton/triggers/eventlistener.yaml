# pipemaster:emulated trigger.tag pipeline/drone/trigger/0
# pipemaster:arg {"kind":"tag","name":"drone-tag-0","branches":{"Include":null,"Exclude":null},"tags":{"Include":["v*"],"Exclude":null},"paths":{"Include":null,"Exclude":null}}
# pipemaster:emulated trigger.filter.tags pipeline/drone/trigger/0
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: pipemaster
spec:
  serviceAccountName: pipemaster-triggers
  triggers:
    - name: drone-tag-0
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value:
                - push
            - name: secretRef
              value:
                secretName: pipemaster-github-webhook
                secretKey: token
        - ref:
            name: cel
          params:
            - name: filter
              value: body.ref.startsWith('refs/tags/') && (body.ref.replace('refs/tags/','',1).matches(r'^v[^/]*$'))
            - name: overlays
              value:
                - key: ctx_sha
                  expression: body.after
                - key: ctx_repo
                  expression: body.repository.full_name
      bindings:
        - ref: drone-github
      template:
        ref: drone-run
