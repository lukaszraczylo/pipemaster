on:
  push:
    branches:
      - '**'
  # pipemaster:emulated job.manual pipeline/drone/job/deploy
  workflow_dispatch:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # pipemaster:emulated job.manual pipeline/drone/job/deploy
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/deploy/step/deploy
      - id: deploy
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./deploy.sh
