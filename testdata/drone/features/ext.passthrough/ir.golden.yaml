origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - ext:
            drone:
                workspace:
                    path: src/app
          id: ci
          steps:
            - image:
                ref: golang:1.25
              id: build
              kind: script
              script:
                - go build ./...
