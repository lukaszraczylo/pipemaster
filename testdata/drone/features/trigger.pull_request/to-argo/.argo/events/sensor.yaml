apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: pipemaster
spec:
  dependencies:
    - eventName: pull_request
      eventSourceName: pipemaster-github
      filters:
        data:
          - path: body.action
            type: string
            value:
              - opened
              - reopened
              - synchronize
        exprs:
          - expr: head == base
            fields:
              - name: head
                path: body.pull_request.head.repo.full_name
              - name: base
                path: body.repository.full_name
      name: drone-pr
  template:
    serviceAccountName: pipemaster-sensor
  triggers:
    - template:
        conditions: drone-pr
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: drone-
              spec:
                serviceAccountName: pipemaster-workflow
                workflowTemplateRef:
                  name: drone
        name: drone-pr
