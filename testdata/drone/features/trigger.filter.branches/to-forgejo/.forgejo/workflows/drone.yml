# pipemaster:emulated trigger.filter.branches pipeline/drone/trigger/0
# pipemaster:arg {"Include":["main","develop"],"Exclude":["wip"]}
# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/build
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:1.25","Entrypoint":null},"script":["go build ./..."]}
on:
  push:
    branches:
      - main
      - develop
      - '!wip'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
