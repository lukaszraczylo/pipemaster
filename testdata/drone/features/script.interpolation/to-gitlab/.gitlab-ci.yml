workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
# pipemaster:emulated step.image pipeline/drone/job/ci
# pipemaster:arg {"job":"ci","parts":["ci"],"own":["build"]}
ci:
  image: alpine:3.20
  needs: []
  script:
    # pipemaster:step build
    - 'export PIPEMASTER_VARS=1; DRONE_BRANCH="$(if [ "${CI_PIPELINE_SOURCE}" = merge_request_event ]; then printf %s "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"; else printf %s "${CI_COMMIT_BRANCH}"; fi)"; export DRONE_BRANCH; : pipemaster-end; echo $CI_COMMIT_SHA on ${DRONE_BRANCH}'
    - 'echo "cost: $5"'
