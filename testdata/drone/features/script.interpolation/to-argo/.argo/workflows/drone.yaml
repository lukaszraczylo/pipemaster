# pipemaster:emulated script.interpolation pipeline/drone/job/ci
# pipemaster:arg {"vars":{"PM_CTX_BRANCH":"branch","PM_CTX_SHA":"sha"}}
# pipemaster:emulated trigger.filter.branches pipeline/drone/trigger/0
# pipemaster:emulated trigger.push pipeline/drone/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-branch
        value: ""
      - name: ctx-sha
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: ci
            template: ci
    - name: ci
      containerSet:
        containers:
          - name: build
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - |-
                echo ${PM_CTX_SHA} on ${PM_CTX_BRANCH}
                echo "cost: $5"
            workingDir: /workspace
            env:
              - name: PM_CTX_SHA
                value: '{{workflow.parameters.ctx-sha}}'
              - name: PM_CTX_BRANCH
                value: '{{workflow.parameters.ctx-branch}}'
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
