on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: |-
            -ec 'export PIPEMASTER_VARS=1; DRONE_BRANCH="$(if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then printf %s "${GITHUB_BASE_REF}"; elif [ "${GITHUB_REF_TYPE}" = branch ]; then printf %s "${GITHUB_REF_NAME}"; fi)"; export DRONE_BRANCH; : pipemaster-end; echo ${{ github.sha }} on ${DRONE_BRANCH}
            echo "cost: $5"'
