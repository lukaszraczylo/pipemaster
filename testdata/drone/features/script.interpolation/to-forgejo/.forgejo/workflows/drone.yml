# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.if pipeline/drone/job/ci
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/ci
# pipemaster:emulated step.image pipeline/drone/job/ci/step/build
# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.20","Entrypoint":null},"script":["echo $\u007b{ sha }} on $\u007b{ branch }}","echo \"cost: $5\""]}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: |-
            -ec 'echo ${{ github.sha }} on ${{ github.ref_type == 'branch' && github.ref_name || '' }}
            echo "cost: $5"'
