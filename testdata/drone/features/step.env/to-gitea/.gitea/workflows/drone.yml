# pipemaster:emulated step.image pipeline/drone/job/ci/step/build
# pipemaster:arg {"kind":"script","image":{"Ref":"golang:1.25","Entrypoint":null},"script":["go build ./..."]}
# pipemaster:emulated job.artifacts pipeline/drone/job/ci
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://golang:1.25
        with:
          entrypoint: /bin/sh
          args: -ec 'go build ./...'
        env:
          GOFLAGS: -trimpath
          TOKEN: ${{ secrets.deploy_token }}
