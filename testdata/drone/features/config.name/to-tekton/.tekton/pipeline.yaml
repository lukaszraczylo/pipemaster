# pipemaster:emulated config.name pipeline/drone/ref/secrets.TOKEN
# pipemaster:emulated config.name pipeline/drone/ref/vars.REGION
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: drone
spec:
  params:
    - name: ctx-sha
      default: ""
    - name: ctx-repo
      default: ""
  tasks:
    - name: ci
      taskRef:
        name: drone-ci
      params:
        - name: ctx-repo
          value: $(params.ctx-repo)
        - name: ctx-sha
          value: $(params.ctx-sha)
