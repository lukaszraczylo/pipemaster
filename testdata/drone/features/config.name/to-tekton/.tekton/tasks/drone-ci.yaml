apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: drone-ci
spec:
  params:
    - name: ctx-repo
    - name: ctx-sha
  stepTemplate:
    workingDir: /workspace
  steps:
    - name: source-checkout
      ref:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd-catalog/git-clone.git
          - name: revision
            value: v1.7.1
          - name: pathInRepo
            value: stepaction/git-clone/git-clone.yaml
      params:
        - name: url
          value: https://github.com/$(params.ctx-repo).git
        - name: revision
          value: $(params.ctx-sha)
        - name: output-path
          value: /workspace
    - name: build
      image: alpine:3.20
      script: 'curl -H "Authorization: Bearer ${TOKEN}" "https://${REGION}.example.org"'
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: ci-secrets
              key: TOKEN
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: ci-vars
              key: REGION
