# pipemaster:emulated ext.passthrough pipeline/drone
resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: ci
    plan:
      - get: source
        trigger: true
      - task: build
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            TOKEN: ((TOKEN))
            REGION: ((REGION))
          run:
            path: sh
            args:
              - -ec
              - 'curl -H "Authorization: Bearer ${TOKEN}" "https://${REGION}.example.org"'
            dir: workspace
