on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/ci/step/build
      - id: build
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: '-ec ''curl -H "Authorization: Bearer ${{ secrets.TOKEN }}" "https://${{ vars.REGION }}.example.org"'''
