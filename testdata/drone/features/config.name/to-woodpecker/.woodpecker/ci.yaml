# pipemaster:arg {"refs":["secrets.TOKEN","vars.REGION"],"pos":0}
when:
  - event: push
steps:
  - name: build
    image: alpine:3.20
    commands:
      - 'curl -H "Authorization: Bearer $${TOKEN}" "https://$${REGION}.example.org"'
    environment:
      TOKEN:
        from_secret: TOKEN
      REGION:
        from_secret: REGION
