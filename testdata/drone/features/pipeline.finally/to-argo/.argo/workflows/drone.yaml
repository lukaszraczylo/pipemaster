apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: drone
spec:
  entrypoint: main
  hooks:
    exit:
      template: exit-handler
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: exit-handler
      dag:
        tasks:
          - name: notify
            template: notify
    - name: build
      containerSet:
        containers:
          - name: build
            image: golang:1.25
            command:
              - sh
              - -ec
            args:
              - go build ./...
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: notify
      containerSet:
        containers:
          - name: notify
            image: alpine:3.20
            command:
              - sh
              - -ec
            args:
              - ./notify.sh
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
