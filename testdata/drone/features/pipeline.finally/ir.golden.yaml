origin:
    provider: drone
    dialect: drone
    files:
        - .drone.yml
pipelines:
    - id: drone
      triggers:
        - kind: push
      jobs:
        - id: build
          steps:
            - image:
                ref: golang:1.25
              id: build
              kind: script
              script:
                - go build ./...
      finally:
        - id: notify
          needs:
            - job: build
          steps:
            - image:
                ref: alpine:3.20
              id: notify
              kind: script
              script:
                - ./notify.sh
