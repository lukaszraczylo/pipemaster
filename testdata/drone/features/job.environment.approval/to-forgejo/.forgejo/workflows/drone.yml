# pipemaster:emulated pipeline.concurrency pipeline/drone
# pipemaster:emulated job.if pipeline/drone/job/deploy
# pipemaster:arg {"from":"drone","guard":true}
# pipemaster:emulated job.runner pipeline/drone/job/deploy
# pipemaster:emulated step.image pipeline/drone/job/deploy/step/deploy
# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.20","Entrypoint":null},"script":["./deploy.sh"]}
# pipemaster:emulated job.artifacts pipeline/drone/job/deploy
# pipemaster:arg {"pre":1,"post":0}
on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deploy:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: https://github.com/actions/checkout@v7
      # pipemaster:emulated step.image pipeline/drone/job/deploy/step/deploy
      - id: deploy
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec ./deploy.sh
