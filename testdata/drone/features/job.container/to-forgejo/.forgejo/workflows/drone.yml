on:
  push:
    branches:
      - '**'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  ci:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: https://github.com/actions/checkout@v7
      - id: test
        run: npm test
