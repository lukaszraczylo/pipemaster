resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: check
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: meta
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo "version=1" >> "$GITHUB_OUTPUT"
            dir: workspace
        tags:
          - ubuntu-latest
      - task: check-step-2
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                exit 0 # pipemaster:guard the step condition has no shell form
                # pipemaster:lost docker inspect {{ steps.meta.outputs.version }}
            dir: workspace
        tags:
          - ubuntu-latest
