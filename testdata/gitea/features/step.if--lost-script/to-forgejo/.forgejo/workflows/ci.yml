# pipemaster:emulated pipeline.concurrency pipeline/ci
name: ci
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - id: meta
        run: echo "version=1" >> "$GITHUB_OUTPUT"
      - name: Inspect
        if: github.event_name != 'pull_request'
        run: docker inspect ${{ steps.meta.outputs.version }}
