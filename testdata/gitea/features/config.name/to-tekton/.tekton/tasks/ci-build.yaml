# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated script.interpolation pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"refs":[{"ref":"vars.CI_MODE","name":"CI_MODE","at":[0],"of":1}]}
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-build
spec:
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo "${CI_MODE}"
      env:
        - name: KEY
          valueFrom:
            secretKeyRef:
              name: ci-secrets
              key: GITEA_DEPLOY
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: ci-secrets
              key: GITHUB_TOKEN
        - name: CI_MODE
          valueFrom:
            configMapKeyRef:
              name: ci-vars
              key: CI_MODE
