# pipemaster:emulated script.interpolation pipeline/ci/job/build
# pipemaster:arg {"vars":{"CI_MODE":"vars.CI_MODE"}}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.shell pipeline/ci/job/build/step/build-step-1
# pipemaster:emulated config.name pipeline/ci/ref/secrets.GITEA_DEPLOY
# pipemaster:emulated config.name pipeline/ci/ref/secrets.GITHUB_TOKEN
# pipemaster:emulated config.name pipeline/ci/ref/vars.CI_MODE
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: config
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo "${CI_MODE}"
            workingDir: /workspace
            env:
              - name: CI_MODE
                valueFrom:
                  configMapKeyRef:
                    name: ci-vars
                    key: CI_MODE
              - name: KEY
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: GITEA_DEPLOY
              - name: TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: GITHUB_TOKEN
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
