workflow:
  name: config
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
build:
  needs: []
  script:
    # pipemaster:step build-step-1
    # pipemaster:emulated step.env pipeline/ci/job/build/step/build-step-1
    - |
      (
      export KEY="$GITEA_DEPLOY"
      export TOKEN="$GITHUB_TOKEN"
      echo "$CI_MODE"
      )
