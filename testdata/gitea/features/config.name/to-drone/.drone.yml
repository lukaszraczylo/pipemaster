# pipemaster:arg {"at":{"vars.CI_MODE":{"at":[0],"of":1}},"refs":["vars.CI_MODE"],"pos":0}
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo "$${CI_MODE}"
    environment:
      KEY:
        from_secret: GITEA_DEPLOY
      TOKEN:
        from_secret: GITHUB_TOKEN
      CI_MODE:
        from_secret: CI_MODE
