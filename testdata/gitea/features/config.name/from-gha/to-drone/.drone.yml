kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo "$${REGION}"
    environment:
      KEY:
        from_secret: DEPLOY_KEY
      REGION:
        from_secret: REGION
      API_TOKEN:
        from_secret: API_TOKEN
