# pipemaster:emulated job.container pipeline/ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
---
# pipemaster:emulated job.container pipeline/ci/job/grouped
kind: pipeline
type: docker
name: grouped
node:
  group: big-runners
trigger:
  event:
    - push
    - tag
steps:
  - name: grouped-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
