# pipemaster:emulated step.image pipeline/ci/job/prod/step/prod-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.outputs pipeline/ci/job/prod
# pipemaster:arg {"image":"alpine:3.22","script":"printf '%s' \"${PM_OUT_0}\" \u003e '$(results.ver.path)'","outputs":[{"name":"ver","env":"PM_OUT_0"}]}
# pipemaster:emulated step.shell pipeline/ci/job/prod/step/prod-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-prod
spec:
  steps:
    - name: prod-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        make
    - name: pipemaster-outputs
      image: alpine:3.22
      script: printf '%s' "${PM_OUT_0}" > '$(results.ver.path)'
      env:
        - name: PM_OUT_0
          value: v1
  results:
    - name: ver
