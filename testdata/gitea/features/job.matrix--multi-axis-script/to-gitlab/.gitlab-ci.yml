# pipemaster:emulated script.interpolation pipeline/ci
# pipemaster:arg [{"k":"t","p":"job/test/step/test-step-1/script/0","g":"echo $os $go $ver","s":"echo $\u007b{ matrix.os }} $\u007b{ matrix.go }} $\u007b{ needs.prod.outputs.ver }}"}]
stages:
  - stage-0
  - stage-1
workflow:
  name: matrix multi axis
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
prod:
  stage: stage-0
  tags:
    - ubuntu-latest
  needs: []
  script:
    # pipemaster:step prod-step-1
    - make
    # pipemaster:emulated job.outputs pipeline/ci/job/prod
    # pipemaster:arg {"lines":["echo $os $go $ver"]}
    - echo "ver=v1" >> outputs.env
  artifacts:
    reports:
      dotenv: outputs.env
# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"Axes":[{"Name":"os","Values":["linux","mac"]},{"Name":"go","Values":["1.24","1.25"]}],"Include":null,"Exclude":[[{"Key":"go","Value":"1.24"},{"Key":"os","Value":"mac"}]],"lines":["echo $os $go $ver"]}
test:
  stage: stage-1
  tags:
    - ubuntu-latest
  needs:
    - prod
  script:
    # pipemaster:step test-step-1
    - echo $os $go $ver
  parallel:
    matrix:
      - go:
          - "1.24"
        os:
          - linux
      - go:
          - "1.25"
        os:
          - linux
      - go:
          - "1.25"
        os:
          - mac
