# pipemaster:emulated step.image pipeline/.shared/job/run/step/run-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.runner pipeline/.shared/job/run
# pipemaster:emulated step.shell pipeline/.shared/job/run/step/run-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: shared-run
spec:
  steps:
    - name: run-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo run
