# pipemaster:emulated project.multi_pipeline pipeline/.shared
# pipemaster:arg {"pipeline":".shared","job":"run","p":0,"j":0}
# pipemaster:lost trigger.* pipeline/.shared/job/run: the triggers of the pipeline have no single Drone condition
# pipemaster:emulated job.container pipeline/.shared/job/run
kind: pipeline
type: docker
name: .shared-run
trigger:
  event:
    exclude:
      - '**'
steps:
  - name: run-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo run'
---
# pipemaster:emulated project.multi_pipeline pipeline/ci
# pipemaster:arg {"pipeline":"ci","job":"build","p":1,"j":0}
# pipemaster:emulated job.container pipeline/ci/job/build
kind: pipeline
type: docker
name: ci-build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo build'
