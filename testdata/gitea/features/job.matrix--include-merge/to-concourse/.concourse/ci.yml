resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              params:
                PM_MATRIX_GO: ((.:matrix.go))
              run:
                path: sh
                args:
                  - -ec
                  - go test ${PM_MATRIX_GO}
                dir: workspace
            tags:
              - ubuntu-latest
        across:
          - var: matrix
            values:
              - go: "1.21"
                experimental: ""
              - go: "1.22"
                experimental: "true"
            max_in_flight: all
