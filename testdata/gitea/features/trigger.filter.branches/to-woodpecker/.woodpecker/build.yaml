# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated trigger.filter.branches pipeline/ci
# pipemaster:arg "- kind: pr\n  branches:\n    exclude:\n        - wip/**\n- kind: push\n  branches:\n    include:\n        - main\n        - release/**\n        - '!release/old'\n"
when:
  - event: pull_request
    branch:
      exclude:
        - wip/**
  - event: push
    branch:
      include:
        - main
        - release/**
      exclude:
        - release/old
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo ok'
