# pipemaster:emulated job.cache pipeline/gitlab-ci/job/build
# pipemaster:arg {"caches":"- key: $\u007b{ hashFiles('go.sum') }}\n  policy: pull-push\n  paths:\n    - .cache/go-build\n"}
# pipemaster:emulated step.shell pipeline/gitlab-ci/job/build/step/script
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  volumeClaimTemplates:
    - metadata:
        name: cache-build-1
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - make
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cache-build-1
            mountPath: /workspace/.cache/go-build
            subPath: p1
      volumes:
        - emptyDir: {}
          name: workspace
