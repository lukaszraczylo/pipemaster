kind: pipeline
type: docker
name: test-ubuntu-latest
trigger:
  event:
    - push
    - tag
steps:
  - name: test-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'make test'
