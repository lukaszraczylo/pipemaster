resources:
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: v*
jobs:
  - name: build
    plan:
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source-tags
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo ok
        tags:
          - ubuntu-latest
