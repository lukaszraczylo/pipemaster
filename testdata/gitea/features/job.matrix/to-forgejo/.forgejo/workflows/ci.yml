# pipemaster:emulated pipeline.concurrency pipeline/ci
name: matrix
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        go:
          - "1.24"
          - "1.25"
        include:
          - experimental: "true"
            go: "1.25"
            os: ubuntu-latest
        exclude:
          - go: "1.24"
            os: macos-latest
      fail-fast: false
      max-parallel: 2
    steps:
      - run: echo ${{ matrix.go }}
