resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - do:
          - task: test-step-1
            input_mapping:
              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              params:
                PM_MATRIX_GO: ((.:matrix.go))
              run:
                path: sh
                args:
                  - -c
                  - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
                  - pipemaster
                  - echo ${PM_MATRIX_GO}
                dir: workspace
        across:
          - var: matrix
            values:
              - go: "1.24"
                os: ubuntu-latest
                experimental: ""
              - go: "1.25"
                os: ubuntu-latest
                experimental: "true"
              - go: "1.25"
                os: macos-latest
                experimental: ""
            max_in_flight: 2
