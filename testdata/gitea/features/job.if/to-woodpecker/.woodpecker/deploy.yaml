# pipemaster:emulated job.container pipeline/ci/job/deploy
# pipemaster:lost job.if pipeline/ci/job/deploy: (ref == 'refs/heads/main') && (event == 'push')
when:
  - event: push
    evaluate: "false"
  - event: tag
    evaluate: "false"
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo deploy'
