name: outputs
on:
  push:
jobs:
  use:
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ needs.version.outputs.tag }}
  version:
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: echo "value=v1" >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.tag.outputs.value }}
