apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: outputs
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: use
            template: use
            dependencies:
              - version
            arguments:
              parameters:
                - name: needs-version-tag
                  value: '{{= (tasks[''version''].outputs.parameters[''tag''] ?? '''') }}'
          - name: version
            template: version
    - name: use
      containerSet:
        containers:
          - name: use-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo {{inputs.parameters.needs-version-tag}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: needs-version-tag
      volumes:
        - emptyDir: {}
          name: workspace
    - name: version
      containerSet:
        containers:
          - # pipemaster:id tag
            name: main
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo "value=v1" >> "$GITHUB_OUTPUT"
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      outputs:
        parameters:
          - name: tag
            valueFrom:
              path: /workspace/.pipemaster/outputs/tag
              default: ""
      volumes:
        - emptyDir: {}
          name: workspace
