resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: golang
              tag: "1.24"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -c
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - go version
            dir: workspace
