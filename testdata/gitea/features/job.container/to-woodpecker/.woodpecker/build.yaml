# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:arg {"Ref":"golang:1.24","Entrypoint":null}
when:
  - event: push
  - event: tag
steps:
  - image: golang:1.24
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'go version'
