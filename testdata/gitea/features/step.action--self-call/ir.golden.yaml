origin:
    provider: gitea
    dialect: gitea
    files:
        - .gitea/workflows/ci.yml
pipelines:
    - id: ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: call
          steps:
            - action:
                kind: repo
                host: 'self:'
                owner: org
                repo: shared
                path: .gitea/workflows/build.yml
                ref: main
              ext:
                gha:
                    _derived_id: true
              id: call-step-1
              kind: pipeline_call
        - id: plain
          runner:
            labels:
                - ubuntu-latest
          steps:
            - ext:
                gha:
                    _derived_id: true
              id: plain-step-1
              kind: script
              script:
                - echo ok
