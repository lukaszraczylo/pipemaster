# pipemaster:emulated job.container pipeline/ci/job/build
kind: pipeline
type: docker
name: build
trigger:
  event:
    - push
    - tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo "$$GREETING"'
    environment:
      GREETING: hello ${DRONE_COMMIT_AUTHOR}
      KEY:
        from_secret: KEY
