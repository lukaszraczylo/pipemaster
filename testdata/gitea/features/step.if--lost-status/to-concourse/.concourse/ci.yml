resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo build
            dir: workspace
        tags:
          - ubuntu-latest
      - task: build-step-2
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                exit 0 # pipemaster:guard the step condition has no shell form
                echo cleanup
            dir: workspace
        tags:
          - ubuntu-latest
      - task: config
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo "configured=true" >> "$GITHUB_OUTPUT"
            dir: workspace
        tags:
          - ubuntu-latest
      - task: build-step-4
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                exit 0 # pipemaster:guard the step condition has no shell form
                echo configured
            dir: workspace
        tags:
          - ubuntu-latest
