                  - '# pipemaster:lost echo {{ matrix.os }} {{ inputs.target }} {{ env.REGION }} {{ vars.LEVEL }}'
                dir: workspace
        across:
          - var: os
            values:
              - ubuntu-latest
              - macos-latest
            max_in_flight: all
