# pipemaster:emulated job.matrix pipeline/ci/job/test
# pipemaster:arg {"include":[[{"Key":"python","Value":"3.13"}],[{"Key":"os","Value":"macos-latest"},{"Key":"python","Value":"3.14"}]]}
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.push pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: expression label
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
            withItems:
              - python: "3.13"
                os: ""
              - python: "3.14"
                os: macos-latest
            arguments:
              parameters:
                - name: python
                  value: '{{item.python}}'
                - name: os
                  value: '{{item.os}}'
    - name: test
      containerSet:
        containers:
          - name: test-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo test
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: python
          - name: os
      volumes:
        - emptyDir: {}
          name: workspace
