# pipemaster:emulated project.multi_pipeline pipeline/deploy
# pipemaster:arg {"pipeline":"deploy","job":"deploy","p":1,"j":0}
# pipemaster:emulated job.container pipeline/deploy/job/deploy
when:
  - event: manual
steps:
  - image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo deploy'
