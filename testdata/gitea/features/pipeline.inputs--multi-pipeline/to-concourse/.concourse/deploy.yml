resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: deploy
    plan:
      - get: source
      - task: deploy-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - echo deploy
            dir: workspace
        tags:
          - ubuntu-latest
