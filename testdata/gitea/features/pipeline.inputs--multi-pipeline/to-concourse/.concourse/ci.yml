resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: test
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: test-step-1
