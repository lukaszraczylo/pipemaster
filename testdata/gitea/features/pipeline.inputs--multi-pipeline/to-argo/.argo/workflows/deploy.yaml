# pipemaster:emulated pipeline.inputs pipeline/deploy
# pipemaster:arg {"types":{"target":"choice"},"required":["target"]}
# pipemaster:emulated project.multi_pipeline pipeline/deploy
# pipemaster:emulated job.runner pipeline/deploy/job/deploy
# pipemaster:emulated step.shell pipeline/deploy/job/deploy/step/deploy-step-1
# pipemaster:emulated trigger.manual pipeline/deploy/trigger/0
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deploy
  annotations:
    workflows.argoproj.io/title: Deploy
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: target
        value: staging
        description: Where to deploy
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy
            template: deploy
    - name: deploy
      containerSet:
        containers:
          - name: deploy-step-1
            image: alpine:3.22
            command:
              - sh
              - -c
            args:
              - if command -v bash >/dev/null 2>&1; then exec bash -e -c "$1"; fi; exec sh -e -c "$1"
              - pipemaster
              - echo deploy
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
