# pipemaster:emulated project.multi_pipeline pipeline/ci
# pipemaster:arg {"pipeline":"ci","job":"test","p":0,"j":0}
# pipemaster:emulated job.container pipeline/ci/job/test
kind: pipeline
type: docker
name: ci-test
trigger:
  event:
    - push
    - tag
steps:
  - name: test-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo test'
---
# pipemaster:emulated project.multi_pipeline pipeline/deploy
# pipemaster:arg {"pipeline":"deploy","job":"deploy","p":1,"j":0}
# pipemaster:emulated trigger.manual pipeline/deploy/trigger/0
# pipemaster:emulated job.container pipeline/deploy/job/deploy
kind: pipeline
type: docker
name: deploy-deploy
trigger:
  event:
    - custom
steps:
  - name: deploy-step-1
    image: ubuntu:latest
    commands:
      - sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -e -c "$$1"; fi; exec sh -e -c "$$1"' pipemaster 'echo deploy'
