# pipemaster:emulated step.image pipeline/ci/job/ship/step/ship-step-1
# pipemaster:arg {"image":"alpine:3.22"}
# pipemaster:emulated job.runner pipeline/ci/job/ship
# pipemaster:emulated step.shell pipeline/ci/job/ship/step/ship-step-1
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-ship
spec:
  steps:
    - name: ship-step-1
      image: alpine:3.22
      script: |-
        #!/bin/sh
        if [ -z "${PIPEMASTER_BASH:-}" ] && command -v bash >/dev/null 2>&1; then PIPEMASTER_BASH=1 exec bash -e "$0"; fi
        set -e
        echo ship
