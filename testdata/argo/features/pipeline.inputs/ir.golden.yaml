origin:
    provider: argo
    dialect: argo
    files:
        - .argo/workflows/ci.yaml
pipelines:
    - id: ci
      name: inputs
      inputs:
        - name: environment
          type: choice
          default: staging
          description: Where to deploy
          required: true
        - name: dry-run
          type: boolean
          default: "false"
          description: Skip the push
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo ok
