# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"argo","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"src":"event == 'push'","from":"argo"}
name: stepif
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        if: always()
        run: echo cleanup
      - id: build-step-2
        if: github.event_name == 'push'
        run: echo push
