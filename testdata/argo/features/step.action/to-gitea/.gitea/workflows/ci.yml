# pipemaster:emulated job.runner pipeline/ci/job/build
name: action
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          token: ${{ secrets.PAT }}
      - id: build-step-2
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - id: build-step-3
        uses: docker://alpine:3.20
      - id: local
        uses: ./.github/actions/setup
