# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"argo","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
name: stepenv
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        run: echo "$GREETING"
        env:
          GREETING: hello ${{ github.actor }}
          KEY: ${{ secrets.KEY }}
