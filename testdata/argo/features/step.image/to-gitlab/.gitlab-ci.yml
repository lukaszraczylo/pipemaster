stages:
  - stage-0
  - stage-1
workflow:
  name: base
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
# pipemaster:emulated step.image pipeline/ci/job/build
# pipemaster:arg {"job":"build","parts":["build"],"own":["build-step-1"]}
build:
  stage: stage-0
  image:
    name: alpine:3.20
    entrypoint:
      - ""
  needs: []
  script:
    # pipemaster:step build-step-1
    - make build
deploy:
  stage: stage-1
  needs:
    - build
  script:
    # pipemaster:step deploy-step-1
    - make deploy
