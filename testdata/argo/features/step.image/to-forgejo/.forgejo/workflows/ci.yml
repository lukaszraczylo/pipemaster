name: base
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
      - id: build-step-1
        uses: docker://alpine:3.20
        with:
          entrypoint: /bin/sh
          args: -ec 'make build'
  deploy:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - id: deploy-step-1
        run: make deploy
