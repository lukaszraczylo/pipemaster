# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/flaky
# pipemaster:arg {"from":"argo","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/flaky
name: allow
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  flaky:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - id: flaky-step-1
        run: echo ok
