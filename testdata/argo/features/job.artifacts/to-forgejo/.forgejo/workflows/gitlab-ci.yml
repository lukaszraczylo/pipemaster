# pipemaster:emulated pipeline.concurrency pipeline/gitlab-ci
# pipemaster:emulated job.runner pipeline/gitlab-ci/job/build
# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
# pipemaster:arg {"artifacts":[{"Name":"bin","Expire":"1 week","Paths":["bin/"]}],"pre":0,"post":1}
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make
      # pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/build
      - uses: https://github.com/actions/upload-artifact@v7
        with:
          name: bin
          path: bin/
          retention-days: 7
