# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"argo","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
name: Build and test
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    name: Build the binary
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        name: Compile
        run: go build ./...
