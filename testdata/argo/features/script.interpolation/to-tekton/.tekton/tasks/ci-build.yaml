# pipemaster:emulated step.image pipeline/ci/job/build/step/build-step-1
# pipemaster:arg {"image":"alpine:3.22"}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-build
spec:
  params:
    - name: ctx-sha
    - name: ctx-ref-name
  steps:
    - name: build-step-1
      image: alpine:3.22
      script: |-
        echo "sha ${PM_CTX_SHA} on ${PM_CTX_REF_NAME}"
        # pipemaster:lost script.interpolation: echo "{{ gha.github.workspace }}"
        printf '%s\n' 'pipemaster: lost: script.interpolation pipeline/ci/job/build/step/build-step-1: no Tekton spelling for expression gha.github.workspace; the line is replaced by a line that prints the loss and exits 1' >&2; exit 1
      env:
        - name: PM_CTX_SHA
          value: $(params.ctx-sha)
        - name: PM_CTX_REF_NAME
          value: $(params.ctx-ref-name)
