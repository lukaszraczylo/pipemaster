# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:arg {"kind":"push"}
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
# pipemaster:arg {"kind":"tag"}
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
deploy:
  needs: []
  script:
    - make deploy
  when: manual
