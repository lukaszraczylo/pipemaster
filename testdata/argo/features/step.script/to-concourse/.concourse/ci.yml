resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                go build ./...
                go test ./...
            dir: workspace
