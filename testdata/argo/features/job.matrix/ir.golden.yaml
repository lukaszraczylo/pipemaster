origin:
    provider: argo
    dialect: argo
    files:
        - .argo/events/eventsource.yaml
        - .argo/events/sensor.yaml
        - .argo/rbac/sensor.yaml
        - .argo/rbac/workflow.yaml
        - .argo/workflows/ci.yaml
pipelines:
    - id: ci
      name: matrix
      triggers:
        - ext:
            argo:
                dependency:
                    eventName: push
                    eventSourceName: pipemaster-github
                    name: ci-push
                eventSource:
                    entry:
                        active: true
                        contentType: json
                        events:
                            - push
                        repositories:
                            - names:
                                - REPO
                              owner: OWNER
                        webhook:
                            endpoint: /push
                            method: POST
                            port: "12000"
                            url: ""
                        webhookSecret:
                            key: token
                            name: pipemaster-github-webhook
                    event: push
                    name: pipemaster-github
                    spec:
                        service:
                            ports:
                                - port: 12000
                                  targetPort: 12000
                    type: github
                sensor:
                    name: pipemaster
                    spec:
                        template:
                            serviceAccountName: pipemaster-sensor
                trigger:
                    template:
                        conditions: ci-push
                        k8s:
                            operation: create
                            source:
                                resource:
                                    apiVersion: argoproj.io/v1alpha1
                                    kind: Workflow
                                    metadata:
                                        generateName: ci-
                                    spec:
                                        serviceAccountName: pipemaster-workflow
                                        workflowTemplateRef:
                                            name: ci
                        name: ci-push
          kind: push
        - ext:
            argo:
                dependency:
                    eventName: push
                    eventSourceName: pipemaster-github
                    filters:
                        data:
                            - path: body.ref
                              type: string
                              value:
                                - ^refs/tags/.*$
                    name: ci-tag
                eventSource:
                    entry:
                        active: true
                        contentType: json
                        events:
                            - push
                        repositories:
                            - names:
                                - REPO
                              owner: OWNER
                        webhook:
                            endpoint: /push
                            method: POST
                            port: "12000"
                            url: ""
                        webhookSecret:
                            key: token
                            name: pipemaster-github-webhook
                    event: push
                    name: pipemaster-github
                    spec:
                        service:
                            ports:
                                - port: 12000
                                  targetPort: 12000
                    type: github
                sensor:
                    name: pipemaster
                    spec:
                        template:
                            serviceAccountName: pipemaster-sensor
                trigger:
                    template:
                        conditions: ci-tag
                        k8s:
                            operation: create
                            source:
                                resource:
                                    apiVersion: argoproj.io/v1alpha1
                                    kind: Workflow
                                    metadata:
                                        generateName: ci-
                                    spec:
                                        serviceAccountName: pipemaster-workflow
                                        workflowTemplateRef:
                                            name: ci
                        name: ci-tag
          kind: tag
      jobs:
        - matrix:
            fail_fast: false
            axes:
                - name: os
                  values:
                    - ubuntu-latest
                    - macos-latest
                - name: go
                  values:
                    - "1.24"
                    - "1.25"
            include:
                - - key: experimental
                    value: "true"
                  - key: go
                    value: "1.25"
                  - key: os
                    value: ubuntu-latest
            exclude:
                - - key: go
                    value: "1.24"
                  - key: os
                    value: macos-latest
            max_parallel: 2
          id: test
          steps:
            - id: test-step-1
              kind: script
              script:
                - echo ${{ matrix.go }}
