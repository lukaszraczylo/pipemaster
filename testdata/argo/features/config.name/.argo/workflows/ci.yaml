apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: config
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo "${REGION}"
            workingDir: /workspace
            env:
              - name: API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: API_TOKEN
              - name: REGION
                valueFrom:
                  configMapKeyRef:
                    name: ci-vars
                    key: REGION
              - name: KEY
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: DEPLOY_KEY
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
