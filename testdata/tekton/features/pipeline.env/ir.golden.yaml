origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: env
      triggers:
        - kind: push
        - kind: tag
      env:
        - name: CGO_ENABLED
          value:
            lit: "0"
        - name: VERSION
          value:
            lit: "3.1"
        - name: TOKEN
          value:
            secret: DEPLOY_TOKEN
        - name: LABEL
          value:
            expr: format('build-{0}', gha.github.run_number)
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo ok
