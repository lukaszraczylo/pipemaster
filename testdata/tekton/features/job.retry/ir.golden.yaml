origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/gitlab-ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - retry:
            attempts: 3
          id: build
          steps:
            - id: script
              kind: script
              script:
                - make
