# pipemaster:emulated config.name pipeline/ci/ref/secrets.KEY
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: stepenv
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-actor
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo "$GREETING"
            workingDir: /workspace
            env:
              - name: GREETING
                value: hello {{workflow.parameters.ctx-actor}}
              - name: KEY
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: KEY
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
