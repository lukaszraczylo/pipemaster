origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: stepenv
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo "$GREETING"
              env:
                - name: GREETING
                  value:
                    expr: format('hello {0}', actor)
                - name: KEY
                  value:
                    secret: KEY
