# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: allow
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: flaky
            template: flaky
            continueOn:
              failed: true
    - name: flaky
      containerSet:
        containers:
          - name: flaky-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo ok
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
