origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-flaky.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: allow
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: flaky
          steps:
            - id: flaky-step-1
              kind: script
              script:
                - echo ok
          allow_failure: true
