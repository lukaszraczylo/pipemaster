              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - '# pipemaster:lost echo {{ needs.version.outputs.tag }}'
            dir: workspace
  - name: version
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: tag
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
