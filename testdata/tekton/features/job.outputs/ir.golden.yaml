origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-use.yaml
        - .tekton/tasks/ci-version.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: outputs
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: use
          needs:
            - job: version
          steps:
            - id: use-step-1
              kind: script
              script:
                - echo ${{ needs.version.outputs.tag }}
        - id: version
          steps:
            - id: tag
              kind: script
              script:
                - echo "value=v1" >> "$GITHUB_OUTPUT"
          outputs:
            - name: tag
