origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: opaque
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - if: 'opaque(tekton): {"input":"pipemaster-disabled","operator":"in","values":["never"]}'
          id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - '# pipemaster:lost script.interpolation: echo {{ opaque(gha): env[github.job] }}'
