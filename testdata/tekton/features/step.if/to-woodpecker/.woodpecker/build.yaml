# pipemaster:emulated job.container pipeline/ci/job/build
# pipemaster:emulated step.if pipeline/ci/job/build/step/build-step-2
# pipemaster:arg {"src":"event == 'push'","from":"tekton"}
when:
  - event: push
  - event: tag
steps:
  - name: build-step-1
    image: ubuntu:latest
    commands:
      - echo cleanup
  - name: build-step-2
    image: ubuntu:latest
    commands:
      - echo push
    when:
      - event:
          - push
          - tag
