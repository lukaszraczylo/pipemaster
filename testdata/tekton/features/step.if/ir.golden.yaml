origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: stepif
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - ext:
            tekton:
                unused_params:
                    ctx-event: $(params.ctx-event)
          id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo cleanup
            - if: event == 'push'
              id: build-step-2
              kind: script
              script:
                - echo push
