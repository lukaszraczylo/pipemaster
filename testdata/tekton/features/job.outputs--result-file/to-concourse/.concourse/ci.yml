        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
