  - name: version
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: tag
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.22"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
