resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: use
    plan:
      - get: source
        passed:
          - version
        trigger: true
      - get: source-tags
      - task: use-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - |-
                # pipemaster:lost echo {{ needs.version.outputs.tag }}
                printf '%s\n' 'pipemaster: lost: script.interpolation pipeline/ci/job/use/step/use-step-1: no Concourse spelling for expression needs.version.outputs.tag; the line is replaced by a line that prints the loss and exits 1' >&2; exit 1
            dir: workspace
  - name: version
    plan:
      - get: source
        trigger: true
      - get: source-tags
        trigger: true
      - task: tag
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.22"
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          run:
            path: sh
            args:
              - -ec
              - printf '%s' v1 > /dev/null
            dir: workspace
