      uri: ((git-uri))
  - name: source-tags
    type: git
    source:
      uri: ((git-uri))
      tag_filter: '*'
jobs:
  - name: use
    plan:
      - get: source
        passed:
          - version
        trigger: true
      - get: source-tags
