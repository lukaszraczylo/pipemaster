apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: outputs
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: use
            template: use
            dependencies:
              - version
            arguments:
              parameters:
                - name: needs-version-tag
                  value: '{{= (tasks[''version''].outputs.parameters[''tag''] ?? '''') }}'
          - name: version
            template: version
    - name: use
      containerSet:
        containers:
          - name: use-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo {{inputs.parameters.needs-version-tag}}
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        parameters:
          - name: needs-version-tag
      volumes:
        - emptyDir: {}
          name: workspace
    - name: version
      containerSet:
        containers:
          - # pipemaster:id tag
            name: main
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - printf '%s' v1 > /dev/null
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      outputs:
        parameters:
          - name: tag
            valueFrom:
              path: /workspace/.pipemaster/outputs/tag
              default: ""
      volumes:
        - emptyDir: {}
          name: workspace
