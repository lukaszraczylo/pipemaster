# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/use
# pipemaster:arg {"from":"tekton","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/use
# pipemaster:emulated job.if pipeline/ci/job/version
# pipemaster:arg {"from":"tekton","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/version
# pipemaster:emulated step.image pipeline/ci/job/version/step/tag
# pipemaster:arg {"kind":"script","image":{"Ref":"alpine:3.22","Entrypoint":null},"script":["printf '%s' v1 \u003e $(results.tag.path)"]}
name: outputs
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  use:
    needs:
      - version
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: use-step-1
        run: echo ${{ needs.version.outputs.tag }}
  version:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      # pipemaster:emulated step.image pipeline/ci/job/version/step/tag
      - id: tag
        uses: docker://alpine:3.22
        with:
          entrypoint: /bin/sh
          args: -ec 'printf '\''%s'\'' v1 > /dev/null'
    outputs:
      tag: ""
