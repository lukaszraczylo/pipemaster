origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/tasks/ci-deploy.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: base
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: build
          steps:
            - image:
                ref: alpine:3.20
              id: build-step-1
              kind: script
              script:
                - make build
        - id: deploy
          needs:
            - job: build
          steps:
            - id: deploy-step-1
              kind: script
              script:
                - make deploy
