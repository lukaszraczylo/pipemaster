# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.if pipeline/ci/job/build
# pipemaster:arg {"from":"tekton","guard":true}
# pipemaster:emulated job.runner pipeline/ci/job/build
name: interp
on:
  push:
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        run: |
          echo "sha ${{ github.sha }} on ${PIPEMASTER_REF_1}"
          # pipemaster:lost script.interpolation: echo "{{ gha.github.workspace }}"
        env:
          PIPEMASTER_REF_1: ${{ github.ref_name }}
