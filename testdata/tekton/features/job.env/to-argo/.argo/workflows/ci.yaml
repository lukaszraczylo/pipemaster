# pipemaster:emulated job.env pipeline/ci/job/build
# pipemaster:arg {"vars":"- name: GOFLAGS\n  value:\n    lit: -trimpath\n- name: API\n  value:\n    secret: API_KEY\n","names":["GOFLAGS","API"]}
# pipemaster:emulated config.name pipeline/ci/ref/secrets.API_KEY
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: jobenv
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      containerSet:
        containers:
          - name: build-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo ok
            workingDir: /workspace
            env:
              - name: GOFLAGS
                value: -trimpath
              - name: API
                valueFrom:
                  secretKeyRef:
                    name: ci-secrets
                    key: API_KEY
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
