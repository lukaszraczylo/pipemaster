# pipemaster:emulated job.services pipeline/ci/job/test/service/db
# pipemaster:arg {"ports":["5432:5432"]}
# pipemaster:emulated job.services pipeline/ci/job/test
# pipemaster:emulated config.name pipeline/ci/ref/secrets.DB_PASSWORD
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: services
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: test
            template: test
    - name: test
      containerSet:
        containers:
          - name: test-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo ok
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      sidecars:
        - name: db
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ci-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
        - name: cache
          image: redis:7
      volumes:
        - emptyDir: {}
          name: workspace
