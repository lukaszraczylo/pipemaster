origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: branches
      triggers:
        - kind: pr
          branches:
            exclude:
                - wip/**
        - kind: push
          branches:
            include:
                - main
                - release/**
                - '!release/old'
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo ok
