name: branches
on:
  pull_request:
    branches-ignore:
      - wip/**
  push:
    branches:
      - main
      - release/**
      - '!release/old'
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        run: echo ok
