# pipemaster:emulated pipeline.concurrency pipeline/ci
# pipemaster:emulated job.runner pipeline/ci/job/build
name: branches
on:
  pull_request:
    branches-ignore:
      - wip/**
  push:
    branches:
      - main
      - release/**
      - '!release/old'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        run: echo ok
