origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-lint.yaml
        - .tekton/tasks/ci-ship.yaml
        - .tekton/tasks/ci-test.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: needs
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: lint
          steps:
            - id: lint-step-1
              kind: script
              script:
                - echo lint
        - id: ship
          needs:
            - job: lint
            - job: test
          steps:
            - id: ship-step-1
              kind: script
              script:
                - echo ship
        - id: test
          steps:
            - id: test-step-1
              kind: script
              script:
                - echo test
