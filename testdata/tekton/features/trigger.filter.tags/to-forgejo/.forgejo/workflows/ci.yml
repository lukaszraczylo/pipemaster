name: tags
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - '!v*-rc*'
concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: build-step-1
        run: echo ok
