# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/0
# pipemaster:emulated trigger.push pipeline/ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci
  annotations:
    workflows.argoproj.io/title: cond
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: ctx-event
        value: ""
      - name: ctx-ref
        value: ""
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy
            template: deploy
            when: '{{= (workflow.parameters[''ctx-ref''] == ''refs/heads/main'') && (workflow.parameters[''ctx-event''] == ''push'') }}'
    - name: deploy
      containerSet:
        containers:
          - name: deploy-step-1
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - echo deploy
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
