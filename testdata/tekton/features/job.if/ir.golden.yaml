origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-deploy.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: cond
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - if: (ref == 'refs/heads/main') && (event == 'push')
          id: deploy
          steps:
            - id: deploy-step-1
              kind: script
              script:
                - echo deploy
