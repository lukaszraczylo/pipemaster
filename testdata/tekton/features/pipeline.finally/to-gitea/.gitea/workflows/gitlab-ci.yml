on:
  push:
jobs:
  build:
    if: '!github.event.deleted'
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: make build
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  alert:
    needs:
      - build
    if: always() && failure() && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: ./page.sh
  # pipemaster:emulated pipeline.finally pipeline/gitlab-ci
  report:
    needs:
      - build
    if: always() && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - id: script
        run: ./notify.sh
