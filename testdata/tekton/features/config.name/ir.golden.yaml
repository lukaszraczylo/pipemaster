origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: config
      triggers:
        - kind: push
        - kind: tag
      env:
        - name: API_TOKEN
          value:
            secret: API_TOKEN
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo "${{ vars.REGION }}"
              env:
                - name: KEY
                  value:
                    secret: DEPLOY_KEY
