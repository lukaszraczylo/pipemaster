resources:
  - name: source
    type: git
    source:
      uri: ((git-uri))
jobs:
  - name: build
    plan:
      - get: source
        trigger: true
      - task: build-step-1
        input_mapping:
          workspace: source
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: ubuntu
              tag: latest
          inputs:
            - name: workspace
          outputs:
            - name: workspace
          params:
            KEY: ((DEPLOY_KEY))
            API_TOKEN: ((API_TOKEN))
            REGION: ((REGION))
          run:
            path: sh
            args:
              - -ec
              - echo "${REGION}"
            dir: workspace
