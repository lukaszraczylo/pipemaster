origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/gitlab-ci-compile.yaml
        - .tekton/tasks/gitlab-ci-docs.yaml
        - .tekton/tasks/gitlab-ci-unit.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: gitlab-ci
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - id: compile
          steps:
            - id: script
              kind: script
              script:
                - make
          artifacts:
            - paths:
                - bin/
        - id: docs
          needs:
            - job: compile
          steps:
            - id: script
              kind: script
              script:
                - make docs
        - id: unit
          needs:
            - job: compile
              artifacts: true
          steps:
            - id: script
              kind: script
              script:
                - make test
