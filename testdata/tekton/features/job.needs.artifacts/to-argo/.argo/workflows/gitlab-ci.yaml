# pipemaster:emulated job.artifacts pipeline/gitlab-ci/job/compile
# pipemaster:arg {"arts":"- paths:\n    - bin/\n","names":["artifact"],"outs":["{\"name\":\"artifact\",\"path\":\"/workspace/bin/\"}"]}
# pipemaster:emulated job.needs.artifacts pipeline/gitlab-ci/job/unit
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.push pipeline/gitlab-ci/trigger/0
# pipemaster:emulated trigger.filter.branches pipeline/gitlab-ci/trigger/1
# pipemaster:emulated trigger.tag pipeline/gitlab-ci/trigger/1
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gitlab-ci
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: compile
            template: compile
          - name: docs
            template: docs
            dependencies:
              - compile
          - name: unit
            template: unit
            dependencies:
              - compile
            arguments:
              artifacts:
                - name: artifact
                  from: '{{tasks.compile.outputs.artifacts.artifact}}'
    - name: compile
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      outputs:
        artifacts:
          - name: artifact
            path: /workspace/bin/
      volumes:
        - emptyDir: {}
          name: workspace
    - name: docs
      containerSet:
        containers:
          - name: script
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make docs
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - emptyDir: {}
          name: workspace
    - name: unit
      containerSet:
        containers:
          - # pipemaster:id script
            name: main
            image: alpine:3.22
            command:
              - sh
              - -ec
            args:
              - make test
            workingDir: /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      inputs:
        artifacts:
          - name: artifact
            path: /workspace/artifacts/artifact
      volumes:
        - emptyDir: {}
          name: workspace
