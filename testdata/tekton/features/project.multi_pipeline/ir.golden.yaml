origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/tasks/shared-run.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: .shared
      name: shared
      jobs:
        - ext:
            tekton:
                _carried:
                    - task_name
                task_name: shared-run
          id: run
          steps:
            - id: run-step-1
              kind: script
              script:
                - echo run
    - id: ci
      name: CI
      triggers:
        - kind: push
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo build
