              workspace: source
            config:
              platform: linux
              image_resource:
                type: registry-image
                source:
                  repository: ubuntu
                  tag: latest
              inputs:
                - name: workspace
              outputs:
                - name: workspace
              params:
                PM_MATRIX_GO: ((.:matrix.go))
              run:
                path: sh
                args:
                  - -ec
                  - echo ${PM_MATRIX_GO}
                dir: workspace
        across:
          - var: matrix
            values:
              - go: "1.24"
                os: ubuntu-latest
                experimental: ""
              - go: "1.25"
                os: ubuntu-latest
                experimental: "true"
              - go: "1.25"
                os: macos-latest
                experimental: ""
            max_in_flight: all
