origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-test.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: matrix
      triggers:
        - kind: push
        - kind: tag
      jobs:
        - matrix:
            axes:
                - name: os
                  values:
                    - ubuntu-latest
                    - macos-latest
                - name: go
                  values:
                    - "1.24"
                    - "1.25"
            include:
                - - key: experimental
                    value: "true"
                  - key: go
                    value: "1.25"
                  - key: os
                    value: ubuntu-latest
            exclude:
                - - key: go
                    value: "1.24"
                  - key: os
                    value: macos-latest
          id: test
          steps:
            - id: test-step-1
              kind: script
              script:
                - echo ${{ matrix.go }}
