origin:
    provider: tekton
    dialect: tekton
    files:
        - .tekton/kustomization.yaml
        - .tekton/pipeline.yaml
        - .tekton/rbac/triggers.yaml
        - .tekton/tasks/ci-build.yaml
        - .tekton/triggers/eventlistener.yaml
        - .tekton/triggers/triggerbinding.yaml
        - .tekton/triggers/triggertemplate.yaml
pipelines:
    - id: ci
      name: paths
      triggers:
        - kind: pr
          paths:
            exclude:
                - '**.md'
        - kind: push
          paths:
            include:
                - src/**
                - '!src/docs/**'
        - kind: tag
          paths:
            include:
                - src/**
                - '!src/docs/**'
      jobs:
        - id: build
          steps:
            - id: build-step-1
              kind: script
              script:
                - echo ok
