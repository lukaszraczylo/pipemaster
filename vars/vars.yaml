# One mapping table for the predefined variables that scripts read. Each entry names a variable by its
# canonical id and lists the spelling on each provider. A script that reads a name that the target does not
# set gets a shell prelude that defines the name from the target spelling (see prelude.go).
#
# Sources checked on 2026-11-24:
docs:
  gitlab: https://docs.gitlab.com/ci/variables/predefined_variables/
  gha: https://docs.github.com/en/actions/reference/workflows-and-actions/variables
  drone: https://docs.drone.io/pipeline/environment/reference/
  woodpecker: https://woodpecker-ci.org/docs/usage/environment
  tekton: https://tekton.dev/docs/pipelines/variables/
  argo: https://argo-workflows.readthedocs.io/en/latest/variables/
  concourse: https://concourse-ci.org/docs/resource-types/implementing/

# Providers that set the name as a shell variable. A provider that is absent from every entry (Tekton, Argo,
# Concourse) sets none: Tekton and Argo carry the canonical context in reserved workflow parameters
# (expr/ctxparam), and Concourse documents BUILD_* only for resources, not for task containers.
#
# names:   spellings of the variable on a provider; the first one is the one the prelude reads.
# canon:   canonical expr ref. Tekton and Argo spell it through a reserved parameter when ctxparam has one.
# derive:  shell text that computes the value on a provider with no name for it. @id@ stands for the value of
#          another entry on the same provider. The text uses backticks, because Tekton reads "$(".
# literal: value on a provider that sets nothing but should read the same.
# values:  name of a table in "events" that maps the value of the variable between providers.
vars:
  ci:
    names: {gitlab: CI, gha: CI, drone: CI, woodpecker: CI}
    literal: {tekton: "true", argo: "true", concourse: "true"}
  commit_sha:
    canon: sha
    names: {gitlab: CI_COMMIT_SHA, drone: [DRONE_COMMIT_SHA, DRONE_COMMIT], woodpecker: CI_COMMIT_SHA, gha: GITHUB_SHA}
  commit_short_sha:
    names: {gitlab: CI_COMMIT_SHORT_SHA}
    derive: {default: '`printf %.8s "@commit_sha@"`'}
  # GitLab CI_COMMIT_BRANCH: "Available in branch pipelines, including pipelines for the default branch. Not
  # available in merge request pipelines or tag pipelines." (gitlab doc). Woodpecker CI_COMMIT_BRANCH "equals
  # target branch for pull requests" (woodpecker doc), and Drone sets DRONE_COMMIT_BRANCH from build.Target
  # (drone/runner-go environ.Build), so a target that spells it natively must be empty on PR and tag events.
  branch:
    canon: branch
    script_text: true
    names: {gitlab: CI_COMMIT_BRANCH}
    derive:
      woodpecker: '`if [ -z "${CI_COMMIT_TAG}" ] && [ "${CI_PIPELINE_EVENT}" != pull_request ]; then printf %s "${CI_COMMIT_BRANCH}"; fi`'
      drone: '`if [ -z "${DRONE_TAG}" ] && [ "${DRONE_BUILD_EVENT}" != pull_request ]; then printf %s "${DRONE_COMMIT_BRANCH}"; fi`'
      # gha doc, GITHUB_REF_TYPE: "Valid values are branch or tag."
      gha: '`if [ "${GITHUB_REF_TYPE}" = branch ] && [ "${GITHUB_EVENT_NAME}" != pull_request ]; then printf %s "${GITHUB_REF_NAME}"; fi`'
  # The value that Woodpecker and Drone call the branch: the target branch on a pull request.
  # A field has no script to hold a derivation, so the target spells the same value in its own field syntax.
  # gitlab doc: CI_MERGE_REQUEST_TARGET_BRANCH_NAME is "available in merge request pipelines" only and
  # CI_COMMIT_BRANCH is "Not available in merge request pipelines", so exactly one of the two is set on a branch
  # or merge request pipeline. gitlab doc (variables, where they can be used): `image` expands variables in the
  # runner, https://docs.gitlab.com/ci/variables/where_variables_can_be_used/.
  #
  # Drone DRONE_BRANCH is build.Target (drone/runner-go environ.Build, DRONE_BRANCH: build.Target). On a tag
  # event the hook sets Target from the tag ref (drone v2.25.0 service/hook/parser/parse.go, scm.TagHook:
  # Target v.Ref.Name) or from the push hook's BaseRef, which may be empty (same file, tag push: Target
  # scm.TrimRef(v.BaseRef)). So the value on a tag event is a tag name or a base branch, by SCM driver, and no
  # target form can match it. A field spelling holds on the kinds in field_events; the step stops on a tag event
  # with a message. A run with no branch (a tag run) fails a branch filter, and Drone matches the filter against
  # Target (drone v2.25.0 trigger/skip.go:24-26), so a branch-filtered pipeline admits push and pull request only.
  # A pipeline with no event filter admits every event (drone-yaml yaml/cond.go:42-53, trigger/skip.go:32-34).
  # (inferred from the same Target source) a schedule or manual run keeps the branch of the run in Target, and
  # GitLab and GHA carry the branch of those runs too. Tekton and Argo give the context params no value on a
  # schedule or manual run, so those kinds stay unlisted there.
  branch_or_target:
    script_text: true
    push_canon: branch
    field_events: {default: [push, pr], gitlab: [push, pr, schedule, manual], gha: [push, pr, schedule, manual]}
    field:
      gha: "${{ event == 'pull_request' && pr.base_ref || ref_name }}"
      gitlab: '${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}${CI_COMMIT_BRANCH}'
      tekton: '${{ branch }}${{ pr.base_ref }}'
      argo: '${{ branch }}${{ pr.base_ref }}'
    names: {drone: [DRONE_COMMIT_BRANCH, DRONE_BRANCH], woodpecker: CI_COMMIT_BRANCH}
    derive:
      gitlab: '`if [ "${CI_PIPELINE_SOURCE}" = merge_request_event ]; then printf %s "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"; else printf %s "${CI_COMMIT_BRANCH}"; fi`'
      gha: '`if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then printf %s "${GITHUB_BASE_REF}"; elif [ "${GITHUB_REF_TYPE}" = branch ]; then printf %s "${GITHUB_REF_NAME}"; fi`'
  tag:
    canon: tag
    script_text: true
    names: {gitlab: CI_COMMIT_TAG, drone: DRONE_TAG, woodpecker: CI_COMMIT_TAG}
    derive:
      gha: '`if [ "${GITHUB_REF_TYPE}" = tag ]; then printf %s "${GITHUB_REF_NAME}"; fi`'
  # GitLab CI_COMMIT_REF_NAME: "The branch or tag name for which project is built." On a merge request
  # pipeline it is the source branch. GHA GITHUB_REF_NAME on a pull request is "<pr_number>/merge" (gha doc),
  # so the GHA name has its own entry below.
  ref_name:
    canon: ref_name
    script_text: true
    names: {gitlab: CI_COMMIT_REF_NAME}
    derive:
      woodpecker: '`if [ -n "${CI_COMMIT_TAG}" ]; then printf %s "${CI_COMMIT_TAG}"; elif [ "${CI_PIPELINE_EVENT}" = pull_request ]; then printf %s "${CI_COMMIT_SOURCE_BRANCH}"; else printf %s "${CI_COMMIT_BRANCH}"; fi`'
      drone: '`if [ -n "${DRONE_TAG}" ]; then printf %s "${DRONE_TAG}"; elif [ "${DRONE_BUILD_EVENT}" = pull_request ]; then printf %s "${DRONE_SOURCE_BRANCH}"; else printf %s "${DRONE_COMMIT_BRANCH}"; fi`'
      gha: '`if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then printf %s "${GITHUB_HEAD_REF}"; else printf %s "${GITHUB_REF_NAME}"; fi`'
  # No other provider has "<pr_number>/merge", so the value is lost on pull request events (run-time guard).
  ref_name_gha:
    canon: ref_name
    names: {gha: GITHUB_REF_NAME}
    lost_on_pr: [gha]
    derive:
      gitlab: '`printf %s "${CI_COMMIT_REF_NAME}"`'
      woodpecker: '`if [ -n "${CI_COMMIT_TAG}" ]; then printf %s "${CI_COMMIT_TAG}"; else printf %s "${CI_COMMIT_BRANCH}"; fi`'
      drone: '`if [ -n "${DRONE_TAG}" ]; then printf %s "${DRONE_TAG}"; else printf %s "${DRONE_COMMIT_BRANCH}"; fi`'
  ref:
    canon: ref
    names: {drone: DRONE_COMMIT_REF, woodpecker: CI_COMMIT_REF, gha: GITHUB_REF}
    derive:
      gitlab: '`if [ -n "${CI_COMMIT_TAG}" ]; then printf refs/tags/%s "${CI_COMMIT_TAG}"; else printf refs/heads/%s "${CI_COMMIT_REF_NAME}"; fi`'
  repo:
    canon: repo
    names: {gitlab: CI_PROJECT_PATH, drone: DRONE_REPO, woodpecker: CI_REPO, gha: GITHUB_REPOSITORY}
  repo_name:
    names: {gitlab: CI_PROJECT_NAME, drone: DRONE_REPO_NAME, woodpecker: CI_REPO_NAME}
    derive: {default: '`basename "@repo@"`'}
  repo_namespace:
    names: {gitlab: CI_PROJECT_NAMESPACE, drone: DRONE_REPO_NAMESPACE, woodpecker: CI_REPO_OWNER}
    derive: {default: '`dirname "@repo@"`'}
  workspace:
    names: {gitlab: CI_PROJECT_DIR, drone: DRONE_WORKSPACE, woodpecker: CI_WORKSPACE, gha: GITHUB_WORKSPACE}
  run_number:
    names: {gitlab: CI_PIPELINE_IID, drone: DRONE_BUILD_NUMBER, woodpecker: CI_PIPELINE_NUMBER, gha: GITHUB_RUN_NUMBER}
  run_id:
    names: {gitlab: CI_PIPELINE_ID, gha: GITHUB_RUN_ID}
  job_id:
    names: {gitlab: CI_JOB_ID}
  job_name:
    names: {gitlab: CI_JOB_NAME, drone: DRONE_STAGE_NAME, gha: GITHUB_JOB}
  # A tag push is a push on GitLab ("push") and GHA ("push"), and the "tag" event on Drone and Woodpecker.
  event:
    canon: event
    script_text: true
    values: events
    names: {gitlab: CI_PIPELINE_SOURCE, drone: DRONE_BUILD_EVENT, woodpecker: CI_PIPELINE_EVENT, gha: GITHUB_EVENT_NAME}
  pr_number:
    canon: pr.number
    names: {gitlab: CI_MERGE_REQUEST_IID, drone: DRONE_PULL_REQUEST, woodpecker: CI_COMMIT_PULL_REQUEST}
    derive:
      gha: '`printf %s "${GITHUB_REF}" | sed -n "s#^refs/pull/\([0-9]*\)/.*#\1#p"`'
  # gitlab doc: "The source branch name of the merge request." (merge request pipelines only). woodpecker doc,
  # CI_COMMIT_SOURCE_BRANCH: "set only for pull request events". gha doc, GITHUB_HEAD_REF: "only set when the
  # event ... is either pull_request or pull_request_target". Drone sets DRONE_SOURCE_BRANCH from build.Source
  # on every event (drone/runner-go environ.Build), so Drone derives it on pull requests only.
  pr_source_branch:
    canon: pr.head_ref
    script_text: true
    names: {gitlab: CI_MERGE_REQUEST_SOURCE_BRANCH_NAME, woodpecker: CI_COMMIT_SOURCE_BRANCH, gha: GITHUB_HEAD_REF}
    derive:
      drone: '`if [ "${DRONE_BUILD_EVENT}" = pull_request ]; then printf %s "${DRONE_SOURCE_BRANCH}"; fi`'
  pr_target_branch:
    canon: pr.base_ref
    script_text: true
    names: {gitlab: CI_MERGE_REQUEST_TARGET_BRANCH_NAME, woodpecker: CI_COMMIT_TARGET_BRANCH, gha: GITHUB_BASE_REF}
    derive:
      drone: '`if [ "${DRONE_BUILD_EVENT}" = pull_request ]; then printf %s "${DRONE_TARGET_BRANCH}"; fi`'
  default_branch:
    canon: default_branch
    names: {gitlab: CI_DEFAULT_BRANCH, drone: DRONE_REPO_BRANCH, woodpecker: CI_REPO_DEFAULT_BRANCH}
  # gitlab doc: GITLAB_USER_LOGIN is "the unique username of the user who started the pipeline". gha doc:
  # GITHUB_ACTOR is "the name of the person or app that initiated the workflow". woodpecker doc:
  # CI_PIPELINE_AUTHOR is the "pipeline author username". Drone DRONE_COMMIT_AUTHOR is the commit author
  # (build.Author, author_login), which is another person on a re-run, so Drone has no source.
  actor:
    canon: actor
    script_text: true
    names: {gitlab: GITLAB_USER_LOGIN, woodpecker: CI_PIPELINE_AUTHOR, gha: GITHUB_ACTOR}
  # gitlab CI_SERVER_URL and gha GITHUB_SERVER_URL are the forge. woodpecker CI_FORGE_URL is the "root URL of
  # configured forge"; CI_SYSTEM_URL is the Woodpecker server. Drone sets no forge URL variable
  # (drone/runner-go environ), so Drone has no source.
  # The commit author, not the person who started the pipeline: no other provider names it.
  commit_author:
    script_text: true
    names: {drone: DRONE_COMMIT_AUTHOR, woodpecker: CI_COMMIT_AUTHOR}
  server_url:
    names: {gitlab: CI_SERVER_URL, woodpecker: CI_FORGE_URL, gha: GITHUB_SERVER_URL}
  commit_message:
    names: {gitlab: CI_COMMIT_MESSAGE, drone: DRONE_COMMIT_MESSAGE, woodpecker: CI_COMMIT_MESSAGE}
  # gitlab doc: CI_COMMIT_BEFORE_SHA is "the previous latest commit present on a branch or tag". Drone
  # DRONE_COMMIT_BEFORE is build.Before, the push before-SHA. Woodpecker CI_PREV_COMMIT_SHA is the commit of the
  # previous pipeline and GHA has no environment variable for github.event.before, so neither has a source.
  before_sha:
    canon: before_sha
    script_text: true
    names: {gitlab: CI_COMMIT_BEFORE_SHA, drone: DRONE_COMMIT_BEFORE}
  pipeline_url:
    names: {gitlab: CI_PIPELINE_URL, drone: DRONE_BUILD_LINK, woodpecker: CI_PIPELINE_URL}
    derive:
      gha: '`printf %s "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"`'

# Event values per provider, keyed by the canonical (GHA-named) event. Tekton and Argo carry the canonical value.
events:
  push: {gitlab: push, drone: [push, tag], woodpecker: [push, tag], gha: push}
  pull_request: {gitlab: merge_request_event, drone: pull_request, woodpecker: pull_request, gha: pull_request}
  schedule: {gitlab: schedule, drone: cron, woodpecker: cron, gha: schedule}
  workflow_dispatch: {gitlab: web, drone: custom, woodpecker: manual, gha: workflow_dispatch}

# Names that other code handles: file commands and tokens.
skip: [GITHUB_OUTPUT, GITHUB_ENV, GITHUB_PATH, GITHUB_STATE, GITHUB_STEP_SUMMARY, GITHUB_TOKEN]

# Prefixes that mark a name as a predefined variable of a provider, for the names that no entry lists.
prefixes:
  gitlab: [CI_, GITLAB_]
  woodpecker: [CI_, WOODPECKER_]
  drone: [DRONE_]
  gha: [GITHUB_, RUNNER_]

